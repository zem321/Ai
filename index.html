<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Oracle AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --ease:cubic-bezier(0.22,1,0.36,1);
  --bg:#F5F4F0;
  --surface:#FFFFFF;
  --surface-2:#FAFAF8;
  --text:#1A1A18;
  --text-2:#2D2D2A;
  --sub:#8E8E86;
  --sub-2:#A8A8A0;
  --accent:#C96A3C;
  --accent-2:#B85A2E;
  --check:#3478F6;
  --border:rgba(0,0,0,.06);
  --border-2:rgba(0,0,0,.10);
  --bubble-user:#E8E8E3;
  --bubble-bot:transparent;
  --sb-bg:#F2F1ED;
  --sb-border:rgba(0,0,0,.06);
  --ic:#FFFFFF;
  --ic-border:rgba(0,0,0,.08);
  --ic-shadow:0 2px 16px rgba(0,0,0,.06), 0 0 1px rgba(0,0,0,.04);
  --pill:#F0F0EC;
  --pill-border:rgba(0,0,0,.06);
  --pill-text:#5A5A54;
  --sh-bg:rgba(255,255,255,.94);
  --sh-list:#F8F8F6;
  --sh-sep:rgba(0,0,0,.06);
  --cp:#F0F0EC;
  --sb-item-bg:#ECEAE6;
  --sb-item-border:rgba(0,0,0,.07);
  --sb-item-active:#E2E0DC;
  --send-bg:#1A1A18;
  --send-icon:#FFFFFF;
  --glass-bg-light:linear-gradient(160deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 45%,rgba(255,255,255,.28) 100%);
  --glass-bg-dark:linear-gradient(160deg,rgba(255,255,255,.15) 0%,rgba(255,255,255,.05) 45%,rgba(255,255,255,.10) 100%);
  --glass-border-light:rgba(255,255,255,.65);
  --glass-border-dark:rgba(255,255,255,.18);
  --glass-shadow-light:0 6px 24px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.06),inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(0,0,0,.04);
  --glass-shadow-dark:0 6px 28px rgba(0,0,0,.55),0 1px 4px rgba(0,0,0,.35),inset 0 1.5px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.45);
  --glass-blur-light:blur(28px) saturate(200%) brightness(1.06);
  --glass-blur-dark:blur(28px) saturate(180%) brightness(1.04);
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#111110;
    --surface:#1A1A18;
    --surface-2:#1E1E1C;
    --text:#F0F0EB;
    --text-2:#E0E0DB;
    --sub:#6A6A64;
    --sub-2:#50504A;
    --border:rgba(255,255,255,.06);
    --border-2:rgba(255,255,255,.10);
    --bubble-user:#252523;
    --bubble-bot:transparent;
    --sb-bg:#111110;
    --sb-border:rgba(255,255,255,.06);
    --ic:#1E1E1C;
    --ic-border:rgba(255,255,255,.08);
    --ic-shadow:0 2px 16px rgba(0,0,0,.25), 0 0 1px rgba(255,255,255,.04);
    --pill:#252523;
    --pill-border:rgba(255,255,255,.08);
    --pill-text:#A0A09A;
    --sh-bg:rgba(30,30,28,.96);
    --sh-list:#272725;
    --sh-sep:rgba(255,255,255,.06);
    --cp:#272725;
    --sb-item-bg:#2A2A28;
    --sb-item-border:rgba(255,255,255,.08);
    --sb-item-active:#323230;
    --send-bg:#F0F0EB;
    --send-icon:#1A1A18;
  }
}

html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:16px;
  line-height:1.5;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-text-size-adjust:100%;
  position:fixed;
  width:100%;
  -webkit-touch-callout:none;
}

.app{
  display:flex;flex-direction:column;
  height:100%;
  max-width:430px;margin:0 auto;
  position:relative;
  overflow:hidden;
  transition:height 0.3s cubic-bezier(0.1, 0.76, 0.55, 0.94);
}

/* === LIQUID GLASS SYSTEM === */

/* === LIQUID GLASS SYSTEM === */
/* 
   True Liquid Glass: transmits light from content beneath,
   minimal specular highlights, refraction-aware.
   The key difference from frosted glass: content BELOW is 
   visible through the material, not fully obscured.
*/

.liquid-glass-circle{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.10) 45%,rgba(255,255,255,.20) 100%);
  backdrop-filter:blur(32px) saturate(220%) brightness(1.08);
  -webkit-backdrop-filter:blur(32px) saturate(220%) brightness(1.08);
  border:1.2px solid rgba(255,255,255,.55);
  box-shadow:
    0 4px 16px rgba(0,0,0,.08),
    0 1px 3px rgba(0,0,0,.04),
    inset 0 1px 0 rgba(255,255,255,.75),
    inset 0 -0.5px 0 rgba(0,0,0,.03);
  border-radius:50%;
  -webkit-tap-highlight-color:transparent;
  transition:transform .5s var(--ease), opacity .3s var(--ease);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
/* Subtle top refraction — very faint */
.liquid-glass-circle::before{
  content:'';position:absolute;top:0;left:0;right:0;height:45%;
  background:linear-gradient(180deg,rgba(255,255,255,.22) 0%,transparent 100%);
  border-radius:50% 50% 55% 55%;
  pointer-events:none;z-index:1;
}
/* Very faint corner highlight */
.liquid-glass-circle::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.14) 0%,transparent 60%);
  pointer-events:none;z-index:1;
}
.liquid-glass-circle>*{position:relative;z-index:2;}
.liquid-glass-circle:active{transform:scale(.90);opacity:.88;}

@media(prefers-color-scheme:dark){
  .liquid-glass-circle{
    background:linear-gradient(160deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 45%,rgba(255,255,255,.08) 100%);
    border-color:transparent;
    box-shadow:
      0 4px 20px rgba(0,0,0,.45),
      0 1px 3px rgba(0,0,0,.30),
      inset 0 -0.5px 0 rgba(0,0,0,.40);
    backdrop-filter:blur(2px) saturate(105%) brightness(.72) !important;
    -webkit-backdrop-filter:blur(2px) saturate(105%) brightness(.72) !important;
  }
  .liquid-glass-circle::before{background:linear-gradient(180deg,rgba(255,255,255,.06) 0%,transparent 100%);}
  .liquid-glass-circle::after{background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.05) 0%,transparent 60%);}
}

.liquid-glass-circle.inc-on{
  background:linear-gradient(160deg,rgba(201,106,60,.35),rgba(201,106,60,.15));
  border-color:rgba(201,106,60,.42);
  box-shadow:0 4px 18px rgba(201,106,60,.25),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -0.5px 0 rgba(0,0,0,.06);
}

/* Glass pill for model selector, send, plus */
.liquid-glass-pill{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.25) 0%,rgba(255,255,255,.08) 45%,rgba(255,255,255,.18) 100%);
  backdrop-filter:blur(26px) saturate(210%) brightness(1.06);
  -webkit-backdrop-filter:blur(26px) saturate(210%) brightness(1.06);
  border:1.1px solid rgba(255,255,255,.50);
  box-shadow:
    0 3px 12px rgba(0,0,0,.07),
    0 1px 2px rgba(0,0,0,.04),
    inset 0 1px 0 rgba(255,255,255,.70),
    inset 0 -0.5px 0 rgba(0,0,0,.02);
  border-radius:999px;
  -webkit-tap-highlight-color:transparent;
  transition:transform .45s var(--ease), opacity .3s var(--ease);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.liquid-glass-pill::before{
  content:'';position:absolute;top:0;left:0;right:0;height:42%;
  background:linear-gradient(180deg,rgba(255,255,255,.10) 0%,transparent 100%);
  border-radius:999px 999px 0 0;
  pointer-events:none;z-index:1;
}
.liquid-glass-pill::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 18%,rgba(255,255,255,.065) 0%,transparent 55%);
  pointer-events:none;z-index:1;
}
.liquid-glass-pill>*{position:relative;z-index:2;}
.liquid-glass-pill:active{transform:scale(.94);opacity:.88;}

@media(prefers-color-scheme:dark){
  .liquid-glass-pill{
    background:linear-gradient(160deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.02) 45%,rgba(255,255,255,.06) 100%);
    border-color:transparent;
    box-shadow:
      0 3px 14px rgba(0,0,0,.42),
      0 1px 2px rgba(0,0,0,.28),
      inset 0 -0.5px 0 rgba(0,0,0,.38);
    backdrop-filter:blur(2px) saturate(105%) brightness(.72) !important;
    -webkit-backdrop-filter:blur(2px) saturate(105%) brightness(.72) !important;
  }
  .liquid-glass-pill::before{background:linear-gradient(180deg,rgba(255,255,255,.04) 0%,transparent 100%);}
  .liquid-glass-pill::after{background:radial-gradient(ellipse at 30% 18%,rgba(255,255,255,.04) 0%,transparent 55%);}
}

/* Glass card for sidebar items, sheet cards */
.liquid-glass-card{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.06) 45%,rgba(255,255,255,.16) 100%);
  backdrop-filter:blur(24px) saturate(200%) brightness(1.05);
  -webkit-backdrop-filter:blur(24px) saturate(200%) brightness(1.05);
  border:1.1px solid rgba(255,255,255,.48);
  box-shadow:
    0 3px 14px rgba(0,0,0,.07),
    0 1px 2px rgba(0,0,0,.04),
    inset 0 1px 0 rgba(255,255,255,.65),
    inset 0 -0.5px 0 rgba(0,0,0,.02);
  border-radius:14px;
  -webkit-tap-highlight-color:transparent;
  transition:transform .5s var(--ease), opacity .3s var(--ease);
  cursor:pointer;
}
.liquid-glass-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:40%;
  background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,transparent 100%);
  border-radius:14px 14px 0 0;
  pointer-events:none;z-index:1;
}
.liquid-glass-card::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 25% 16%,rgba(255,255,255,.10) 0%,transparent 55%);
  pointer-events:none;z-index:1;
}
.liquid-glass-card>*{position:relative;z-index:2;}
.liquid-glass-card:active{transform:scale(.97);opacity:.92;}

@media(prefers-color-scheme:dark){
  .liquid-glass-card{
    background:linear-gradient(160deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.02) 45%,rgba(255,255,255,.05) 100%);
    border-color:transparent;
    box-shadow:
      0 3px 16px rgba(0,0,0,.40),
      0 1px 2px rgba(0,0,0,.25),
      inset 0 -0.5px 0 rgba(0,0,0,.35);
    backdrop-filter:blur(2px) saturate(105%) brightness(.72) !important;
    -webkit-backdrop-filter:blur(2px) saturate(105%) brightness(.72) !important;
  }
  .liquid-glass-card::before{background:linear-gradient(180deg,rgba(255,255,255,.04) 0%,transparent 100%);}
  .liquid-glass-card::after{background:radial-gradient(ellipse at 25% 16%,rgba(255,255,255,.03) 0%,transparent 55%);}
}

/* === TOPBAR === */
.topbar{
  position:absolute;
  top:0;left:0;right:0;
  z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 10px;
  background:transparent;
  pointer-events:none;
}
.top-btn{
  width:40px;height:40px;color:var(--text);border:none;font-family:inherit;
  pointer-events:auto;
  background:linear-gradient(160deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.40) 45%,rgba(255,255,255,.48) 100%);
  backdrop-filter:blur(5px) saturate(135%) brightness(.92);
  -webkit-backdrop-filter:blur(5px) saturate(135%) brightness(.92);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.12),
    inset 0 -0.5px 0 rgba(0,0,0,.018);
}

/* === WELCOME === */
.welcome{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:6px;padding-bottom:32px;
}
.welcome-star{position:relative;width:58px;height:58px;margin-bottom:4px;}
.welcome-star .lime-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;}
.welcome h1{
  font-size:28px;font-weight:400;letter-spacing:-.6px;
  font-family:'Georgia','Times New Roman',serif;color:var(--text);
}

/* === INCOGNITO === */
.inc-screen{
  flex:1;display:none;flex-direction:column;
  align-items:center;justify-content:center;
  gap:14px;padding:24px 36px;text-align:center;
}
.inc-screen.show{display:flex;animation:fadeUp .86s var(--ease) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.inc-icon{font-size:42px;}
.inc-title{font-size:19px;font-weight:600;color:var(--text);}
.inc-desc{font-size:15px;color:var(--sub);line-height:1.6;max-width:280px;}

/* === MESSAGES === */
.messages{
  flex:1;overflow-y:auto;
  min-height:0;
  -webkit-overflow-scrolling:touch;
  padding:64px 16px 112px;
  display:flex;flex-direction:column;gap:18px;
}
.messages::-webkit-scrollbar{width:0;}
.messages::-webkit-scrollbar-thumb{background:transparent;}

.msg-row{display:flex;animation:msgIn .78s var(--ease) both;}
.msg-row.user{justify-content:flex-end;}
.msg-row.bot{justify-content:flex-start;}
@keyframes msgIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

.user-bubble{
  max-width:80%;
  background:var(--bubble-user);
  border-radius:20px 20px 4px 20px;
  padding:11px 16px;
  font-size:16px;line-height:1.5;
  color:var(--text);word-break:break-word;
}
.bot-msg{
  max-width:90%;padding-left:0;
  transition:max-height 0.25s cubic-bezier(0.1, 0.76, 0.55, 0.94);
}
.bot-text{font-size:16px;line-height:1.65;color:var(--text-2);word-break:break-word;}
.bot-text b,.bot-text strong{font-weight:600;color:var(--text);}
.bot-text code {
  font-family: 'Courier New', Courier, monospace;
  background-color: rgba(0, 0, 0, 0.05);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 14px;
  color: var(--accent);
}
.bot-text pre.code-block {
  font-family: 'Courier New', Courier, monospace;
  background-color: rgba(0, 0, 0, 0.04);
  padding: 12px;
  border-radius: 8px;
  font-size: 14px;
  overflow-x: auto;
  margin: 8px 0;
  border: 1px solid var(--border);
}
.bot-text pre.code-block code {
  background-color: transparent;
  padding: 0;
  border-radius: 0;
  color: var(--text-2);
}
.bot-text .markdown-link {
  color: var(--accent);
  text-decoration: underline;
  font-weight: 500;
}
.bot-text .markdown-link:hover {
  color: var(--accent-2);
}
.bot-text .formula-block {
  text-align: center;
  font-size: 17px;
  margin: 12px 0;
  padding: 10px;
  background-color: rgba(0, 0, 0, 0.02);
  border-radius: 8px;
  line-height: 1.5;
}
.bot-text .formula-inline {
  font-size: 16px;
  padding: 0 2px;
}
.bot-text ul, .bot-text ol {
  margin: 6px 0 6px 20px;
  padding-left: 18px;
}
.bot-text ul ul, .bot-text ol ol, .bot-text ul ol, .bot-text ol ul {
  margin-top: 4px;
  margin-bottom: 4px;
}
.bot-text li {
  margin-bottom: 4px;
}
.bot-text .task-list-item {
  list-style: none;
  margin-left: -18px;
}
.bot-text .task-list-item input[type="checkbox"] {
  width: 15px;
  height: 15px;
  margin: 0 7px 0 0;
  vertical-align: -2px;
  accent-color: var(--accent);
}
.bot-text blockquote {
  margin: 8px 0;
  padding: 8px 12px;
  border-left: 3px solid var(--accent);
  background: rgba(0, 0, 0, 0.025);
  border-radius: 0 8px 8px 0;
  color: var(--text-2);
}
.bot-text blockquote pre.code-block {
  margin: 6px 0;
}
.bot-text table.markdown-table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
  font-size: 14px;
  overflow: hidden;
  border-radius: 8px;
}
.bot-text table.markdown-table th, .bot-text table.markdown-table td {
  border: 1px solid var(--border-2);
  padding: 7px 9px;
  text-align: left;
  vertical-align: top;
}
.bot-text table.markdown-table th {
  background: rgba(0, 0, 0, 0.035);
  font-weight: 600;
  color: var(--text);
}
.bot-text table.markdown-table tr:nth-child(even) td {
  background: rgba(0, 0, 0, 0.015);
}
.bot-text del {
  color: var(--sub);
}
.bot-text .markdown-image {
  max-width: 100%;
  border-radius: 10px;
  display: block;
  margin: 8px 0;
}
.bot-text hr {
  border: none;
  border-top: 1px solid var(--border-2);
  margin: 12px 0;
}
.bot-text pre.code-block {
  position: relative;
}
.bot-text pre.code-block[data-lang]::before {
  display: none;
}
.bot-text .code-token.comment { color: #7A7A72; font-style: italic; }
.bot-text .code-token.keyword { color: #B85A2E; font-weight: 600; }
.bot-text .code-token.string { color: #2F7D52; }
.bot-text .code-token.number { color: #3478F6; }
.bot-text .code-token.function { color: #8A63D2; }
.bot-text .code-token.operator, .bot-text .code-token.punctuation { color: var(--sub); }
.bot-text .code-token.tag { color: #B85A2E; }
.bot-text .code-token.attr { color: #8A63D2; }
.bot-text .code-token.value { color: #2F7D52; }
.bot-text h1, .bot-text h2, .bot-text h3 {
  margin-top: 12px;
  margin-bottom: 6px;
  font-weight: 600;
  color: var(--text);
}

.msg-actions{margin-top:10px;margin-bottom:14px;display:flex;gap:6px;}

.copy-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;
  background:var(--cp);border:none;border-radius:50%;
  padding:0;color:var(--sub);
  cursor:pointer;font-family:inherit;
  transition:color .42s var(--ease), background .42s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.copy-btn:hover{color:var(--text);}
.copy-btn.done{background:var(--accent);color:#fff;}

.typing-loader{display:flex;gap:8px;align-items:center;padding:4px 0;}
.loader-img{width:26px;height:26px;object-fit:contain;display:block;}
.anim-perfect-spin{transform-origin:center center;animation:spinOnly 3.5s linear infinite;}
@keyframes spinOnly{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.anim-pulse-glow{transform-origin:center center;animation:moderatePulse 2.6s ease-in-out infinite;}
@keyframes moderatePulse{
  0%,100%{transform:scale(.85);filter:drop-shadow(0 0 4px rgba(74,222,128,.3));opacity:.6}
  50%{transform:scale(1.08);filter:drop-shadow(0 0 16px rgba(74,222,128,.85));opacity:1}
}

/* === INPUT AREA === */
.input-area{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  z-index:20;
  padding:6px 12px calc(max(env(safe-area-inset-bottom), 10px) + 6px);
  background:transparent;
  -webkit-tap-highlight-color:transparent;
  pointer-events:none;
}
.input-card{pointer-events:auto;}
.input-card{
  /* transparent glass like model picker, without outer background-colored frame */
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.54) 0%,rgba(255,255,255,.39) 48%,rgba(255,255,255,.46) 100%);
  backdrop-filter:blur(5px) saturate(135%) brightness(.92);
  -webkit-backdrop-filter:blur(5px) saturate(135%) brightness(.92);
  border-radius:26px;
  border:none;
  padding:12px 12px 10px 16px;
  display:flex;flex-direction:column;gap:8px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.075),
    inset 0 -0.5px 0 rgba(0,0,0,.018);
  -webkit-tap-highlight-color:transparent;
  transition:background .58s var(--ease), box-shadow .58s var(--ease), backdrop-filter .58s var(--ease), -webkit-backdrop-filter .58s var(--ease);
}
.input-card:focus-within{
  border:none;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.075),
    inset 0 -0.5px 0 rgba(0,0,0,.018);
}

/* === CRITICAL iOS FIXES === */
textarea{
  width:100%;background:transparent;border:none;
  outline:none !important;box-shadow:none !important;
  -webkit-appearance:none;appearance:none;
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:16px;line-height:1.45;letter-spacing:-.01em;
  resize:none;min-height:24px;max-height:120px;
  display:block;padding:0;margin:0;
  caret-color:var(--accent);
  -webkit-text-size-adjust:100%;
  transform:translateZ(0);
}

/* === MODEL SHEET === */

/* === MODEL SHEET — Frosted Glass bottom picker === */
.sheet-bd{
  position:fixed;inset:0;
  /* остальной фон не блюрим */
  background:transparent;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  z-index:50;
  opacity:0;pointer-events:none;
  transition:opacity .36s cubic-bezier(0.22,1,0.36,1);
}
.sheet-bd.open{opacity:1;pointer-events:all;}

.sheet{
  position:fixed;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom, 0px) + 28px);
  width:min(82%, 318px);
  max-width:318px;
  height:188px;
  margin:0;
  transform:translate(-50%,18px) scale(.972);
  transform-origin:bottom center;
  opacity:0;
  border-radius:24px;
  z-index:60;
  padding:6px 0;
  pointer-events:none;
  overflow:hidden;
  will-change:transform,opacity;
  transition:
    opacity .76s cubic-bezier(0.22,1,0.36,1),
    transform .76s cubic-bezier(0.22,1,0.36,1);

  /* Frosted Glass AI Model Picker — реальная прозрачность */
  background:linear-gradient(160deg,rgba(255,255,255,.025) 0%,rgba(255,255,255,.003) 48%,rgba(255,255,255,.012) 100%);
  backdrop-filter:blur(10px) saturate(176%) brightness(1.015);
  -webkit-backdrop-filter:blur(10px) saturate(176%) brightness(1.015);
  border:1px solid rgba(255,255,255,.075);
  box-shadow:
    0 10px 30px rgba(0,0,0,.12),
    0 3px 12px rgba(0,0,0,.045),
    inset 0 1px 0 rgba(255,255,255,.075),
    inset 0 -0.5px 0 rgba(0,0,0,.018);
}

.sheet::before{
  content:'';position:absolute;top:0;left:0;right:0;height:44%;
  background:linear-gradient(180deg,rgba(255,255,255,.012) 0%,transparent 100%);
  border-radius:24px 24px 0 0;
  pointer-events:none;z-index:1;
}
.sheet::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 28% 16%,rgba(255,255,255,.006) 0%,transparent 58%);
  pointer-events:none;z-index:1;
}

.sheet.open{
  opacity:1;
  transform:translate(-50%,0) scale(1);
  pointer-events:all;
}

.sheet-drag{display:none;}
.sheet-header{display:none;}
.sheet-done{display:none;}
.sheet-title{display:none;}

.model-sheet-list{
  height:100%;
  margin:0;
  background:transparent;
  overflow:hidden;
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  transition:opacity .58s cubic-bezier(0.22,1,0.36,1), transform .58s cubic-bezier(0.22,1,0.36,1);
  will-change:opacity,transform;
}
.model-list-layer{
  position:absolute;
  inset:0;
  width:100%;height:100%;
  display:flex;
  flex-direction:column;
  transition:opacity .58s cubic-bezier(0.22,1,0.36,1), transform .58s cubic-bezier(0.22,1,0.36,1), filter .58s cubic-bezier(0.22,1,0.36,1);
  will-change:opacity,transform,filter;
}
.model-list-layer.old{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
.model-list-layer.new{opacity:0;transform:translateY(8px) scale(.99);filter:blur(1.5px);}
.model-sheet-list.switching .model-list-layer.old{opacity:0;transform:translateY(-7px) scale(.99);filter:blur(1.5px);}
.model-sheet-list.switching .model-list-layer.new{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
.ms-item{
  display:flex;align-items:center;justify-content:space-between;
  flex:1 1 0;
  min-height:0;
  padding:0 14px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background .46s var(--ease), transform .46s var(--ease), border-color .46s var(--ease), opacity .46s var(--ease);
  border-radius:14px;
  margin:1px 8px;
  border:1px solid transparent;
  background:rgba(255,255,255,.0015);
}
.ms-item:active{transform:scale(.982);background:rgba(255,255,255,.10);}
.ms-item.active{
  background:transparent;
  border-color:transparent;
}
.ms-group .ms-name{font-size:14px;}
.ms-arrow{color:var(--sub);font-size:18px;line-height:1;opacity:.72;margin-left:10px;}
.ms-back{
  flex:1 1 0;
  min-height:0;
  padding:0 14px;
  color:var(--sub);
}
.ms-back .ms-name{font-size:13px;font-weight:600;color:var(--sub);}
.ms-info{flex:1;min-width:0;}
.ms-name{
  font-size:14px;font-weight:600;
  color:var(--text);
  letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ms-desc{display:none;}
.ms-check{
  flex-shrink:0;margin-left:10px;
  opacity:0;transform:scale(.4);color:#22C55E;
  transition:
    opacity .35s cubic-bezier(0.25,0.46,0.45,0.94),
    transform .35s cubic-bezier(0.34,1.56,0.64,1);
}
.ms-item.active .ms-check{opacity:1;transform:scale(1);}
.ms-sep{
  flex:0 0 .5px;
  height:.5px;
  background:rgba(0,0,0,.045);
  margin:0 18px;
}

@media(prefers-color-scheme:dark){
  .input-card{
    background:linear-gradient(160deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.09) 45%,rgba(255,255,255,.13) 100%);
    border: none !important;
    box-shadow:
      inset 0 -0.5px 0 rgba(0,0,0,.34);
    backdrop-filter:blur(2px) saturate(105%) brightness(.72) !important;
    -webkit-backdrop-filter:blur(2px) saturate(105%) brightness(.72) !important;
  }
  .input-card:focus-within{
    border: none !important;
    box-shadow:
      inset 0 -0.5px 0 rgba(0,0,0,.34);
  }
  .top-btn,
  .pill-plus,
  .pill-model{
    background:linear-gradient(160deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.09) 45%,rgba(255,255,255,.13) 100%);
    border: none !important;
    backdrop-filter:blur(2px) saturate(105%) brightness(.72) !important;
    -webkit-backdrop-filter:blur(2px) saturate(105%) brightness(.72) !important;
    box-shadow:
      inset 0 -0.5px 0 rgba(0,0,0,.34);
  }
}

@media(prefers-color-scheme:dark){
  .sheet-bd{
    background:transparent;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
  }
  .sheet{
    background:linear-gradient(160deg,rgba(255,255,255,.014) 0%,rgba(255,255,255,.002) 45%,rgba(255,255,255,.006) 100%);
    border-color:rgba(255,255,255,.026);
    box-shadow:
      0 10px 30px rgba(0,0,0,.46),
      0 3px 12px rgba(0,0,0,.26),
      inset 0 1px 0 rgba(255,255,255,.075),
      inset 0 -0.5px 0 rgba(0,0,0,.34);
    backdrop-filter:blur(10px) saturate(165%) brightness(1.015);
    -webkit-backdrop-filter:blur(10px) saturate(165%) brightness(1.015);
  }
  .sheet::before{background:linear-gradient(180deg,rgba(255,255,255,.06) 0%,transparent 100%);}
  .sheet::after{background:radial-gradient(ellipse at 28% 16%,rgba(255,255,255,.04) 0%,transparent 58%);}
  .ms-item{background:rgba(255,255,255,.0015);}
  .ms-item:active{background:rgba(255,255,255,.09);}
  .ms-name{color:var(--text);}
  .ms-desc{color:var(--sub);}
  .ms-sep{background:rgba(0,0,0,.35) !important;}
}

.attach-thumb{
  position:relative;flex-shrink:0;
  width:72px;height:72px;border-radius:10px;
  overflow:hidden;background:var(--pill);
  animation:thumbIn .6s var(--ease) both;
  border:1px solid var(--border);
}
@keyframes thumbIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.attach-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.attach-thumb .file-icon{
  width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:18px;
}
.attach-thumb .file-name{
  font-size:8px;color:var(--sub);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:48px;padding:0 3px;
}
.attach-thumb .rm-btn{
  position:absolute;top:4px;right:4px;
  width:18px;height:18px;border-radius:50%;
  background:rgba(0,0,0,.65);color:#fff;
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;
  -webkit-tap-highlight-color:transparent;
}
.bubble-attachments{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
.bubble-img{width:100%;max-width:60px;border-radius:8px;display:block;box-shadow:0 1px 3px rgba(0,0,0,.12);}
.msg-row.user.user-stack{flex-direction:column;align-items:flex-end;gap:8px;}
.msg-row.user.user-stack .bubble-attachments{justify-content:flex-end;margin-bottom:0;}
.msg-row.user.user-stack .bubble-img{max-width:68px;border-radius:10px;}
.bubble-file{
  display:flex;align-items:center;gap:7px;
  background:var(--surface-2);border-radius:10px;

<script>
const hr=new Date().getHours();
const greetings=[[0,'Доброй ночи'],[6,'Доброе утро'],[12,'Добрый день'],[18,'Добрый вечер'],[22,'Доброй ночи']];
let gr='Добрый день';for(const[t,v]of greetings){if(hr>=t)gr=v;}
document.getElementById('greeting').textContent=gr;

const ta=document.getElementById('ta');
const appEl=document.querySelector('.app');
function getViewportHeight(){
  const textarea=document.getElementById('ta');
  const isKeyboardOpen=textarea && document.activeElement===textarea;
  if(!isKeyboardOpen && window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.viewportHeight){
    return window.Telegram.WebApp.viewportHeight;
  }
  if(window.visualViewport)return window.visualViewport.height;
  return window.innerHeight;
}
function lockViewportHeight(){
  if(appEl)appEl.style.height=getViewportHeight()+'px';
  if(typeof syncMessagesBottomInset==='function')setTimeout(syncMessagesBottomInset,0);
}
lockViewportHeight();
if(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.onEvent){window.Telegram.WebApp.onEvent('viewportChanged',lockViewportHeight);}
if(window.visualViewport){window.visualViewport.addEventListener('resize',lockViewportHeight);window.visualViewport.addEventListener('scroll',lockViewportHeight);}
window.addEventListener('resize',lockViewportHeight);
window.addEventListener('scroll',()=>{if(window.scrollY!==0||window.scrollX!==0)window.scrollTo(0,0);});
if(ta){
  ta.addEventListener('focus',()=>{
    const m=document.getElementById('messages');
    const wasB = m ? (m.scrollHeight - m.clientHeight - m.scrollTop < 140) : false;
    [30,100,200,350,500].forEach(t=>setTimeout(()=>{lockViewportHeight();syncMessagesBottomInset();if(wasB)scrollB(true);window.scrollTo(0,0);},t));
  });
  ta.addEventListener('blur',()=>{
    const m=document.getElementById('messages');

function readFileAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(String(r.result||''));
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}
function compressImage(file, maxWidth = 1280, maxHeight = 1280, quality = 0.85) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) {
      resolve('');
      return;
    }
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > height) {
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
        } else {
          if (height > maxHeight) {
            width = Math.round((width * maxHeight) / height);
            height = maxHeight;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve(dataUrl);
      };
      img.onerror = reject;
    };
    reader.onerror = reject;
  });
}
async function handleFileSelection(e){
  const files=[...(e.target.files||[])];
  if(!files.length)return;
  for(const file of files){
    const item={name:file.name,type:file.type||'',size:file.size||0,kind:(file.type||'').startsWith('image/')?'image':'file',dataUrl:''};
    if(item.kind==='image'){
      try{
        item.dataUrl=await compressImage(file, 1280, 1280, 0.85);
        item.type='image/jpeg';
      }catch(_){
        try{item.dataUrl=await readFileAsDataURL(file);}catch(__){}
      }
    } else {
      try{item.dataUrl=await readFileAsDataURL(file);}catch(_){}
    }
    pendingFiles.push(item);
  }
  e.target.value='';
  renderAttachStrip();
  toggleSend();
}

  if (filesToSend.length) {

  const t=document.createElement('div');

// Хранилище контента файлов (вместо dataset — чтобы избежать искажений UTF-8)
window.__botFiles = window.__botFiles || {};
let __botFileCounter = 0;

function appendBotFile(msgEl, fileData) {
  document.getElementById('tr')?.remove();

  const container = document.createElement('div');
  container.className = 'msg-row bot';
  container.style.flexDirection = 'column';
  container.style.alignItems = 'flex-start';

  const fileName = fileData.name || 'file.txt';
  const fileType = fileData.type || 'File';
  const content = fileData.content || '';
  const mime = fileData.mime || 'text/plain';

  // Сохраняем контент в JS-объекте, не в dataset (dataset искажает UTF-8)
  const fileId = 'bf_' + (++__botFileCounter);
  window.__botFiles[fileId] = { content, name: fileName, mime };

  container.innerHTML = `
    <div class="bot-file" onclick="downloadFileFromAI(this)" data-file-id="${fileId}">
      <div class="bot-file-icon">
        <span style="font-size:16px;font-weight:700;">&lt;/&gt;</span>
      </div>
      <div class="bot-file-content">
        <div class="bot-file-name">${x(fileName)}</div>
        <div class="bot-file-meta">${x(fileType)}</div>
      </div>
    </div>
  `;

  msgEl.appendChild(container);
  scrollElementAboveInput(container, 18);
}

function downloadFileFromAI(el) {
  const fileId = el.dataset.fileId;
  const fileData = window.__botFiles?.[fileId];
  if (!fileData) return;

  const name = fileData.name || 'file.txt';
  const content = fileData.content || '';
  const mime = (fileData.mime || 'text/plain') + ';charset=utf-8';

  // Создаём Blob с явной кодировкой UTF-8
  const blob = new Blob([new TextEncoder().encode(content)], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

}
function formatMathLaTeX(text) {
  if (!text) return '';
  let res = text;

  // Matrix blocks: \begin{pmatrix} a & b \\ c & d \end{pmatrix}
  res = res.replace(/\\begin\{pmatrix\}([\s\S]*?)\\end\{pmatrix\}/g, (match, contents) => {
    const rows = contents.trim().split(/\\\\|\\/);
    const tableRows = rows.map(row => {
      if (!row.trim()) return '';
      const cells = row.split('&');
      const tableCells = cells.map(cell => `<td style="padding: 4px 12px; text-align: center;">${cell.trim()}</td>`).join('');
      return `<tr>${tableCells}</tr>`;
    }).join('');
    return `<table style="border-left: 2px solid var(--text); border-right: 2px solid var(--text); border-radius: 6px; margin: 10px auto; font-family: inherit; font-size: 16px;">${tableRows}</table>`;
  });

  // Block formulas: $$ ... $$
  res = res.replace(/\$\$\s*([\s\S]*?)\s*\$\$/g, '<div class="formula-block">$1</div>');
  // Block formulas: \[ ... \]
  res = res.replace(/\\\[\s*([\s\S]*?)\s*\\\]/g, '<div class="formula-block">$1</div>');

  // Inline formulas: $ ... $
  res = res.replace(/\$([^$]+)\$/g, '<span class="formula-inline">$1</span>');
  // Inline formulas: \( ... \)
  res = res.replace(/\\\(\s*([\s\S]*?)\s*\\\)/g, '<span class="formula-inline">$1</span>');

  // Fractions: \frac{num}{den}
  while (res.includes('\\frac')) {
    let nextFrac = res.replace(/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g, '($1/$2)');
    if (nextFrac === res) break;
    res = nextFrac;
  }

  // Integrals: \int
  res = res.replace(/\\int/g, '∫');

  // Subscripts & Superscripts limits:
  res = res.replace(/_\{([^{}]+)\}\^\{([^{}]+)\}/g, '<sub>$1</sub><sup>$2</sup>');
  res = res.replace(/\^\{([^{}]+)\}_\{([^{}]+)\}/g, '<sup>$1</sup><sub>$2</sub>');

  // Subscripts: _{text} or _char
  res = res.replace(/_\{([^{}]+)\}/g, '<sub>$1</sub>');
  res = res.replace(/_([a-zA-Z0-9])/g, '<sub>$1</sub>');

  // Superscripts: ^{text} or ^char
  res = res.replace(/\^\{([^{}]+)\}/g, '<sup>$1</sup>');
  res = res.replace(/\^([a-zA-Z0-9\+\-\=])/g, '<sup>$1</sup>');

  // Infinite: \infty
  res = res.replace(/\\infty/g, '∞');

  // Sum: \sum
  res = res.replace(/\\sum/g, '∑');

  // Math symbols
  res = res.replace(/\\pi/g, 'π');
  res = res.replace(/\\alpha/g, 'α');
  res = res.replace(/\\beta/g, 'β');
  res = res.replace(/\\gamma/g, 'γ');
  res = res.replace(/\\delta/g, 'δ');
  res = res.replace(/\\theta/g, 'θ');
  res = res.replace(/\\lambda/g, 'λ');
  res = res.replace(/\\sigma/g, 'σ');
  res = res.replace(/\\phi/g, 'φ');
  res = res.replace(/\\psi/g, 'ψ');
  res = res.replace(/\\omega/g, 'ω');
  res = res.replace(/\\sqrt\s*\{([^{}]+)\}/g, '√$1');
  res = res.replace(/\\sqrt/g, '√');
  res = res.replace(/\\pm/g, '±');
  res = res.replace(/\\mp/g, '∓');
  res = res.replace(/\\cdot/g, '·');
  res = res.replace(/\\times/g, '×');
  res = res.replace(/\\div/g, '÷');
  res = res.replace(/\\neq/g, '≠');
  res = res.replace(/\\leq/g, '≤');
  res = res.replace(/\\geq/g, '≥');
  res = res.replace(/\\approx/g, '≈');
  res = res.replace(/\\sin/g, 'sin');
  res = res.replace(/\\cos/g, 'cos');
  res = res.replace(/\\tan/g, 'sin/cos');
  res = res.replace(/\\cot/g, 'cos/sin');
  res = res.replace(/\\log/g, 'log');
  res = res.replace(/\\ln/g, 'ln');
  res = res.replace(/\\lim/g, 'lim');
  
  // Remove backslashes for general commands
  res = res.replace(/\\([a-zA-Z]+)/g, '$1');

  return res;
}

function mdEscapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}
function mdEscapeAttr(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}
function mdEscapeRegExp(value) {
  return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function normalizeCodeLang(lang) {
  const value = String(lang || '').trim().toLowerCase();
  const aliases = {js:'javascript',jsx:'javascript',ts:'typescript',tsx:'typescript',py:'python',sh:'bash',shell:'bash',zsh:'bash',html:'html',xml:'html',svg:'html',md:'markdown'};
  return (aliases[value] || value).replace(/[^a-z0-9_+\-.]/g, '');
}
function highlightCode(code, lang) {
  const l = normalizeCodeLang(lang);
  if (!l) return code;
  if (l === 'markdown') return code;

  const actionsEl=b.querySelector('.msg-actions');

    if(!isTyping||!m)return;

  };

  const onTouchStart = (e) => {

  };

  const onTouchMove = (e) => {

    const startY = parseFloat(m.dataset.touchStartY || 0);

    if (currentY > startY + 2) userHasScrolledUp = true;
    m.dataset.touchStartY = currentY;
  };

  // Используем событие scroll исключительно для проверки достижения дна
  const onScroll = () => {
    if(!isTyping||!m)return;
    // Если пользователь доскроллил (или долетел по инерции) до конца - возобновляем ведение
    const isAtBottom=(m.scrollHeight-m.clientHeight-m.scrollTop)<140;
    if (isAtBottom) userHasScrolledUp = false;
  };

  if(m){
    m.addEventListener('wheel',onWheel,{passive:true});
    m.addEventListener('touchstart',onTouchStart,{passive:true});
    m.addEventListener('touchmove',onTouchMove,{passive:true});
    m.addEventListener('scroll',onScroll,{passive:true});
  }

    if(m&&!userHasScrolledUp)scrollElementAboveInputNow(b,18);

        botMsg.style.maxHeight=botMsg.scrollHeight+'px';
      }

      i++;
      setTimeout(type,12);
    }else{
      textEl.innerHTML=md(text);
      const botMsg=b.querySelector('.bot-msg');
      if(botMsg){
        botMsg.style.maxHeight='none';
        botMsg.style.overflow='visible';
      }
      isTyping=false;
      if(m){

  }

  try{
    if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
      await navigator.share({files:[file],title:'oracle-image.png'});
      return;
    }
  }catch(e){
    return;
  }

  // Fallback для браузеров без Web Share API
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='oracle-image.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1200);
}

async function sendToBackend(txt,files,msgEl){
  const initData=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp.initData:'';
  try{
    const resp=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'tma '+initData},
      body:JSON.stringify({
        model:modelIdFor(model),
        history:chatHistory,
        message:(txt || (files?.length ? 'Вложения' : '')),
        attachments: (files || []).map(f => ({name: f.name || '', type: f.type || '', dataUrl: f.dataUrl || '', kind: f.kind || 'file'}))
      })
    });
    if(resp.status===401||resp.status===403){
      const data=await resp.json().catch(()=>({}));
      appendBotError(msgEl,data.message||'Нет доступа. Откройте бота в Telegram и отправьте /start.');
      return;
    }
    if(!resp.ok){
      const data=await resp.json().catch(()=>({}));
      appendBotError(msgEl,data.message||'Ошибка запроса.');
      return;
    }
    const data=await resp.json();

    if (data.file) {
      // Ответ от ИИ — файл (как на скрине)
      appendBotFile(msgEl, data.file);
      chatHistory.push({role:'user',content:txt});
      chatHistory.push({role:'assistant',content:`[Файл отправлен: ${data.file.name}]`});
    } else if(data.intent==='image'){
      appendBotImage(msgEl,data.image_base64,data.prompt);
      chatHistory.push({role:'user',content:(txt || (files?.length ? '[изображение]' : ''))});
      chatHistory.push({role:'assistant',content:'[изображение отправлено]'});
    }else{
      const reply=data.reply||'';
      appendBotText(msgEl,reply);
      chatHistory.push({role:'user',content:(txt || (files?.length ? '[файл]' : ''))});
      chatHistory.push({role:'assistant',content:reply});
    }
    if(chatHistory.length>60)chatHistory=chatHistory.slice(-60);
    saveActiveChat();
  }catch(e){
    appendBotError(msgEl,'Не удалось связаться с сервером. Проверь подключение.');
  }
}

function cp(btn){

    },2000);

function syncMessagesBottomInset(){
  const m=document.getElementById('messages');
  if(!m)return 0;
  const input=document.querySelector('.input-area');
  const inputH=Math.ceil(input?.offsetHeight||110);
  const gap=18;
  const inset=inputH+gap;
  m.style.setProperty('--messages-bottom-inset',inset+'px');
  let sp=document.getElementById('scroll-spacer');
  if(!sp){
    sp=document.createElement('div');
    sp.id='scroll-spacer';
    sp.style.flexShrink='0';
    sp.style.width='100%';
  }
  sp.style.height=inset+'px';
  if(sp.parentNode!==m || sp.nextSibling){
    m.appendChild(sp);
  }
  return inset;
}
function maxScrollTop(m){return Math.max(0,m.scrollHeight-m.clientHeight);}
function lastMessageRow(){
  const m=document.getElementById('messages');
  if(!m)return null;
  const rows=[...m.querySelectorAll('.msg-row')].filter(el=>el.id!=='scroll-spacer');
  return rows[rows.length-1]||null;
}
function scrollElementAboveInputNow(el,gap=18){
  const m=document.getElementById('messages');
  if(!m||!el)return;
  syncMessagesBottomInset();
  const input=document.querySelector('.input-area');
  const inputH=input?.offsetHeight||110;
  const mRect=m.getBoundingClientRect();
  const eRect=el.getBoundingClientRect();
  const targetBottom=mRect.bottom-inputH-gap;
  const diff=eRect.bottom-targetBottom;
  if(diff>0){
    m.scrollTop=Math.min(maxScrollTop(m),m.scrollTop+diff);
    m.dataset.expectedScrollTop = m.scrollTop;
  }
}
function scrollElementAboveInput(el,gap=18,delay=30){
  setTimeout(()=>scrollElementAboveInputNow(el,gap),delay);
}
function scrollB(force=false){
  setTimeout(()=>{
    const m=document.getElementById('messages');
    if(!m)return;
    const isAtBottom=(m.scrollHeight-m.clientHeight-m.scrollTop)<140;
    if(!force && !isAtBottom)return;
    syncMessagesBottomInset();
    const last=lastMessageRow();
    if(last)scrollElementAboveInputNow(last,18);
  },30);
}
function x(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>');}

(function(){
  const closed=document.getElementById('lime-closed');
  if(!closed)return;
  closed.style.webkitMaskImage='linear-gradient(to bottom, black 0%, transparent 16%)';
  closed.style.maskImage='linear-gradient(to bottom, black 0%, transparent 16%)';
  let raf=null,tm=null;
  function smootherstep(t){t=Math.max(0,Math.min(1,t));return t*t*t*(t*(t*6-15)+10);}
  function animateTo(from,to,duration,onDone){
    cancelAnimationFrame(raf);
    const start=performance.now();
    function step(now){
      const p=Math.min((now-start)/duration,1);
      const v=from+(to-from)*smootherstep(p);
      const mask=`linear-gradient(to bottom, black ${v}%, transparent ${Math.min(v+16,100)}%)`;
      closed.style.webkitMaskImage=mask;closed.style.maskImage=mask;
      if(p<1)raf=requestAnimationFrame(step);else onDone&&onDone();
    }
    raf=requestAnimationFrame(step);
  }
  function blink(){animateTo(0,100,150,()=>{animateTo(100,0,120,()=>{tm=setTimeout(blink,3000+Math.random()*2000);});});}
  tm=setTimeout(blink,1500);
})();

function hideKeyboardOnOutsideTap(ev){
  const textarea=document.getElementById('ta');
  if(!textarea) return;
  if(document.activeElement!==textarea) return;
  const inputArea=document.querySelector('.input-area');
  const sheet=document.getElementById('sheet');
  const sidebar=document.getElementById('sidebar');
  const attachStrip=document.getElementById('attach-strip');
  const target=ev.target;
  // не скрывать, если тап внутри инпута, шита, сайдбара или стрипа вложений
  if(inputArea && inputArea.contains(target)) return;
  if(attachStrip && attachStrip.contains(target)) return;
  if(sheet && sheet.contains(target) && sheet.classList.contains('open')) return;
  if(sidebar && sidebar.contains(target) && sidebar.classList.contains('open')) return;
  textarea.blur();
}
document.addEventListener('touchstart',hideKeyboardOnOutsideTap,{passive:true,capture:true});

let adminUsers=[], adminTab='users', adminFilter='all', adminCurrentUser=null;

function authH(){
  const initData=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp.initData:'';
  return {'Content-Type':'application/json','Authorization':'tma '+initData};
}

async function openAdmin(){

async function adminLoadUsers(){
  document.getElementById('admin-body').innerHTML='<div class="a-loader">Загрузка...</div>';
  try{
    const r=await fetch('/api/admin/users',{headers:authH()});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error);
    adminUsers=d.users;
    adminRenderTab();
  }catch(e){
    document.getElementById('admin-body').innerHTML=`<div class="a-empty">Ошибка: ${e.message}</div>`;

function adminSwitchTab(tab){
  adminTab=tab;
  adminFilter='all';
  document.querySelectorAll('.admin-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  adminRenderTab();
}

function adminRenderTab(){
  if(adminTab==='stats') adminRenderStats();
  else adminRenderUsers(adminFilter);
}

function adminStatusLabel(s){return s==='approved'?'Одобрен':s==='pending'?'Ожидает':'Отклонён';}

function adminRenderUsers(filter){
  adminFilter=filter;
  let users=adminUsers;
  const pending=adminTab==='pending';
  if(pending) users=users.filter(u=>u.status==='pending');
  else if(filter!=='all') users=users.filter(u=>u.status===filter);

  const chips=pending?'':['all','approved','pending','rejected'].map(f=>`
    <div class="a-chip ${f}${filter===f?' active':''}" onclick="adminRenderUsers('${f}')">
      ${f==='all'?'Все':f==='approved'?'Одобренные':f==='pending'?'Ожидают':'Отклонённые'}
      (${f==='all'?adminUsers.length:adminUsers.filter(u=>u.status===f).length})
    </div>`).join('');

  const rows=users.map(u=>`
    <div class="a-row" onclick="adminOpenDetail(${u.user_id})">
      <div class="a-avatar">${String(u.user_id).slice(-2)}</div>
      <div class="a-info">
        <div class="a-name">ID: ${u.user_id}</div>
        <div class="a-meta"><span class="a-badge ${u.status}">${adminStatusLabel(u.status)}</span></div>
      </div>
      <div class="a-req"><div><b>${u.day||0}</b> сег.</div><div><b>${u.week||0}</b> нед.</div></div>

    (chips?`<div class="a-filter-row">${chips}</div>`:'') +
    (rows?`<div class="a-card">${rows}</div>`:`<div class="a-empty">${pending?'Нет ожидающих':'Нет пользователей'}</div>`);

async function adminDoAction(action){
  if(!adminCurrentUser)return;
  const uid=adminCurrentUser.user_id;
  try{
    const r=await fetch('/api/admin/action',{method:'POST',headers:authH(),body:JSON.stringify({action,user_id:uid})});

    if(!d.ok)throw new Error(d.error);
