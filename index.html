  function downloadFileFromAI(el) {
    const fileId = el.dataset.fileId;
    const fileData = window.__botFiles?.[fileId];
    if (!fileData) return;

    const name = fileData.name || 'file.txt';
    const content = fileData.content || '';
    const mime = (fileData.mime || 'text/plain') + ';charset=utf-8';

    const blob = new Blob([new TextEncoder().encode(content)], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  const GENERATED_IMAGE_MIMES = new Set(['image/png', 'image/jpeg', 'image/webp']);
  const GENERATED_IMAGE_MAX_B64_CHARS = 14 * 1024 * 1024;

  function safeGeneratedImageRecord(base64, mime='image/png') {
    const safeMime = typeof mime === 'string' ? mime.toLowerCase() : '';
    if(
      typeof base64 !== 'string' ||
      !base64 ||
      base64.length > GENERATED_IMAGE_MAX_B64_CHARS ||
      base64.length % 4 !== 0 ||
      !/^[A-Za-z0-9+/]+={0,2}$/.test(base64) ||
      !GENERATED_IMAGE_MIMES.has(safeMime)
    ) return null;
    const extension = safeMime === 'image/jpeg' ? 'jpg' : safeMime.split('/')[1];
    return {base64, mime: safeMime, extension};
  }

  function appendBotImage(msgEl, base64, caption, mime='image/png') {
    const record = safeGeneratedImageRecord(base64, mime);
    if(!record){
      appendBotError(msgEl, 'Получено некорректное изображение.');
      return;
    }
    const container = document.createElement('div');
    container.className = 'ai-block';

    window.__generatedImages = window.__generatedImages || {};
    const imgId = 'gen_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    window.__generatedImages[imgId] = record;

    const thumbnail = document.createElement('div');
    thumbnail.className = 'generated-image-thumb';
    thumbnail.style.cssText = 'display:block;max-width:240px;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.14);cursor:pointer;-webkit-tap-highlight-color:transparent;margin-bottom:8px;';
    const image = document.createElement('img');
    image.src = `data:${record.mime};base64,${record.base64}`;
    image.style.cssText = 'width:100%;display:block;';
    image.alt = '';
    thumbnail.appendChild(image);
    container.appendChild(thumbnail);
    thumbnail.addEventListener(
      'click',
      () => openGeneratedImage(imgId)
    );
    
    msgEl.appendChild(container);
    const img = container.querySelector('img');
    if (img) {
      img.onload = () => scrollElementAboveInput(container, 18);
      if (img.complete) setTimeout(() => scrollElementAboveInput(container, 18), 30);
    } else {
      scrollElementAboveInput(container, 18);
    }
  }

  function b64ToBlob(base64,type='image/png'){
    const bin=atob(base64);
    const len=bin.length;
    const bytes=new Uint8Array(len);
    for(let i=0;i<len;i++)bytes[i]=bin.charCodeAt(i);
    return new Blob([bytes],{type});
  }
  async function saveGeneratedImage(id){
    const record=window.__generatedImages?.[id];
    if(!record)return;
    const filename=`oracle-image.${record.extension}`;
    const blob=b64ToBlob(record.base64,record.mime);
    const file=new File([blob],filename,{type:record.mime});

    try{
      if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
        await navigator.share({files:[file],title:filename});
        return;
      }
    }catch(e){}

    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=filename;
    document.body.appendChild(a);

    textEl.classList.add('is-streaming');
    let fullHeight = Math.ceil(textEl.scrollHeight);
    textEl.style.height = '0px';

    let isLocked = true;
    let isUserInteracting = false;

    function updateFollowState() {
      if (!m) return;
      const dist = m.scrollHeight - m.clientHeight - m.scrollTop;
      if (dist <= 56) {
        isLocked = true;
      } else if (isUserInteracting) {
        isLocked = false;
      }
    }

    const onTouchStart = () => { isUserInteracting = true; };
    const onTouchEnd = () => { isUserInteracting = false; updateFollowState(); };
    const onWheel = (e) => { 
      if (e.deltaY < 0) { isLocked = false; }
      else { requestAnimationFrame(updateFollowState); }
    };
    const onScroll = () => {
      updateFollowState();
    };

    if (m) {
      m.style.scrollBehavior = 'auto'; 
      m.addEventListener('touchstart', onTouchStart, {passive:true});
      m.addEventListener('touchend', onTouchEnd, {passive:true});
      m.addEventListener('mousedown', onTouchStart, {passive:true});
      m.addEventListener('mouseup', onTouchEnd, {passive:true});
      m.addEventListener('wheel', onWheel, {passive:true});
      m.addEventListener('scroll', onScroll, {passive:true});
    }

    const startDelay = 70;
    const accelerationDuration = 260;
    const revealSpeed = 0.16;
    const tailSize = 42;
    const tailSettleDuration = 380;
    let startTime = null;
    let lastTime = null;
    let finishedAt = null;

    function type(now) {
      if (!startTime) startTime = now;
      if (!lastTime) lastTime = now;
      const elapsed = now - startTime;
      const dt = Math.min(34, now - lastTime);
      lastTime = now;

      const measuredHeight = Math.ceil(textEl.scrollHeight);
      if (measuredHeight > fullHeight) {
        fullHeight = measuredHeight;
        finishedAt = null;
      }

      const revealElapsed = Math.max(0, elapsed - startDelay);
      let revealHeight = 0;
      if (revealElapsed < accelerationDuration) {
        revealHeight = revealSpeed * revealElapsed * revealElapsed / (2 * accelerationDuration);
      } else {
        revealHeight = revealSpeed * (revealElapsed - accelerationDuration / 2);
      }
      revealHeight = Math.min(fullHeight, revealHeight);
      textEl.style.height = revealHeight + 'px';

      const revealDone = revealHeight >= fullHeight - 0.1;
      if (revealDone && !finishedAt) finishedAt = now;

      let tailDone = false;
      if (finishedAt) {
        const tailProgress = Math.min(1, (now - finishedAt) / tailSettleDuration);
        const tailEase = tailProgress * tailProgress * (3 - 2 * tailProgress);
        const currentTail = tailSize * (1 - tailEase);
        textEl.style.setProperty('--stream-tail', currentTail + 'px');
        tailDone = tailProgress >= 1;
      }

      if (isLocked && m) {
        const maxScroll = m.scrollHeight - m.clientHeight;
        const scrollEase = 1 - Math.exp(-dt / 145);
        const nextScroll = m.scrollTop + (maxScroll - m.scrollTop) * scrollEase;
        m.scrollTop = Math.abs(maxScroll - nextScroll) < 0.15 ? maxScroll : nextScroll;
      }

      const scrollDone = !isLocked || !m || Math.abs((m.scrollHeight - m.clientHeight) - m.scrollTop) < 0.5;

      if (!revealDone || !tailDone || !scrollDone) {
        requestAnimationFrame(type);
        return;
      }

      textEl.style.height = '';
      textEl.style.overflow = '';
      textEl.style.removeProperty('--stream-tail');
      textEl.classList.remove('is-streaming');

      if (m) {
        m.removeEventListener('touchstart', onTouchStart);
        m.removeEventListener('touchend', onTouchEnd);
        m.removeEventListener('mousedown', onTouchStart);
        m.removeEventListener('mouseup', onTouchEnd);
        m.removeEventListener('wheel', onWheel);
        m.removeEventListener('scroll', onScroll);
        m.style.scrollBehavior = '';
      }

      if (actionsEl) actionsEl.style.display = 'flex';
      b.querySelector('.thinking-row').onclick = (e) => e.currentTarget.classList.toggle('open');
      wireActionRow(b, text);
    }
    
    requestAnimationFrame(type);
  }

  (function initSwipe(){
    let dragging = false, startX = 0, startY = 0, startProgress = 0, sidebarPx = 0, axisLocked = null;
    let lastX = 0, lastT = 0, velocity = 0, dragProgress = 0;

    function getSidebarPx(){
      return sidebar.getBoundingClientRect().width || Math.min(window.innerWidth * 0.86, 330);
    }
    function setProgress(px){
      const progress = Math.max(0, Math.min(sidebarPx, px));
      dragProgress = progress;
      const ratio = sidebarPx ? progress / sidebarPx : 0;
      sidebar.style.transform = `translateX(${progress - sidebarPx}px)`;
      mainEl.style.transform = `translateX(${progress}px)`;
      mainEl.style.borderRadius = ratio > 0.02 ? '26px 0 0 26px' : '0';
      mainVeil.style.opacity = ratio;
      mainVeil.style.visibility = ratio > 0.01 ? 'visible' : 'hidden';
    }
    function endDrag(finalRatio){
      sidebar.classList.remove('dragging');
      mainEl.classList.remove('dragging');
      mainVeil.classList.remove('dragging');
      const wasOpen = sidebar.classList.contains('open');
      const willOpen = finalRatio >= 0.3;
      if(willOpen){
        sidebar.classList.add('open');
        mainEl.classList.add('pushed');
        mainVeil.classList.add('show');
      } else {
        sidebar.classList.remove('open');
        mainEl.classList.remove('pushed');
        mainVeil.classList.remove('show');
      }
      if(willOpen !== wasOpen) vibrateTick();
      requestAnimationFrame(() => {
        sidebar.style.transform = '';
        mainEl.style.transform = '';
        mainEl.style.borderRadius = '';
        mainVeil.style.opacity = ''; mainVeil.style.visibility = '';
      });
    }

    document.addEventListener('touchstart', (e) => {
      if(e.touches.length !== 1) return;
      const x = e.touches[0].clientX, y = e.touches[0].clientY;
      const isOpen = sidebar.classList.contains('open');
      const sbPx = getSidebarPx();
      if(!isOpen && x > 84) return;
      if(isOpen && x < sbPx) return;
      if(sheet.classList.contains('open') || document.getElementById('modalScrim').classList.contains('show')) return;
      dragging = true; axisLocked = null;
      startX = x; startY = y;
      lastX = x; lastT = e.timeStamp; velocity = 0;
      startProgress = isOpen ? sbPx : 0;
      dragProgress = startProgress;
      sidebarPx = sbPx;
      sidebar.classList.add('dragging'); mainEl.classList.add('dragging'); mainVeil.classList.add('dragging');
      mainVeil.style.visibility = 'visible';
    }, {passive:true});

    document.addEventListener('touchmove', (e) => {
      if(!dragging) return;
      const x = e.touches[0].clientX, y = e.touches[0].clientY;
      const dx = x - startX, dy = y - startY;
      if(axisLocked === null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)){
        axisLocked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      }
      if(axisLocked === 'y'){ dragging = false; endDrag(sidebar.classList.contains('open') ? 1 : 0); return; }
      if(axisLocked === 'x'){
        e.preventDefault();
        setProgress(startProgress + dx);
        const dt = e.timeStamp - lastT;
        if(dt > 0){ velocity = (x - lastX) / dt; }
        lastX = x; lastT = e.timeStamp;
      }
    }, {passive:false});

    document.addEventListener('touchend', () => {
      if(!dragging) return;
      dragging = false;
      const ratio = sidebarPx ? dragProgress / sidebarPx : 0;
      const FLICK_SPEED = 0.18;
      const shouldOpen = velocity > FLICK_SPEED || (velocity >= -FLICK_SPEED && ratio >= 0.28);
      endDrag(shouldOpen ? 1 : 0);
    });
    document.addEventListener('touchcancel', () => {
      if(!dragging) return;
      dragging = false;
      endDrag(sidebar.classList.contains('open') ? 1 : 0);
    });
  })();

  let pendingFiles = [];
  const MAX_UI_ATTACHMENTS = 4;
  const MAX_UI_FILE_BYTES = 6 * 1024 * 1024;
  const SAFE_IMAGE_TYPES = new Set(['image/jpeg','image/png','image/webp']);
  function openFilePicker(){
    if(!serverCapabilities.file_uploads && !serverCapabilities.image_uploads){
      showToast('Загрузка вложений отключена');
      return;
    }
    document.getElementById('file-input').click();

  function readAsDataURL(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
  function safeClientImageDataUrl(value){
    if(typeof value !== 'string' || value.length > (MAX_UI_FILE_BYTES * 4 / 3) + 4096) return '';
    return /^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(value)
      ? value
      : '';
  }
  async function onFilesChosen(input){
    for(const file of Array.from(input.files)){
      if(pendingFiles.length >= MAX_UI_ATTACHMENTS){
        showToast('Можно прикрепить не более 4 файлов');
        break;
      }
      const isImg = file.type.startsWith('image/');
      if(isImg && !serverCapabilities.image_uploads){
        showToast('Загрузка изображений отключена');
        continue;
      }
      if(!isImg && !serverCapabilities.file_uploads){
        showToast('Загрузка файлов отключена');
        continue;
      }
      if(file.size > MAX_UI_FILE_BYTES){
        showToast(`Файл «${file.name}» больше 6 МБ`);
        continue;
      }
      if(isImg && !SAFE_IMAGE_TYPES.has(file.type)){
        showToast(`Формат изображения «${file.name}» не поддерживается`);
        continue;
      }
      const item = { name:file.name, type: file.type || '', kind:isImg?'image':'file', dataUrl:null };
      try{
        item.dataUrl = await readAsDataURL(file);
      }catch(e){
        showToast(`Не удалось прочитать файл «${file.name}»`);
        continue;
      }
      if(isImg && !safeClientImageDataUrl(item.dataUrl)){
        showToast(`Изображение «${file.name}» имеет некорректный формат`);
        continue;
      }
      pendingFiles.push(item);
    }
    input.value = ''; renderAttachStrip(); toggleSend();
  }
  function removePendingFile(i){ pendingFiles.splice(i,1); renderAttachStrip(); toggleSend(); }

    const firstCardFrame = {
      height:startHeight + 'px',
      minHeight:firstCardStyle.minHeight,
      paddingTop:firstCardStyle.paddingTop,
      paddingRight:firstCardStyle.paddingRight,
      paddingBottom:firstCardStyle.paddingBottom,
      paddingLeft:firstCardStyle.paddingLeft,
      borderRadius:firstCardStyle.borderRadius,
      rowGap:firstCardStyle.rowGap
    };

    inputCard.classList.add('measuring');
    inputCard.style.height = 'auto';
    inputCard.classList.toggle('expanded', expanded);
    resize(ta);
    const endHeight = expanded ? Math.max(92, inputCard.scrollHeight) : 48;
    const lastCardStyle = getComputedStyle(inputCard);
    const lastCardFrame = {
      height:endHeight + 'px',
      minHeight:lastCardStyle.minHeight,
      paddingTop:lastCardStyle.paddingTop,
      paddingRight:lastCardStyle.paddingRight,
      paddingBottom:lastCardStyle.paddingBottom,
      paddingLeft:lastCardStyle.paddingLeft,
      borderRadius:lastCardStyle.borderRadius,
      rowGap:lastCardStyle.rowGap
    };
    inputCard.style.height = startHeight + 'px';
    inputCard.classList.remove('measuring');

    if(immediate || reducedMotion){
      inputCard.style.removeProperty('height');
      modelButton?.style.removeProperty('visibility');
      syncMessagesBottomInset();
      return;
    }

    if(!expanded && modelButton) modelButton.style.visibility = 'visible';
    inputCard.classList.add('animating');
    inputCard.getBoundingClientRect();
    const cardAnimation = inputCard.animate?.(
      [firstCardFrame, lastCardFrame],
      {duration:COMPOSER_MOTION_MS, easing:COMPOSER_MOTION_EASING, fill:'both'}
    );
    motionTargets.forEach(el => {
      const first = firstRects.get(el);
      const last = el.getBoundingClientRect();
      const dx = first.left - last.left;
      const dy = first.top - last.top;
      const isModelButton = el === modelButton;
      if((Math.abs(dx) > .5 || Math.abs(dy) > .5 || isModelButton) && el.animate){
        const fromFrame = {transform:`translate(${dx}px, ${dy}px)`};
        const toFrame = {transform:'translate(0, 0)'};
        if(isModelButton){
          fromFrame.opacity = expanded ? 0 : 1;
          toFrame.opacity = expanded ? 1 : 0;
        }
        el.animate(
          [fromFrame, toFrame],
          {duration:COMPOSER_MOTION_MS, easing:COMPOSER_MOTION_EASING, fill:'both'}
        );
      }
    });
    syncMessagesBottomInset();
    composerAnimationTimer = setTimeout(() => {
      inputCard.classList.add('measuring');
      inputCard.style.height = endHeight + 'px';
      cardAnimation?.cancel();
      motionTargets.forEach(el => el.getAnimations?.().forEach(animation => animation.cancel()));
      inputCard.style.removeProperty('height');
      inputCard.classList.remove('animating');
      modelButton?.style.removeProperty('visibility');
      resize(ta);
      inputCard.classList.remove('measuring');
      syncMessagesBottomInset();
    }, COMPOSER_MOTION_MS + 40);
  }

  function resize(el){
    el.style.height='auto';
    el.style.height = inputCard?.classList.contains('expanded') ? Math.min(el.scrollHeight,112)+'px' : '26px';
    syncMessagesBottomInset();
  }
  function syncMessagesBottomInset(){
    const m = document.getElementById('messages');
    if(!m) return 0;
    const input = document.querySelector('.input-area');
    const inputH = Math.ceil(input?.offsetHeight || 110);
    const gap = 18;
    const inset = inputH + gap;
    m.style.setProperty('--messages-bottom-inset', inset + 'px');
    let sp = document.getElementById('scroll-spacer');
    if(!sp){ sp = document.createElement('div'); sp.id = 'scroll-spacer'; }
    sp.style.height = inset + 'px';
    if(sp.parentNode !== m || sp.nextSibling){ m.appendChild(sp); }
    return inset;
  }
  function maxScrollTop(m){ return Math.max(0, m.scrollHeight - m.clientHeight); }
  function lastMessageRow(){
    const m = document.getElementById('messages');
    if(!m) return null;
    const rows = [...m.children].filter(el => el.id !== 'scroll-spacer');
    return rows[rows.length - 1] || null;
  }
  function scrollElementAboveInputNow(el, gap=18){
    const m = document.getElementById('messages');
    if(!m || !el) return;
    syncMessagesBottomInset();
    const input = document.querySelector('.input-area');
    const inputH = input?.offsetHeight || 110;
    const mRect = m.getBoundingClientRect();
    const eRect = el.getBoundingClientRect();
    const targetBottom = mRect.bottom - inputH - gap;
    const diff = eRect.bottom - targetBottom;
    if(diff > 0){ m.scrollTop = Math.min(maxScrollTop(m), m.scrollTop + diff); }
  }
  function scrollElementAboveInput(el, gap=18, delay=30){ setTimeout(() => scrollElementAboveInputNow(el, gap), delay); }
  window.addEventListener('resize', syncMessagesBottomInset);
  let requestInFlight = false;
  function toggleSend(){
    sendBtn.disabled = requestInFlight || !(ta.value.trim() || pendingFiles.length);
  }
  function handleComposerInput(){
    setComposerExpanded(true);
    if(currentChatId && currentChatId !== 'incognito'){
      const chat = chats[currentChatId];
      if(chat) chat.draft = ta.value;
    }
    toggleSend();
  }
  function onKey(e){
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      if(!requestInFlight && (ta.value.trim() || pendingFiles.length)) send();
    }
  }

  function currentViewportScale(){
    const vv = window.visualViewport;
    if(!vv) return 1;
    const reported = Number(vv.scale) || 1;
    const widthBased = vv.width > 0 ? document.documentElement.clientWidth / vv.width : 1;
    return Math.abs(widthBased - 1) > Math.abs(reported - 1) ? widthBased : reported;
  }
  let welcomeViewportScaleBeforeFocus = currentViewportScale();
  function rememberWelcomeViewportScale(){
    if(document.activeElement !== ta) welcomeViewportScaleBeforeFocus = currentViewportScale();
  }
  function syncWelcomeViewportScale(){
    const welcome = document.getElementById('welcome');
    if(!welcome) return;
    if(document.activeElement !== ta){
      welcome.style.setProperty('--welcome-focus-scale', '1');
      return;
    }
    const current = currentViewportScale() || 1;
    const counterScale = Math.max(.82, Math.min(1.3, welcomeViewportScaleBeforeFocus / current));
    welcome.style.setProperty('--welcome-focus-scale', counterScale.toFixed(4));
  }
  function settleWelcomeViewportScale(){
    [0, 60, 180, 360].forEach(delay => setTimeout(syncWelcomeViewportScale, delay));
  }
  ta.addEventListener('pointerdown', rememberWelcomeViewportScale, {passive:true});
  ta.addEventListener('touchstart', rememberWelcomeViewportScale, {passive:true});
  ta.addEventListener('focus', () => {
    setComposerExpanded(true);
    settleWelcomeViewportScale();
  });
  ta.addEventListener('blur', () => {
    document.getElementById('welcome')?.style.setProperty('--welcome-focus-scale', '1');
    welcomeViewportScaleBeforeFocus = currentViewportScale();
  });
  window.visualViewport?.addEventListener('resize', syncWelcomeViewportScale, {passive:true});
  window.visualViewport?.addEventListener('scroll', syncWelcomeViewportScale, {passive:true});
  window.addEventListener('resize', syncWelcomeViewportScale, {passive:true});

  async function send(){
    if(!accessGranted){showAccessDenied('Нет доступа. Откройте бота в Telegram и отправьте /start.');return;}
    if(requestInFlight){
      showToast('Дождитесь завершения текущего запроса');
      return;
    }
    
    const text = ta.value.trim();
    const files = pendingFiles.slice();
    if(!text && !files.length) return;
    requestInFlight = true;
    toggleSend();
    
    ta.value=''; resize(ta); clearPendingFiles(); toggleSend();
    ta.blur();
    closeSheet();
    setComposerExpanded(false);
    
    const chat = activeChat();
    if(currentChatId !== 'incognito') delete chat.draft;
    
    if(chat.history.length === 0 && currentChatId !== 'incognito' && text){
      chat.title = text.slice(0, 44) + (text.length > 44 ? '…' : '');
    }
    
    chat.history.push({role:'user', content: text, files: files});
    saveActiveChat();
    renderSidebar();

    const messages = document.getElementById('messages');
    const welcome = document.getElementById('welcome');
    if(welcome) welcome.remove();
    document.querySelector('.top-actions')?.classList.add('has-msgs');

    const row = document.createElement('div');
    row.className = 'row-user';
    if(files.length) row.appendChild(renderAttachmentsBlock(files));
    if(text){
      const bubble = document.createElement('div');
      bubble.className = 'bubble-user';
      bubble.textContent = text;
      row.appendChild(bubble);
    }
    messages.appendChild(row);
    scrollElementAboveInput(row, 18);

    const thinkBlock = document.createElement('div');
    thinkBlock.className = 'ai-block';
    thinkBlock.id = 'tr';
    thinkBlock.innerHTML = `
      <div class="thinking-row open">
        <svg class="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        Думает
        <span class="chev"></span>
      </div>
      <div class="thinking-body">Разбираю вопрос, прикидываю формат ответа и проверяю, что учёл все детали запроса.</div>
      <div class="ai-text"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
    messages.appendChild(thinkBlock);
    scrollElementAboveInput(thinkBlock, 18);

    try{
      const apiHistory = sanitizeClientHistory(chat.history.slice(0, -1));

      const resp=await fetch('/api/chat',{
        method:'POST',
        headers:apiHeaders(true),
        body:JSON.stringify({
          model: model, 
          history: apiHistory,
          message: (text || (files.length ? 'Вложения' : '')),
          attachments: files.map(f => ({
              name: f.name || '', 
              type: f.type || '', 
              dataUrl: f.dataUrl || '', 
              kind: f.kind || 'file'
          }))
        })
      });

      if(resp.status===401||resp.status===403){
        const data=await resp.json().catch(()=>({}));
        document.getElementById('tr')?.remove();
        if(AUTH_MODE==='web'&&resp.status===401){
          showLoginScreen(data.message||'Сессия истекла, войдите заново.');
        }else{
          appendBotError(messages, data.message || 'Нет доступа. Откройте бота в Telegram и отправьте /start.');
        }
        return;
      }
      if(!resp.ok){
        const data=await resp.json().catch(()=>({}));
        document.getElementById('tr')?.remove();
        appendBotError(messages, data.message || 'Ошибка запроса.');
        return;
      }
      
      const data=await resp.json();
      document.getElementById('tr')?.remove();

      if (data.file) {
        appendBotFile(messages, data.file);
        chat.history.push({role:'assistant', content:`[Файл отправлен: ${data.file.name}]`, is_file: true, file_data: data.file});
      } else if(data.intent==='image'){
        appendBotImage(messages, data.image_base64, data.prompt, data.image_mime);
        chat.history.push({role:'assistant', content: data.prompt, is_image: true, image_base64: data.image_base64, image_mime: data.image_mime});
      } else {
        const reply=data.reply||'';
        appendBotTextAnimated(messages, reply);
        chat.history.push({role:'assistant', content: reply});
      }

      saveActiveChat();
      
    }catch(e){
      document.getElementById('tr')?.remove();
      appendBotError(messages,'Не удалось связаться с сервером. Проверь подключение.');
    }finally{
      requestInFlight = false;
      toggleSend();
    }
  }

  /* ================= Admin panel UI ================= */
  let adminDataUsers = [];
  let adminDefaultLimits = {chat:200, 'image-generation':20};

  document.getElementById('profileBtn').onclick = () => { closeSideFn(); document.getElementById('profileScreen').classList.add('open'); };
  document.getElementById('closeProfile').onclick = () => { document.getElementById('profileScreen').classList.remove('open'); };
  document.getElementById('openAdmin').onclick = () => { document.getElementById('adminScreen').classList.add('open'); adminLoadUsers(); };
  document.getElementById('closeAdmin').onclick = () => { document.getElementById('adminScreen').classList.remove('open'); };
  
  document.querySelectorAll('.admin-tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.admin-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    adminRenderTab(t.dataset.tab);
  });

  async function adminLoadUsers(){
    document.getElementById('adminBody').innerHTML = '<div class="a-empty">Загрузка...</div>';
    try{
      const r=await fetch('/api/admin/users?limit=200&offset=0', {headers:apiHeaders()});
      const d=await r.json();
      if(d.ok){
        adminDataUsers = d.users;
        adminDefaultLimits = d.default_limits || adminDefaultLimits;
        adminRenderTab('users');
      } else {
        document.getElementById('adminBody').innerHTML = `<div class="a-empty">Ошибка: ${x(d.error||'Не удалось')}</div>`;
      }
    }catch(e){
      document.getElementById('adminBody').innerHTML = `<div class="a-empty">Сетевая ошибка</div>`;
    }
  }

  function adminRenderTab(tab){
    const body = document.getElementById('adminBody');
    body.classList.add('switching');
    setTimeout(() => { adminRenderTabInner(tab); body.classList.remove('switching'); }, 160);
  }
  
  const statusLabel = s => ({approved:'Одобрен', pending:'Ожидает', rejected:'Отклонён'}[s] || 'Неизвестно');
  const statusClass = s => ['approved','pending','rejected'].includes(s) ? s : 'rejected';

  function adminRenderTabInner(tab){
    const body = document.getElementById('adminBody');
    if(tab === 'stats'){
      body.innerHTML = `
        <div class="a-section-title">Пользователи</div>
        <div class="a-card">
          ${adminDataUsers.map(u => `
            <div class="a-row" data-admin-user="${u.user_id}">
              <div class="a-avatar">${String(u.user_id).slice(-2)}</div>
              <div class="a-info">
                <div class="a-name">ID ${u.user_id}</div>
                <div class="a-meta"><span class="a-badge ${statusClass(u.status)}">${x(statusLabel(u.status))}</span></div>
              </div>
            </div>`).join('')}
        </div>`;
      return;
    }
    const list = tab === 'pending' ? adminDataUsers.filter(u=>u.status==='pending') : adminDataUsers;
    body.innerHTML = `
      <div class="a-section-title">${tab==='pending'?'Ожидают одобрения':'Все пользователи'}</div>
      <div class="a-card">
        ${list.length ? list.map(u=>{
          const actions = u.status==='approved'
            ? `<button class="a-btn reject" data-admin-action="reject" data-user-id="${u.user_id}">Отозвать</button>`
            : u.status==='pending'
              ? `<button class="a-btn approve" data-admin-action="approve" data-user-id="${u.user_id}">Одобрить</button><button class="a-btn reject" data-admin-action="reject" data-user-id="${u.user_id}">Отклонить</button>`
              : `<button class="a-btn approve" data-admin-action="approve" data-user-id="${u.user_id}">Одобрить</button>`;
          return `<div class="a-row" data-admin-user="${u.user_id}">
            <div class="a-avatar">${String(u.user_id).slice(-2)}</div>
            <div class="a-info">
              <div class="a-name">ID ${u.user_id}</div>
              <div class="a-meta"><span class="a-badge ${statusClass(u.status)}">${x(statusLabel(u.status))}</span></div>
            </div>
            <div class="a-actions">${actions}</div>
          </div>`;
        }).join('') : `<div class="a-empty">Нет записей</div>`}
      </div>`;
  }

  async function adminDoAction(userId, action){
    try{
      const r=await fetch('/api/admin/action', {
        method:'POST',
        headers:apiHeaders(true),
        body:JSON.stringify({action, user_id: userId})
      });
      const d=await r.json();
      if(d.ok){
         const u = adminDataUsers.find(x=>x.user_id===userId);
         if(u) u.status = action==='approve' ? 'approved' : 'rejected';
         adminRenderTab(document.querySelector('.admin-tab.active').dataset.tab);
      }
    }catch(e){}
  }

  async function adminSaveModelLimit(userId, model, dailyLimit){
    const u = adminDataUsers.find(x=>x.user_id===userId);
    if(!u) return;
    try{
      const r=await fetch('/api/admin/limit', {
        method:'POST',
        headers:apiHeaders(true),
        body:JSON.stringify({user_id:userId, model, daily_limit:dailyLimit})
      });
      const d=await r.json().catch(()=>({}));
      if(!r.ok || !d.ok){
        showToast(d.error || 'Не удалось сохранить лимит');
        return;
      }
      if (!u.limits) u.limits = {};
      if(d.daily_limit == null) delete u.limits[model];
      else u.limits[model] = d.daily_limit;
      await adminUserDetail(userId);
      showToast('Лимит сохранён');
    }catch(e){
      showToast('Сетевая ошибка');
    }
  }
  async function adminSetModelLimit(userId, model){
    const input = document.querySelector(`.limitModelInput[data-model="${CSS.escape(model)}"]`);
    const val = parseInt(input?.value || '', 10);
    if(isNaN(val) || val < 1 || val > 10000){
      showToast('Введите лимит от 1 до 10000');
      return;
    }
    await adminSaveModelLimit(userId, model, val);
  }
  async function adminClearModelLimit(userId, model){
    await adminSaveModelLimit(userId, model, null);
  }

  async function adminUserDetail(userId){
    const u = adminDataUsers.find(x=>x.user_id===userId);
    if(!u) return;
    const body = document.getElementById('adminBody');
    body.innerHTML = `<div class="a-empty">Загрузка статистики...</div>`;
    
    let stats={total:0,day:0,week:0,models:{}};
    try{
      const r=await fetch(`/api/admin/users/${userId}/stats`, {headers:apiHeaders()});
      const d=await r.json();
      if(d.ok) stats=d.stats;
    }catch(e){}

    const modelEntries=Object.entries(stats.models||{}).sort((a,b)=>b[1]-a[1]);
    const maxM = Math.max(1, ...(modelEntries.map(m=>m[1])));
    if(!u.limits) u.limits = {};
    
    body.innerHTML = `
      <div class="a-back-row" data-admin-back="1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
        <span>Назад</span>
      </div>
      <div class="a-detail-head">
        <div class="a-avatar">${String(u.user_id).slice(-2)}</div>
        <div>
          <div class="a-detail-title">ID ${u.user_id}</div>
          <span class="a-badge ${statusClass(u.status)}">${x(statusLabel(u.status))}</span>
        </div>
      </div>
      <div class="a-stat-grid">
        <div class="a-stat-box"><div class="a-stat-num">${stats.total||0}</div><div class="a-stat-lbl">Всего запросов</div></div>
        <div class="a-stat-box"><div class="a-stat-num">${stats.day||0}</div><div class="a-stat-lbl">За сегодня</div></div>
        <div class="a-stat-box"><div class="a-stat-num">${stats.week||0}</div><div class="a-stat-lbl">За неделю</div></div>
      </div>
      <div class="a-section-title">Используемые модели</div>
      <div class="a-card" style="padding:6px 14px;">
        ${modelEntries.length ? modelEntries.map(([m,c])=>`<div class="a-model-row"><div class="a-model-name">${x(m)}</div><div class="a-model-bar-wrap"><div class="a-model-bar" style="width:${Math.max(0,Math.min(100,Math.round(Number(c)/maxM*100)))}%"></div></div><div class="a-model-cnt">${Number(c)||0}</div></div>`).join('') : `<div class="a-empty">Нет активности</div>`}
      </div>
      <div class="a-section-title">Лимиты по моделям (в день)</div>
      <div class="a-card" style="padding:6px 14px;">
        ${ALL_LIMIT_MODELS.map(([modelId, modelName]) => {
          const configured = u.limits && u.limits[modelId];
          const defaultLimit = modelId === 'image-generation'
            ? adminDefaultLimits['image-generation']
            : adminDefaultLimits.chat;
          return `
          <div class="a-model-row" style="gap:8px;">
            <div class="a-model-name" style="width:auto; flex:1;">${x(modelName)}</div>
            <span style="font-size:11.5px; color:var(--ink-faint); flex-shrink:0;">${configured ? configured+'/день' : 'по умолчанию '+defaultLimit}</span>
            <input type="number" min="1" max="10000" class="limitModelInput" data-model="${mdEscapeAttr(modelId)}" placeholder="лимит"
              value="${configured || ''}"
              style="width:74px; flex-shrink:0; border:none; background:rgba(var(--neutral-rgb),0.12); border-radius:10px; padding:7px 9px; font-size:12.5px; color:var(--ink); font-family:inherit;">
            <button class="a-btn approve" data-limit-action="set" data-user-id="${u.user_id}" data-model="${mdEscapeAttr(modelId)}" style="padding:6px 9px; flex-shrink:0;">✓</button>
            ${configured ? `<button class="a-btn reject" data-limit-action="clear" data-user-id="${u.user_id}" data-model="${mdEscapeAttr(modelId)}" style="padding:6px 9px; flex-shrink:0;">✕</button>` : ''}
          </div>`;
        }).join('')}
      </div>`;
  }

  document.getElementById('adminBody').addEventListener('click', event => {
    const actionButton = event.target.closest('[data-admin-action]');
    if(actionButton){
      event.stopPropagation();
      adminDoAction(Number(actionButton.dataset.userId), actionButton.dataset.adminAction);
      return;
    }
    const limitButton = event.target.closest('[data-limit-action]');
    if(limitButton){
      event.stopPropagation();
      const userId = Number(limitButton.dataset.userId);
      const modelId = limitButton.dataset.model;
      if(limitButton.dataset.limitAction === 'clear'){
        adminClearModelLimit(userId, modelId);
      }else{
        adminSetModelLimit(userId, modelId);
      }
      return;
    }
    if(event.target.closest('[data-admin-back]')){
      adminRenderTab(document.querySelector('.admin-tab.active').dataset.tab);
      return;
    }
    const userRow = event.target.closest('[data-admin-user]');
    if(userRow){
      adminUserDetail(Number(userRow.dataset.adminUser));
    }
  });

  document.getElementById('searchInput').addEventListener('input', renderSidebar);
  document.getElementById('attachBtn').addEventListener('click', openFilePicker);
  document.getElementById('model-btn').addEventListener('click', openSheet);
  document.getElementById('send-btn').addEventListener('click', send);
  document.getElementById('file-input').addEventListener(
    'change',
    event => onFilesChosen(event.currentTarget)
  );
  document.getElementById('webLogoutBtn').addEventListener('click', logoutWeb);
  ta.addEventListener('input', () => {
    resize(ta);
    handleComposerInput();
  });
  ta.addEventListener('keydown', onKey);

  /* ================= Init App ================= */
  document.addEventListener('DOMContentLoaded', () => {
    loadChats();
    pruneOldChats();

    const navigationEntry = performance.getEntriesByType
      ? performance.getEntriesByType('navigation')[0]
      : null;
    const isReload = navigationEntry
      ? navigationEntry.type === 'reload'
      : !!(performance.navigation && performance.navigation.type === 1);

    if(isReload){
      const savedActive = chatStore.getItem(ACTIVE_KEY);
      if(isSafeChatId(savedActive) && chats[savedActive]){
        currentChatId = savedActive;
      } else if(chatOrder.length > 0){
        currentChatId = chatOrder[0];
      } else {
        createChat(false);
      }
    } else {
      createChat(false);
    }

    renderSidebar();
    renderMessages();
    restoreActiveDraft();
    syncMessagesBottomInset();
  });

</script>
