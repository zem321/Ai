<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>АрбузAI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --bg: #f9f9f9;
  --white: #ffffff;
  --surface: rgba(255,255,255,0.75);
  --surface2: rgba(242,242,247,0.8);
  --border: rgba(0,0,0,0.06);
  --text: #191919;
  --text2: #6e6e73;
  --text3: #bcbcc2;
  --accent: #10a37f;
  --msg-user-bg: #f4f4f4;
  --radius: 24px;
  --radius-sm: 16px;
  --radius-xs: 12px;
  --blur: blur(25px);
  --shadow: 0 8px 32px rgba(0,0,0,0.04);
  --shadow-sm: 0 4px 12px rgba(0,0,0,0.02);
  --ios-anim: cubic-bezier(0.25,1,0.5,1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171717; --white: #212121; --surface: rgba(33,33,33,0.75);
    --surface2: rgba(47,47,47,0.8); --border: rgba(255,255,255,0.08);
    --text: #ececec; --text2: #b4b4b4; --text3: #676767;
    --msg-user-bg: #2f2f2f; --shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
}

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; font-size:16px; -webkit-font-smoothing:antialiased; }
.app-container { display:flex; flex-direction:column; height:100%; width:100%; position:relative; }

/* Sidebar */
.sidebar { position:fixed; top:0; left:0; bottom:0; width:290px; background:var(--surface); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); border-right:1px solid var(--border); display:flex; flex-direction:column; transform:translate3d(-100%,0,0); transition:transform 0.4s var(--ios-anim); z-index:200; padding-top:env(safe-area-inset-top); will-change:transform; }
.sidebar.open { transform:translate3d(0,0,0); }
.sidebar-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.12); z-index:199; display:none; opacity:0; transition:opacity 0.4s var(--ios-anim); }
.sidebar-overlay.open { display:block; opacity:1; }
.sidebar-header { padding:24px 20px 16px; display:flex; align-items:center; justify-content:space-between; }
.sidebar-title { font-size:20px; font-weight:700; letter-spacing:-0.5px; }
.sidebar-new-btn { width:36px; height:36px; background:var(--white); border:1px solid var(--border); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow-sm); color:var(--text); transition:transform 0.2s; }
.sidebar-new-btn:active { transform:scale3d(0.9,0.9,1); }
.sidebar-nav { padding:0 10px 10px; display:flex; flex-direction:column; gap:4px; }
.sidebar-nav-item { display:flex; align-items:center; gap:12px; padding:12px; border-radius:var(--radius-xs); cursor:pointer; font-weight:500; }
.sidebar-nav-item:active { background:var(--border); }
.sidebar-nav-icon { width:28px; height:28px; background:var(--white); border-radius:8px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm); }
.sidebar-section { padding:16px 20px 8px; font-size:11px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; }
.sidebar-chats { flex:1; overflow-y:auto; padding:0 10px; }
.sidebar-chats::-webkit-scrollbar { display:none; }
.chat-item { padding:12px; border-radius:var(--radius-xs); cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:2px; }
.chat-item:active { background:var(--border); }
.chat-item.active { background:var(--white); box-shadow:var(--shadow-sm); }
.chat-item-title { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
.chat-item-delete { background:none; border:none; color:var(--text3); cursor:pointer; padding:4px; border-radius:6px; }

/* Header */
.header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; padding-top:max(12px,env(safe-area-inset-top)); background:var(--surface); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); border-bottom:1px solid var(--border); position:relative; z-index:100; }
.header-title { flex:1; text-align:center; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:38px; }
.model-badge { font-size:16px; color:var(--text); font-weight:600; display:flex; align-items:center; gap:4px; }
.hdr-btn { width:38px; height:38px; background:transparent; border:none; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); transition:background 0.2s,transform 0.2s; }
.hdr-btn:active { background:var(--border); transform:scale3d(0.9,0.9,1); }

/* Picker */
.picker-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.08); z-index:80; display:none; opacity:0; transition:opacity 0.25s ease; }
.picker-overlay.open { display:block; opacity:1; }
.picker-dropdown {
  position:fixed; top:0; left:16px; right:16px;
  background:linear-gradient(135deg,rgba(255,255,255,0.65),rgba(245,245,247,0.45));
  backdrop-filter:blur(30px) saturate(210%); -webkit-backdrop-filter:blur(30px) saturate(210%);
  border:1px solid rgba(255,255,255,0.4); box-shadow:0 16px 32px rgba(0,0,0,0.03);
  border-radius:20px; padding:10px; z-index:90;
  display:none; transform:translate3d(0,-100%,0);
  transition:transform 0.3s var(--ios-anim); will-change:transform;
}
@media (prefers-color-scheme: dark) {
  .picker-dropdown { background:linear-gradient(135deg,rgba(35,35,37,0.6),rgba(20,20,20,0.4)); border:1px solid rgba(255,255,255,0.1); box-shadow:0 16px 32px rgba(0,0,0,0.2); }
}
.picker-dropdown.open { display:block; transform:translate3d(0,calc(max(12px,env(safe-area-inset-top)) + 54px),0); }
.picker-view { display:none; width:100%; animation:iosFadeIn 0.2s var(--ios-anim) forwards; }
.picker-view.active { display:block; }
@keyframes iosFadeIn { from{opacity:0;transform:scale3d(0.98,0.98,1)} to{opacity:1;transform:scale3d(1,1,1)} }
.category-btn { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:rgba(255,255,255,0.4); border:1px solid rgba(255,255,255,0.2); border-radius:var(--radius-sm); margin-bottom:6px; cursor:pointer; transition:background 0.2s,transform 0.2s; }
@media (prefers-color-scheme: dark) { .category-btn { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.05); } }
.category-btn:last-child { margin-bottom:0; }
.category-btn:active { transform:scale3d(0.99,0.99,1); }
.category-info { font-weight:600; font-size:15px; }
.picker-back-btn { display:flex; align-items:center; gap:4px; padding:6px 4px 10px; background:none; border:none; color:var(--accent); font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
.model-list-item { display:flex; align-items:center; justify-content:space-between; padding:12px; cursor:pointer; border-radius:var(--radius-xs); transition:background 0.2s; }
.model-list-item:active { background:rgba(0,0,0,0.03); }
.model-list-item.selected { background:rgba(16,163,127,0.06); color:var(--accent); }
.model-list-item-name { font-size:14px; font-weight:500; }
.model-list-check { color:var(--accent); opacity:0; transform:scale3d(0.8,0.8,1); transition:transform 0.2s var(--ios-anim),opacity 0.2s; }
.model-list-item.selected .model-list-check { opacity:1; transform:scale3d(1,1,1); }

/* Messages */
.messages { flex:1; overflow-y:auto; padding:20px 16px; display:flex; flex-direction:column; gap:24px; position:relative; }
.messages::-webkit-scrollbar { display:none; }
.empty-state { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; padding:20px; text-align:center; }
.empty-logo { width:64px; height:64px; background:var(--accent); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px; box-shadow:0 8px 24px rgba(16,163,127,0.15); }
.empty-title { font-size:22px; font-weight:700; letter-spacing:-0.3px; }
.empty-sub { font-size:14px; color:var(--text2); max-width:260px; line-height:1.5; }
.quick-actions { display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px; }
.quick-action { display:flex; align-items:center; gap:14px; padding:14px 16px; background:var(--white); border:1px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; transition:transform 0.2s var(--ios-anim),background 0.2s; box-shadow:var(--shadow-sm); font-size:14px; font-weight:500; }
.quick-action:active { transform:scale3d(0.96,0.96,1); background:var(--surface2); }
.quick-action-icon { font-size:20px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; background:var(--surface2); border-radius:10px; flex-shrink:0; }

.msg { display:flex; flex-direction:column; gap:6px; transform:translate3d(0,15px,0); opacity:0; animation:iosPopIn 0.4s var(--ios-anim) forwards; will-change:transform,opacity; }
@keyframes iosPopIn { to{opacity:1;transform:translate3d(0,0,0)} }
.msg.user { align-items:flex-end; }
.msg.ai { align-items:flex-start; width:100%; }
.msg-bubble { max-width:85%; padding:12px 16px; line-height:1.58; word-break:break-word; font-size:15px; }
.msg.user .msg-bubble { background:var(--msg-user-bg); color:var(--text); border-radius:20px 20px 4px 20px; }
.msg.ai .msg-bubble { background:transparent; padding:0; max-width:100%; color:var(--text); }
.msg-image-wrap { max-width:85%; border-radius:var(--radius-sm); overflow:hidden; box-shadow:var(--shadow); margin-bottom:4px; }
.msg-image-wrap img { width:100%; display:block; cursor:pointer; }
.msg-attached-img { max-width:180px; border-radius:12px; margin-bottom:6px; display:block; }
.msg-file-chip { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; margin-bottom:6px; font-size:12px; color:var(--text2); }
.msg-actions { display:flex; gap:6px; margin-top:4px; flex-wrap:wrap; }
.msg-action { background:transparent; border:none; color:var(--text2); cursor:pointer; padding:6px 10px; font-size:13px; border-radius:8px; font-family:inherit; transition:background 0.15s; }
.msg-action:active { background:var(--border); }

.typing { display:flex; align-items:center; gap:5px; padding:8px 0; }
.typing span { width:6px; height:6px; background:var(--text3); border-radius:50%; animation:iosBounce 1.4s infinite both; }
.typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
@keyframes iosBounce { 0%,80%,100%{transform:scale3d(0.6,0.6,1);opacity:0.4} 40%{transform:scale3d(1.2,1.2,1);opacity:1} }

/* Input */
.file-preview { display:flex; flex-wrap:wrap; gap:8px; padding:0 16px 8px; }
.preview-item { position:relative; width:60px; height:60px; border-radius:10px; overflow:hidden; border:1px solid var(--border); animation:iosPopIn 0.3s var(--ios-anim); }
.preview-item img { width:100%; height:100%; object-fit:cover; }
.preview-item .doc-icon { width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:var(--surface2); font-size:11px; font-weight:bold; color:var(--text2); }
.preview-item .remove-btn { position:absolute; top:2px; right:2px; background:rgba(0,0,0,0.5); color:white; border:none; border-radius:50%; width:16px; height:16px; font-size:9px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.input-area { padding:12px 16px max(16px,env(safe-area-inset-bottom)) 16px; background:var(--bg); flex-shrink:0; border-top:1px solid var(--border); z-index:5; }
.input-box { display:flex; align-items:flex-end; gap:8px; background:var(--white); border-radius:26px; padding:6px 8px 6px 14px; box-shadow:var(--shadow); border:1px solid var(--border); }
.text-input { flex:1; background:none; border:none; color:var(--text); font-family:inherit; font-size:16px; resize:none; outline:none; max-height:140px; line-height:1.4; padding:6px 0; }
.text-input::placeholder { color:var(--text3); }
.attach-btn { background:none; border:none; color:var(--text2); padding:4px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.send-btn { background:var(--text); border:none; border-radius:50%; color:var(--bg); width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:transform 0.2s; }
@media (prefers-color-scheme: dark) { .send-btn { background:var(--white); color:var(--bg); } }
.send-btn:disabled { background:transparent; color:var(--text3); cursor:not-allowed; }
.send-btn:active:not(:disabled) { transform:scale3d(0.9,0.9,1); }

.toast { position:fixed; bottom:100px; left:50%; transform:translate3d(-50%,20px,0); background:rgba(0,0,0,0.8); backdrop-filter:var(--blur); border-radius:14px; padding:10px 20px; font-size:14px; color:white; opacity:0; transition:opacity 0.3s,transform 0.3s var(--ios-anim); pointer-events:none; z-index:500; white-space:nowrap; }
.toast.show { opacity:1; transform:translate3d(-50%,0,0); }

pre { background:var(--surface2); border-radius:12px; padding:14px; overflow-x:auto; margin:8px 0; font-size:13px; border:1px solid var(--border); }
code { font-family:'SF Mono',Menlo,monospace; font-size:13px; background:var(--surface2); padding:2px 5px; border-radius:6px; }
pre code { background:none; padding:0; }
strong { font-weight:600; }
</style>
</head>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="sidebar" id="sidebar">

  <div class="header">

      <button class="hdr-btn" onclick="toggleSidebar()">

const MODEL_NAMES = {
  "gpt-5.5":"GPT-5.5","gpt-5.4-mini":"GPT-5.4 Mini","codex-auto-review":"Codex Auto Review",
  "anthropic/claude-opus-4-8":"Claude Opus 4.8","anthropic/claude-opus-4-7":"Claude Opus 4.7",
  "anthropic/claude-opus-4-6":"Claude Opus 4.6","anthropic/claude-sonnet-4-6":"Claude Sonnet 4.6",
  "claude-sonnet-4-5-20250929":"Claude Sonnet 4.5","claude-haiku-4-5-20251001":"Claude Haiku 4.5"
};

const VISION_MODELS = new Set([
  "gpt-5.5","gpt-5.4-mini","anthropic/claude-opus-4-8","anthropic/claude-opus-4-7",
  "anthropic/claude-opus-4-6","anthropic/claude-sonnet-4-6","claude-sonnet-4-5-20250929","claude-haiku-4-5-20251001"
]);

function haptic() { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light'); }
window.Telegram?.WebApp?.ready();
window.Telegram?.WebApp?.expand();

// ── Intent detection ──────────────────────────────────────────────────────────
function detectIntent(text, hasImage) {
  const t = text.toLowerCase();
  const genWords = ["создай картинку","сгенерируй","нарисуй","создай фото","создай изображение","сделай картинку","сделай изображение","придумай картинку","рисунок","generate image","draw"];
  const editWords = ["отредактируй","измени фон","поменяй фон","убери фон","удали фон","добавь на фото","поменяй цвет","измени цвет","замени фон","сделай фон","измени одежду","поменяй одежду","измени фото","edit photo"];
  const docWords = ["создай документ","сохрани в word","создай word","сделай документ","создай docx","напиши документ","оформи документ","создай отчёт"];
  if (docWords.some(w => t.includes(w))) return "doc";
  if (hasImage && editWords.some(w => t.includes(w))) return "edit";
  if (genWords.some(w => t.includes(w))) return "image";
  return "chat";
}

// ── Picker ────────────────────────────────────────────────────────────────────
function togglePicker() {
  haptic();
  const dd = document.getElementById("pickerDropdown");
  const ov = document.getElementById("pickerOverlay");
  const isOpen = dd.classList.toggle("open");
  ov.classList.toggle("open", isOpen);
  if (!isOpen) setTimeout(backToCategories, 250);
}
function openCategory(cat) {
  haptic();
  document.getElementById("viewCategories").classList.remove("active");
  document.getElementById(cat==="gpt"?"viewGptModels":"viewClaudeModels").classList.add("active");
}
function backToCategories() {
  document.getElementById("viewGptModels").classList.remove("active");
  document.getElementById("viewClaudeModels").classList.remove("active");
  document.getElementById("viewCategories").classList.add("active");
}
function selectModel(el) {
  haptic();
  document.querySelectorAll(".model-list-item").forEach(i=>i.classList.remove("selected"));
  el.classList.add("selected");
  currentModel = el.dataset.model;
  localStorage.setItem("selected_model", currentModel);
  updateModelBadge();
  setTimeout(togglePicker, 120);
}
function updateModelBadge() {
  document.getElementById("modelBadge").innerHTML =
    (MODEL_NAMES[currentModel]||currentModel) +
    ' <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="margin-left:2px"><path d="m6 9 6 6 6-6"/></svg>';
  document.querySelectorAll(".model-list-item").forEach(el => {
    el.classList.toggle("selected", el.dataset.model===currentModel);
  });
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function toggleSidebar() {
  haptic();
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("sidebarOverlay").classList.toggle("open");
  renderSidebarChats();
}
function renderSidebarChats() {
  const c = document.getElementById("sidebarChats");
  const ids = Object.keys(chats).sort((a,b)=>b-a);
  if (!ids.length) { c.innerHTML='<div style="padding:20px;text-align:center;color:var(--text3);font-size:14px">Нет чатов</div>'; return; }
  c.innerHTML = ids.map(id => {
    const chat = chats[id];
    return `<div class="chat-item ${id===currentChatId?'active':''}" onclick="loadChat('${id}')">
      <span class="chat-item-title">${escapeHtml(chat.title)}</span>
      <button class="chat-item-delete" onclick="event.stopPropagation();deleteChat('${id}')">✕</button>
    </div>`;
  }).join("");
}

// ── Data ──────────────────────────────────────────────────────────────────────
function loadData() {
  const s = localStorage.getItem("arbuz_chats");
  if (s) chats = JSON.parse(s);
  updateModelBadge();
  newChat();
}
function saveData() { localStorage.setItem("arbuz_chats", JSON.stringify(chats)); }
function newChat() {
  currentChatId = Date.now().toString();
  chats[currentChatId] = { title:"Новый чат", messages:[], created:Date.now() };
  saveData(); renderMessages(); updateSendBtn();
}
function loadChat(id) { currentChatId=id; renderMessages(); toggleSidebar(); }
function deleteChat(id) {
  haptic(); delete chats[id]; saveData();
  if (currentChatId===id) newChat();
  renderSidebarChats();
}
function getMessages() { return (currentChatId&&chats[currentChatId])?chats[currentChatId].messages:[]; }
function addMsg(role, content, imageUrl=null, fileUrl=null, fileName=null) {
  if (!currentChatId) newChat();
  chats[currentChatId].messages.push({role,content,imageUrl,fileUrl,fileName,time:Date.now()});
  if (role==="user" && chats[currentChatId].messages.filter(m=>m.role==="user").length===1)
    chats[currentChatId].title = (content||"Медиа").substring(0,35);
  saveData(); renderMessages();
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderMessages() {
  const c = document.getElementById("messages");
  const msgs = getMessages();
  if (!msgs.length) {
    c.innerHTML = `<div class="empty-state">
      <div class="empty-logo">🍉</div>
      <div class="empty-title">АрбузAI</div>
      <div class="empty-sub">Задай вопрос, создай изображение или отредактируй фото</div>
      <div class="quick-actions">
        <div class="quick-action" onclick="setInput('Нарисуй ')">
          <div class="quick-action-icon">🎨</div>
          <div>Создать изображение</div>
        </div>
        <div class="quick-action" onclick="setInput('')">
          <div class="quick-action-icon">✏️</div>
          <div>Написать или отредактировать</div>
        </div>
        <div class="quick-action" onclick="setInput('Найди ')">
          <div class="quick-action-icon">🌐</div>
          <div>Найди что-то</div>
        </div>
      </div>
    </div>`;
    return;
  }

  c.innerHTML = msgs.map((msg,i) => {
    if (msg.role==="user") return `<div class="msg user">
      <div class="msg-bubble">
        ${msg.imageUrl?`<img class="msg-attached-img" src="${msg.imageUrl}">`:""}
        ${msg.fileName?`<div class="msg-file-chip">📎 ${escapeHtml(msg.fileName)}</div>`:""}
        ${msg.content?escapeHtml(msg.content):""}
      </div>
    </div>`;
    return `<div class="msg ai">
      ${msg.imageUrl?`
        <div class="msg-image-wrap"><img src="${msg.imageUrl}" onclick="saveImage('${msg.imageUrl}')"></div>
        <div class="msg-actions">
          <button class="msg-action" onclick="saveImage('${msg.imageUrl}')">💾 Сохранить фото</button>
        </div>`:""}
      ${msg.fileUrl?`
        <div class="msg-file-chip">📄 ${escapeHtml(msg.fileName||"document.doc")}</div>
        <div class="msg-actions">
          <button class="msg-action" onclick="downloadFile('${msg.fileUrl}','${msg.fileName||'document.doc'}')">⬇️ Скачать Word</button>
        </div>`:""}
      ${msg.content?`
        <div class="msg-bubble">${formatText(msg.content)}</div>
        <div class="msg-actions">
          <button class="msg-action" onclick="copyText(${i})">Копировать</button>
          <button class="msg-action" onclick="saveAsDoc(${i})">В Word</button>
        </div>`:""}
    </div>`;
  }).join("");
  c.scrollTop = c.scrollHeight;
}

// ── Send ──────────────────────────────────────────────────────────────────────
async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById("textInput");
  const text = input.value.trim();
  if (!text && !attachedFiles.length) return;
  if (!API_KEY) { showToast("⚠️ API ключ не настроен"); return; }

  haptic();
  const files = [...attachedFiles];
  const hasImage = files.some(f=>f.base64);
  const intent = detectIntent(text, hasImage);

  input.value=""; autoResize(input); clearFiles(); updateSendBtn(); isLoading=true;

  const imageUrl = hasImage ? files.find(f=>f.base64)?.originalBase64||files.find(f=>f.base64)?.base64 : null;
  const compressedImageUrl = hasImage ? files.find(f=>f.base64)?.base64 : null;
  const docFile = files.find(f=>f.text!==undefined);
  addMsg("user", text||"[Медиа]", imageUrl, null, docFile?.name||null);
  showTyping();

  try {
    if (intent==="image") await doImageGen(text);
    else if (intent==="edit" && compressedImageUrl) await doImageEdit(compressedImageUrl, text);
    else if (intent==="doc") await doDocGen(text);
    else await doChat(text, compressedImageUrl, docFile);
  } catch(e) {
    hideTyping();
    addMsg("assistant", `❌ Ошибка: ${e.message}`);
  }
  isLoading=false; updateSendBtn();
}

async function doChat(text, imageUrl, docFile) {
  const history = getMessages().slice(0,-1);
  const messages = [{role:"system",content:"Ты полезный ИИ-ассистент. Отвечай на русском если вопрос на русском. Будь точным и лаконичным."}];
  history.slice(-6).forEach(m=>{ if(m.content&&!m.imageUrl) messages.push({role:m.role,content:m.content}); });

  let docText = docFile?.text ? "\n\nСодержимое документа:\n"+docFile.text.substring(0,3000) : "";

  if (imageUrl && VISION_MODELS.has(currentModel)) {
    messages.push({role:"user",content:[
      {type:"image_url",image_url:{url:imageUrl}},
      {type:"text",text:(text||"Опиши фото")+docText}
    ]});
  } else {
    messages.push({role:"user",content:text+docText});
  }

  const resp = await fetch(`${API_BASE}/chat/completions`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:currentModel,messages,max_tokens:1000,temperature:0.7})
  });
  const raw = await resp.text();
  let data; try{data=JSON.parse(raw);}catch(e){throw new Error(raw.substring(0,200));}
  if(!resp.ok) throw new Error(JSON.stringify(data));
  hideTyping();
  addMsg("assistant", data.choices[0].message.content);
}

async function doImageGen(text) {
  const resp = await fetch(IMAGE_GEN_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"gpt-image-2",prompt:text,size:"1024x1024",n:1})
  });
  const raw = await resp.text();
  let data; try{data=JSON.parse(raw);}catch(e){throw new Error(raw.substring(0,200));}
  if(!resp.ok) throw new Error(JSON.stringify(data));
  hideTyping();
  const item = data.data[0];
  const url = item.url||(item.b64_json?`data:image/png;base64,${item.b64_json}`:null);
  if(!url) throw new Error("Изображение не получено");
  addMsg("assistant","",url);
}

async function doImageEdit(imageUrl, text) {
  const blob = dataUrlToBlob(imageUrl);
  const form = new FormData();
  form.append("model","gpt-image-2");
  form.append("prompt",text);
  form.append("size","1024x1024");
  form.append("n","1");
  form.append("image",blob,"image.png");

  const resp = await fetch(IMAGE_EDIT_URL,{
    method:"POST",
    headers:{},
    body:form
  });
  const raw = await resp.text();
  let data; try{data=JSON.parse(raw);}catch(e){throw new Error(raw.substring(0,200));}
  if(!resp.ok) throw new Error(JSON.stringify(data));
  hideTyping();
  const item = data.data[0];
  const url = item.url||(item.b64_json?`data:image/png;base64,${item.b64_json}`:null);
  if(!url) throw new Error("Изображение не получено");
  addMsg("assistant","",url);
}

async function doDocGen(text) {
  const messages = [
    {role:"system",content:"Создай содержимое документа. Используй markdown: # заголовки, **жирный**, списки."},
    {role:"user",content:text}
  ];
  const resp = await fetch(`${API_BASE}/chat/completions`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:currentModel,messages,max_tokens:1500,temperature:0.7})
  });
  const data = await resp.json();
  if(!resp.ok) throw new Error(JSON.stringify(data));
  const content = data.choices[0].message.content;
  hideTyping();
  const blob = makeDocBlob(content);
  const url = URL.createObjectURL(blob);
  const name = `arbuz_${Date.now()}.doc`;
  addMsg("assistant",content,null,url,name);
}

// ── Files ─────────────────────────────────────────────────────────────────────
async function handleFiles(input) {
  haptic();
  for (const file of Array.from(input.files)) {
    if (attachedFiles.length>=5){showToast("Максимум 5 файлов");break;}
    const fd={name:file.name,type:file.type};
    if (file.type.startsWith("image/")) {
      fd.base64 = await compressImage(file);
      fd.originalBase64 = await fileToDataUrl(file); // для превью
    } else if (file.name.endsWith(".docx")) {
      try{const ab=await file.arrayBuffer();const r=await mammoth.extractRawText({arrayBuffer:ab});fd.text=r.value.substring(0,3000);}catch(e){fd.text="[Ошибка чтения]";}
    } else if (file.type==="text/plain"||file.name.endsWith(".txt")) {
      fd.text = (await file.text()).substring(0,3000);
    }
    attachedFiles.push(fd);
  }
  renderFilePreview(); updateSendBtn(); input.value="";
}

function renderFilePreview() {
  const p=document.getElementById("filePreview");
  p.innerHTML=attachedFiles.map((f,i)=>`
    <div class="preview-item">
      ${f.base64?`<img src="${f.originalBase64||f.base64}">`:`<div class="doc-icon">${f.name.split('.').pop().toUpperCase()}</div>`}
      <button class="remove-btn" onclick="removeFile(${i})">✕</button>
    </div>`).join("");
}

function removeFile(i){haptic();attachedFiles.splice(i,1);renderFilePreview();updateSendBtn();}
function clearFiles(){attachedFiles=[];renderFilePreview();}

function fileToDataUrl(file){return new Promise(r=>{const fr=new FileReader();fr.onload=e=>r(e.target.result);fr.readAsDataURL(file);});}

async function compressImage(file) {
  return new Promise(r => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const canvas = document.createElement("canvas");
      const max = 512;
      let w = img.width, h = img.height;
      if (w > h) { if (w > max) { h = h * max / w; w = max; } }
      else { if (h > max) { w = w * max / h; h = max; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      r(canvas.toDataURL("image/jpeg", 0.6));
    };
    img.src = url;
  });
}
function dataUrlToBlob(du){const arr=du.split(","),mime=arr[0].match(/:(.*?);/)[1],bs=atob(arr[1]),u8=new Uint8Array(bs.length);for(let i=0;i<bs.length;i++)u8[i]=bs.charCodeAt(i);return new Blob([u8],{type:mime});}
function makeDocBlob(content){const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;font-size:12pt;line-height:1.6;margin:2cm}h1{font-size:18pt}h2{font-size:15pt}</style></head><body>${mdToHtml(content)}</body></html>`;return new Blob([html],{type:"application/vnd.ms-word"});}
function mdToHtml(t){return t.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^- (.+)$/gm,'<li>$1</li>').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');}

// ── Actions ───────────────────────────────────────────────────────────────────
function copyText(i){haptic();const m=getMessages()[i];if(m?.content)navigator.clipboard?.writeText(m.content).then(()=>showToast("✓ Скопировано"));}
function saveImage(url){haptic();const a=document.createElement("a");a.href=url;a.download=`arbuz_${Date.now()}.png`;a.click();showToast("✓ Сохранено");}
function downloadFile(url,name){haptic();const a=document.createElement("a");a.href=url;a.download=name;a.click();showToast("✓ Скачивание...");}
function saveAsDoc(i){haptic();const m=getMessages()[i];if(!m?.content)return;const url=URL.createObjectURL(makeDocBlob(m.content));downloadFile(url,`arbuz_${Date.now()}.doc`);}

let typingEl=null;
function showTyping(){typingEl=document.createElement("div");typingEl.className="msg ai";typingEl.innerHTML=`<div class="typing"><span></span><span></span><span></span></div>`;document.getElementById("messages").appendChild(typingEl);document.getElementById("messages").scrollTop=99999;}
function hideTyping(){if(typingEl){typingEl.remove();typingEl=null;}}

function setInput(t){haptic();const el=document.getElementById("textInput");el.value=t;el.focus();autoResize(el);updateSendBtn();}
function handleKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}}
function autoResize(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,140)+"px";}
function updateSendBtn(){const t=document.getElementById("textInput").value.trim();document.getElementById("sendBtn").disabled=isLoading||(!t&&!attachedFiles.length);}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000);}
function formatText(t){return escapeHtml(t).replace(/```[\w]*\n?([\s\S]*?)```/g,'<pre><code>$1</code></pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');}
function escapeHtml(t){return(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

loadData();
document.getElementById("textInput").addEventListener("input",updateSendBtn);
</script>
