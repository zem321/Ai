<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ассистент</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ease: cubic-bezier(0.22,1,0.36,1);
    --spring: cubic-bezier(.32,.72,0,1);
    --app-height:100vh;
    --bg:#FFFFFF;
    --bg-elevated:#F9F9F9;
    --sidebar-bg:#F7F7F8; --sidebar-input:#FFFFFF;
    --side-active:#ECECEC;
    --ink:#0D0D0D; --ink-soft:#5D5D5D; --ink-faint:#8F8F8F;
    --bubble-user:#F4F4F4;
    --coral:#0D0D0D; --border:rgba(0,0,0,0.10);
    --scrim:rgba(0,0,0,0.20); --sidebar-shadow:0 20px 50px rgba(0,0,0,0.20); --sidebar-w:min(86vw, 330px);
    --neutral-rgb:0,0,0; --shade-rgb:0,0,0;
    --reveal-tint: rgba(255,255,255,0.45);
    --glass-a-grad: linear-gradient(160deg,rgba(255,255,255,.96) 0%,rgba(251,251,251,.94) 48%,rgba(255,255,255,.96) 100%);
    --glass-a-blur: blur(2px) saturate(100%) brightness(1);
    --glass-a-shadow: 0 1px 2px rgba(0,0,0,.008), inset 0 1px 0 rgba(255,255,255,.88), inset 0 -0.5px 0 rgba(0,0,0,.010);
    --glass-b-grad: linear-gradient(160deg,rgba(246,246,246,.94) 0%,rgba(242,242,242,.90) 48%,rgba(246,246,246,.94) 100%);
    --glass-b-blur: blur(2px) saturate(100%) brightness(1);
    --glass-b-shadow: 0 1px 1px rgba(0,0,0,.008), inset 0 1px 0 rgba(255,255,255,.62), inset 0 -0.5px 0 rgba(0,0,0,.010);
    --glass-b-fallback:#F4F4F4;
    --ease-drawer: cubic-bezier(0.4, 0.0, 0.2, 1);
    font-family:"Inter", -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111110; --bg-elevated:#242424; --side-active:#2E2E2E; --ink:#EBEBEB; --ink-soft:#A0A0A0; --ink-faint:#6E6E6E;
      --sidebar-bg:#242424; --sidebar-input:#242424;
      --bubble-user:#2E2E2E; --coral:#FFFFFF; --border:rgba(255,255,255,0.09);
      --scrim:rgba(0,0,0,0.45); --sidebar-shadow:0 20px 50px rgba(0,0,0,0.55);
      --neutral-rgb:128,120,100; --shade-rgb:20,18,14;
      --reveal-tint: rgba(0,0,0,0.35);
      --glass-a-grad: linear-gradient(160deg,rgba(42,42,39,.84) 0%,rgba(34,34,32,.76) 48%,rgba(42,42,39,.80) 100%);
      --glass-a-blur: blur(2px) saturate(102%) brightness(.90);
      --glass-a-shadow: 0 2px 8px rgba(0,0,0,.45);
      --glass-b-grad: linear-gradient(160deg,rgba(63,63,59,.82) 0%,rgba(53,53,49,.74) 48%,rgba(63,63,59,.79) 100%);
      --glass-b-blur: blur(2px) saturate(102%) brightness(.90);
      --glass-b-shadow: 0 2px 8px rgba(0,0,0,.45);
      --glass-b-fallback:#F0EFE0;
    }
    #moreBtn{background:transparent; box-shadow:none;}
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; background:var(--bg); color:var(--ink); overflow:hidden; -webkit-text-size-adjust:100%; text-size-adjust:100%;}
  body.auth-pending .app{visibility:hidden;}
  .auth-bootstrap{position:fixed; inset:0; z-index:10000; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; padding:32px; text-align:center; background:var(--bg); color:var(--ink);}
  .auth-bootstrap-icon{font-size:36px;}
  .auth-bootstrap-text{font-size:14px; color:var(--ink-soft);}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  .glass, .glass-strong{background:var(--glass-a-grad); backdrop-filter:var(--glass-a-blur); -webkit-backdrop-filter:var(--glass-a-blur);
    border:none; box-shadow:var(--glass-a-shadow); position:relative; overflow:hidden;}
  .glass-pill{background:var(--glass-b-grad); backdrop-filter:var(--glass-b-blur); -webkit-backdrop-filter:var(--glass-b-blur);
    border:none; box-shadow:var(--glass-b-shadow); position:relative; overflow:hidden;}
  @supports not (backdrop-filter: blur(1px)){ .glass, .glass-strong{background:var(--bg-elevated);} .glass-pill{background:var(--glass-b-fallback);} }

  @supports (height:100dvh){
    :root{--app-height:100dvh;}
  }
  .app{position:relative; height:var(--app-height,100vh); min-height:0; overflow:hidden; background:var(--bg-elevated);}
  .main-veil{position:absolute; inset:0; z-index:25; background:transparent; backdrop-filter:blur(0.8px); -webkit-backdrop-filter:blur(0.8px);
    opacity:0; visibility:hidden; transition:opacity .4s var(--ease-drawer), visibility .4s, background .9s var(--ease); pointer-events:none;}
  .main-veil.show{opacity:1; visibility:visible; pointer-events:auto;}
  .main-veil.dragging{transition:none !important;}
  .main-veil.ctx-dim{background:rgba(var(--shade-rgb),0.16);}

  /* ---------------- Sidebar ---------------- */
  .sidebar{position:fixed; top:0; left:0; height:100%; width:var(--sidebar-w); background:var(--sidebar-bg); z-index:40;
    display:flex; flex-direction:column; padding:env(safe-area-inset-top,18px) 0 env(safe-area-inset-bottom,14px) 0;
    transform:translateX(-105%); transition:transform .4s var(--ease-drawer); will-change:transform;
    box-shadow:8px 0 40px rgba(0,0,0,.10);}
  .sidebar.open{transform:translateX(0);}
  .sidebar.dragging{transition:none !important;}
  .sidebar-top{display:flex; align-items:center; justify-content:space-between; padding:8px 18px 18px;}
  .mark{width:26px; height:26px; color:var(--coral); display:flex; align-items:center; justify-content:center;}
  .side-scroll{flex:1; overflow-y:auto; padding:0 10px 92px;}
  .side-scroll::-webkit-scrollbar{width:0;}
  .side-search{margin:2px 10px 14px; position:relative;}
  .side-search input{width:100%; border:none; outline:none; background:var(--sidebar-input); border-radius:14px;
    padding:11px 14px 11px 36px; font-size:14.5px; color:var(--ink); font-family:inherit; box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .side-search input::placeholder{color:var(--ink-faint);}
  .side-search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-faint);}
  .side-label{font-size:12px; color:var(--ink-faint); padding:14px 12px 6px; letter-spacing:.2px;}
  .side-item{position:relative; display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:12px;
    font-size:14.5px; color:var(--ink); cursor:pointer; overflow:hidden;
    transition:background .3s var(--ease), transform .6s var(--ease), opacity .6s var(--ease); user-select:none;}
  .side-item:hover{background:rgba(var(--neutral-rgb),0.10);}
  .side-item.active{background:var(--side-active); font-weight:500;}
  .side-item .t{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:transform .25s var(--ease);}
  .side-item.pressed{background:var(--bg); transform:scale(1.035); z-index:22; box-shadow:0 6px 18px rgba(0,0,0,0.12);}
  .side-dim-overlay{position:absolute; inset:0; z-index:9; pointer-events:none; background:transparent; transition:background .9s var(--ease);}
  .sidebar.ctx-active .side-dim-overlay{background:rgba(var(--shade-rgb),0.16);}
  .side-empty{padding:20px 12px; color:var(--ink-faint); font-size:13.5px;}

  .side-fade{position:absolute; left:0; right:0; bottom:0; height:104px; pointer-events:none; z-index:1;
    background:linear-gradient(to bottom, transparent 0%, var(--sidebar-bg) 100%);}
  .sidebar-bottom{position:absolute; left:0; right:0; bottom:0; background:transparent; z-index:2;
    display:flex; flex-direction:column; gap:8px; padding:14px 16px calc(env(safe-area-inset-bottom,2px) + 2px);}
  .sidebar-bottom-row{display:flex; align-items:center; gap:10px;}
  .avatar-circle{width:32px; height:32px; border-radius:50%; background:var(--bubble-user); color:var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; flex-shrink:0;}
  .account-chevron{color:var(--ink-faint); flex-shrink:0;}
  .new-chat-pill{margin-left:auto; display:flex; align-items:center; gap:6px; background:var(--ink); color:var(--bg);
    border:none; border-radius:22px; padding:11px 18px; font-size:14.5px; font-weight:600; cursor:pointer;
    transition:transform .2s var(--spring); font-family:inherit;}
  .new-chat-pill:active{transform:scale(.94);}
  .profile-btn{display:flex; align-items:center; gap:8px; background:none; border:none; cursor:pointer; padding:0; font-family:inherit;}

  /* ---------------- Main chat area ---------------- */
  .main{position:relative; height:100%; z-index:10; background:var(--bg);
    transition:transform .4s var(--ease-drawer), border-radius .4s var(--ease-drawer);}
  .main.dragging{transition:none !important;}
  .main.pushed{transform:translateX(var(--sidebar-w)); border-radius:26px 0 0 26px;}
  .topbar{position:absolute; top:0; left:0; right:0; z-index:8; display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top,10px) + 8px) 16px 16px; pointer-events:none;}
  .topbar > *{pointer-events:auto;}
  .icon-btn{width:38px; height:38px; border-radius:50%; border:none; color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:transform .2s var(--spring);}
  .icon-btn svg{width:17px; height:17px; z-index:1;}
  .icon-btn:active{transform:scale(.88);}
  .top-actions{display:flex; align-items:center; gap:8px; position:relative;}
  .topbar-title{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:15px; font-weight:500;
    color:var(--ink); opacity:0; visibility:hidden; transition:opacity .3s var(--ease); pointer-events:none; white-space:nowrap;}
  .topbar-title.show{opacity:1; visibility:visible;}
  .welcome .ghost-icon{width:44px; height:44px; color:var(--ink);}
  .welcome .incog-text{margin:0; color:var(--ink-soft); font-size:13.5px; line-height:1.5; max-width:320px;}
  .ghost-btn, #pillGroup{transition:opacity .32s var(--ease), transform .32s var(--ease); }
  .top-actions.has-msgs .ghost-btn{opacity:0; transform:scale(.85); pointer-events:none; position:absolute; right:0;}
  .top-actions:not(.has-msgs) #pillGroup{opacity:0; transform:scale(.85); pointer-events:none; position:absolute; right:0;}
  .pill-group{display:flex; align-items:center; gap:2px; border-radius:22px; padding:4px;}
  .pill-group .icon-btn{width:32px; height:32px;}
  .pill-group .icon-btn.dk{background:var(--ink); color:var(--bg); width:30px; height:30px; z-index:1;}
  .pill-group .icon-btn.dk svg{width:14px; height:14px;}
  .pill-group .icon-btn:not(.dk):hover{background:rgba(var(--neutral-rgb),0.06);}
  .pill-group .icon-btn.dk:active{transform:scale(.86);}
  #menuBtn, #ghostBtn, #incognitoCloseBtn, #pillGroup{
    background:linear-gradient(155deg,rgba(255,255,255,.90) 0%,rgba(248,248,248,.82) 100%);
    backdrop-filter:blur(18px) saturate(135%); -webkit-backdrop-filter:blur(18px) saturate(135%);
    border:none;
    box-shadow:
      0 1px 2px rgba(0,0,0,.035),
      0 6px 18px rgba(0,0,0,.06),
      inset 0 1px 0 rgba(255,255,255,.94),
      inset 0 0 0 .5px rgba(0,0,0,.024),
      inset 0 -1px 0 rgba(0,0,0,.016);
  }
  #menuBtn, #ghostBtn, #incognitoCloseBtn{
    width:42px; height:42px; min-width:42px; min-height:42px; flex:0 0 42px; padding:0;
  }
  #menuBtn svg{width:20px; height:20px;}
  #ghostBtn svg, #incognitoCloseBtn svg{width:20px; height:20px;}
  #pillGroup{width:98px; height:42px; padding:4px 7px; gap:14px; border-radius:21px;}
  #pillGroup .icon-btn, #pillGroup .icon-btn.dk{
    width:35px; height:34px; background:transparent; color:var(--ink);
  }
  #pillGroup .icon-btn.dk svg{width:22px; height:22px;}
  #pillGroup #moreBtn svg{width:22px; height:22px;}
  @media (prefers-color-scheme: dark){
    #menuBtn, #ghostBtn, #incognitoCloseBtn, #pillGroup{
      background:var(--glass-a-grad);
      backdrop-filter:var(--glass-a-blur); -webkit-backdrop-filter:var(--glass-a-blur);
      border:none; box-shadow:var(--glass-a-shadow);
    }
    #menuBtn, #ghostBtn, #incognitoCloseBtn{
      width:38px; height:38px; min-width:38px; min-height:38px; flex-basis:38px;
    }
    #menuBtn svg{width:17px; height:17px; stroke-width:1.8;}
    #ghostBtn svg, #incognitoCloseBtn svg{width:17px; height:17px;}
    #pillGroup{width:auto; height:auto; padding:4px; gap:2px; border-radius:22px;}
    #pillGroup .icon-btn{width:32px; height:32px;}
    #pillGroup .icon-btn.dk{
      width:30px; height:30px; background:var(--ink); color:var(--bg);
    }
    #pillGroup .icon-btn.dk svg{width:14px; height:14px; stroke-width:1.9;}
    #pillGroup #moreBtn svg{width:17px; height:17px;}
  }

  .menu-pop{position:absolute; top:calc(100% + 8px); right:0; width:200px; border-radius:18px; padding:6px;
    opacity:0; visibility:hidden; transform:translateY(-6px) scale(.97); transform-origin:top right;
    transition:opacity .2s, transform .2s var(--spring), visibility .2s; z-index:12;}
  .menu-pop.open{opacity:1; visibility:visible; transform:translateY(0) scale(1);}
  .menu-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:14px; color:var(--ink); transition:background .15s;}
  .menu-item:hover{background:rgba(var(--neutral-rgb),0.14);}
  .menu-item svg{width:16px; height:16px; color:var(--ink-soft); flex-shrink:0;}
  .menu-item.danger{color:#B4442E;} .menu-item.danger svg{color:#B4442E;}
  .menu-sep{height:1px; background:var(--border); margin:4px 8px;}

  /* ---------------- Messages ---------------- */
  .messages{position:absolute; inset:0; overflow-y:auto; padding:calc(env(safe-area-inset-top,10px) + 76px) 18px 0;
    padding-bottom:0 !important; scroll-padding-bottom:var(--messages-bottom-inset, 130px); display:flex; flex-direction:column; gap:26px;}
  .messages::-webkit-scrollbar{width:0;}
  #scroll-spacer{flex-shrink:0; width:100%;}
  .welcome{
    --welcome-focus-scale:1;
    position:absolute; left:50%; top:50%; width:min(100%, 348px); margin:0;
    text-align:center; display:flex; flex:0 0 auto; flex-direction:column; align-items:center; gap:10px; padding:0 24px;
    transform:translate(-50%,-50%) scale(var(--welcome-focus-scale));
    transform-origin:center; animation:welcomeIn .55s var(--spring);
  }
  .welcome > *{flex:0 0 auto;}
  .welcome .mark-big{width:40px; min-width:40px; height:40px; min-height:40px; color:var(--coral);}
  .welcome h1{font-size:21px; line-height:1.2; font-weight:600; margin:6px 0 0; font-family:"Source Serif 4", Georgia, serif;}
  .welcome p{margin:0; color:var(--ink-soft); font-size:14px; line-height:1.4; max-width:300px;}
  @keyframes welcomeIn{
    from{opacity:0; transform:translate(-50%,calc(-50% + 12px)) scale(var(--welcome-focus-scale));}
    to{opacity:1; transform:translate(-50%,-50%) scale(var(--welcome-focus-scale));}
  }
  @keyframes msgIn{from{opacity:0; transform:translateY(10px) scale(.985);} to{opacity:1; transform:translateY(0) scale(1);}}
  .row-user{display:flex; flex-direction:column; align-items:flex-end; gap:8px; animation:msgIn .38s var(--spring);}
  .bubble-user{background:var(--bubble-user); color:var(--ink); padding:12px 16px; border-radius:20px; font-size:15px; line-height:1.5; max-width:82%;}
  .ai-block{display:flex; flex-direction:column; gap:10px; animation:msgIn .42s var(--spring);}
  .thinking-row{display:flex; align-items:center; gap:8px; color:var(--ink-faint); font-size:14px; cursor:pointer; user-select:none;}
  .thinking-row svg.clock{width:15px; height:15px; flex-shrink:0;}
  .thinking-row .chev{margin-left:auto; width:8px; height:8px; border-right:1.5px solid var(--ink-faint); border-bottom:1.5px solid var(--ink-faint); transform:rotate(-45deg); transition:transform .3s var(--spring);}
  .thinking-row.open .chev{transform:rotate(45deg);}
  .thinking-body{font-size:13px; color:var(--ink-faint); line-height:1.55; max-height:0; overflow:hidden; transition:max-height .35s var(--spring); padding-left:23px; border-left:1.5px solid var(--border); margin-left:7px;}
  .thinking-row.open + .thinking-body{max-height:200px;}
  .ai-text{font-family:"Source Serif 4", Georgia, serif; font-size:16.5px; line-height:1.65; color:var(--ink); word-break:break-word;}
  .ai-text.is-streaming{
    --stream-tail:42px;
    overflow:hidden; contain:paint; will-change:height;
    -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - var(--stream-tail)),transparent 100%);
    mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - var(--stream-tail)),transparent 100%);
  }
  .typing-dots{display:flex; gap:4px; padding:4px 0;}
  .typing-dots span{width:6px; height:6px; border-radius:50%; background:var(--ink-faint); animation:dot 1.2s infinite;}
  .typing-dots span:nth-child(2){animation-delay:.15s;} .typing-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes dot{0%,80%,100%{transform:translateY(0); opacity:.4;} 40%{transform:translateY(-5px); opacity:1;}}
  .action-row{display:flex; align-items:center; gap:14px; color:var(--ink-faint); padding-top:2px;}
  .action-row button{background:none; border:none; color:var(--ink-faint); cursor:pointer; padding:4px; display:flex; transition:color .15s, transform .2s var(--spring);}
  .action-row button:hover{color:var(--ink);} .action-row button.on{color:var(--coral);} .action-row button:active{transform:scale(.85);}
  .action-row svg{width:16px; height:16px;}
  .disclaimer{display:flex; align-items:flex-start; gap:10px; padding-top:4px;}
  .disclaimer .mark{width:20px; height:20px; margin-top:1px; flex-shrink:0;}
  .disclaimer p{margin:0; font-size:12px; color:var(--ink-faint); line-height:1.5;}

  /* ---------------- Markdown Styling ---------------- */
  .ai-text code { font-family: 'Courier New', Courier, monospace; background-color: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 4px; font-size: 14px; color: var(--coral); }
  .ai-text pre.code-block { font-family: 'Courier New', Courier, monospace; background-color: rgba(0,0,0,0.04); padding: 12px; border-radius: 8px; font-size: 14px; overflow-x: auto; margin: 8px 0; border: 1px solid var(--border); }
  .ai-text pre.code-block code { background-color: transparent; padding: 0; border-radius: 0; color: var(--ink); }
  .ai-text .markdown-link { color: var(--coral); text-decoration: underline; font-weight: 500; }
  .ai-text .formula-block { text-align: center; font-size: 17px; margin: 12px 0; padding: 10px; background-color: rgba(0,0,0,0.02); border-radius: 8px; line-height: 1.5; }
  .ai-text .formula-inline { font-size: 16px; padding: 0 2px; }
  .ai-text ul, .ai-text ol { margin: 6px 0 6px 20px; padding-left: 18px; }
  .ai-text ul ul, .ai-text ol ol, .ai-text ul ol, .ai-text ol ul { margin-top: 4px; margin-bottom: 4px; }
  .ai-text li { margin-bottom: 4px; }
  .ai-text .task-list-item { list-style: none; margin-left: -18px; }
  .ai-text .task-list-item input[type="checkbox"] { width: 15px; height: 15px; margin: 0 7px 0 0; vertical-align: -2px; accent-color: var(--coral); }
  .ai-text blockquote { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--coral); background: rgba(0,0,0,0.025); border-radius: 0 8px 8px 0; color: var(--ink); }
  .ai-text blockquote pre.code-block { margin: 6px 0; }
  .ai-text table.markdown-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 14px; overflow: hidden; border-radius: 8px; }
  .ai-text table.markdown-table th, .ai-text table.markdown-table td { border: 1px solid var(--border); padding: 7px 9px; text-align: left; vertical-align: top; }
  .ai-text table.markdown-table th { background: rgba(0,0,0,0.035); font-weight: 600; color: var(--ink); }
  .ai-text table.markdown-table tr:nth-child(even) td { background: rgba(0,0,0,0.015); }
  .ai-text del { color: var(--ink-soft); }
  .ai-text .markdown-image { max-width: 100%; border-radius: 10px; display: block; margin: 8px 0; }
  .ai-text hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .ai-text .code-token.comment { color: #7A7A72; font-style: italic; }
  .ai-text .code-token.keyword { color: #B85A2E; font-weight: 600; }
  .ai-text .code-token.string { color: #2F7D52; }
  .ai-text .code-token.number { color: #3478F6; }
  .ai-text .code-token.function { color: #8A63D2; }
  .ai-text .code-token.operator, .ai-text .code-token.punctuation { color: var(--ink-soft); }
  .ai-text .code-token.tag { color: #B85A2E; }
  .ai-text .code-token.attr { color: #8A63D2; }
  .ai-text .code-token.value { color: #2F7D52; }
  .ai-text h1, .ai-text h2, .ai-text h3 { margin-top: 12px; margin-bottom: 6px; font-weight: 600; color: var(--ink); }

  /* ---------------- Attachments ---------------- */
  .attach-strip{display:flex; gap:8px; flex-wrap:wrap;}
  .attach-strip:empty{display:none;}
  .attach-thumb{position:relative; width:52px; height:52px; border-radius:12px; overflow:hidden; flex-shrink:0; background:rgba(var(--neutral-rgb),0.12);}
  .attach-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .attach-thumb .file-icon{width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:18px; gap:1px; padding:3px;}
  .attach-thumb .file-name{font-size:7.5px; color:var(--ink-soft); max-width:46px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .attach-thumb .rm-btn{position:absolute; top:1px; right:1px; width:16px; height:16px; border-radius:50%; border:none;
    background:rgba(var(--shade-rgb),0.55); color:#fff; font-size:11px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .bubble-attachments{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:2px;}
  .row-user .bubble-attachments{justify-content:flex-end;}
  .bubble-img{width:100%; max-width:68px; border-radius:10px; object-fit:cover; cursor:zoom-in; display:block; box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .bubble-file{display:flex; align-items:center; gap:7px; background:rgba(var(--neutral-rgb),0.14); border-radius:10px; padding:7px 10px; max-width:220px;}
  .bubble-file-icon{font-size:20px; flex-shrink:0;}
  .bubble-file-name{font-size:12.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  
  .bot-file{max-width:86%; background:var(--bg-elevated); border:1px solid var(--border); border-radius:18px; padding:13px 15px; box-shadow:0 1px 4px rgba(0,0,0,.05); display:flex; align-items:center; gap:12px; cursor:pointer; transition:transform .15s ease; -webkit-tap-highlight-color:transparent; margin-bottom:8px;}
  .bot-file:active{transform:scale(0.985);}
  .bot-file-icon{width:38px; height:38px; background:var(--side-active); border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:15px; font-weight:700; color:var(--ink-soft); border:1px solid var(--border);}
  .bot-file-content{flex:1; min-width:0;}
  .bot-file-name{font-weight:600; font-size:15px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:1px;}
  .bot-file-meta{font-size:13px; color:var(--ink-soft);}

  .lightbox{position:fixed; inset:0; background:rgba(10,9,7,0.86); z-index:80; display:flex; align-items:center; justify-content:center; opacity:0; visibility:hidden; transition:opacity .25s, visibility .25s; padding:24px;}
  .lightbox.show{opacity:1; visibility:visible;}
  .lightbox img{max-width:94vw; max-height:86vh; border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.5); object-fit:contain;}

  /* ---------------- Composer ---------------- */
  .input-area{position:absolute; bottom:0; left:0; right:0; z-index:26; padding:7px 15px calc(max(env(safe-area-inset-bottom,10px), 10px) + 18px); background:transparent; pointer-events:none;}
  .main.pushed .input-card,
  .main.dragging .input-card{pointer-events:none;}
  .input-card{
    --composer-duration:800ms;
    --composer-ease:cubic-bezier(.4,0,.2,1);
    pointer-events:auto; position:relative; overflow:hidden; width:100%; height:48px; min-height:48px;
    isolation:isolate; border-radius:25px; padding:6px 6px 6px 8px; display:grid; grid-template-columns:36px minmax(0,1fr) auto 36px;
    grid-template-rows:36px; align-items:center; column-gap:8px; row-gap:0;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif;
    transition:height var(--composer-duration) var(--composer-ease),
      min-height var(--composer-duration) var(--composer-ease),
      padding var(--composer-duration) var(--composer-ease),
      border-radius var(--composer-duration) var(--composer-ease),
      grid-template-rows var(--composer-duration) var(--composer-ease),
      row-gap var(--composer-duration) var(--composer-ease),
      box-shadow var(--composer-duration) var(--composer-ease),
      backdrop-filter var(--composer-duration) var(--composer-ease);
    will-change:height, border-radius, padding;
  }
  .input-card::before{
    content:""; position:absolute; z-index:0; left:0; right:0; bottom:0; height:320px;
    pointer-events:none; transform:none; will-change:auto;
    background-size:100% 320px; background-position:center bottom; background-repeat:no-repeat;
  }
  .input-card::after{
    content:""; position:absolute; z-index:3; inset:0; border-radius:inherit; pointer-events:none;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.96),
      inset 0 0 0 .5px rgba(0,0,0,.026),
      inset 0 -1px 0 rgba(0,0,0,.018);
  }
  .input-card.expanded{
    height:auto; min-height:92px; border-radius:25px; padding:9px 6px 8px 8px;
    grid-template-rows:minmax(30px,auto) 35px; row-gap:4px;
  }
  .input-card.expanded.has-attachments{grid-template-rows:auto minmax(32px,auto) 36px;}
  .input-card.animating{overflow:hidden;}
  .input-card.measuring{transition:none !important;}
  .input-card.measuring *{transition:none !important; animation:none !important;}
  @media (prefers-color-scheme: light){
    .input-card{
      background:transparent !important;
      backdrop-filter:none !important;
      -webkit-backdrop-filter:none !important;
      border:none !important;
      box-shadow:
        0 1px 2px rgba(0,0,0,.04),
        0 7px 18px rgba(0,0,0,.07),
        0 20px 48px rgba(0,0,0,.075),
        inset 0 1px 0 rgba(255,255,255,.96),
        inset 0 0 0 .5px rgba(0,0,0,.026),
        inset 0 -1px 0 rgba(0,0,0,.018) !important;
    }
    .input-card::before{
      background:linear-gradient(160deg,rgba(255,255,255,.94) 0%,rgba(251,251,251,.90) 48%,rgba(255,255,255,.93) 100%);
      backdrop-filter:blur(2px) saturate(102%) brightness(.90);
      -webkit-backdrop-filter:blur(2px) saturate(102%) brightness(.90);
    }
  }
  .input-card textarea{
    position:relative; z-index:2;
    width:100%; background:transparent; border:none; outline:none !important; box-shadow:none !important;
    -webkit-appearance:none; appearance:none; color:var(--ink); font-family:inherit; font-size:16px; font-weight:400; line-height:1.4;
    letter-spacing:-.01em; resize:none; display:block; padding:0; margin:0; caret-color:#0A84FF;
    -webkit-text-size-adjust:100%;
    transition:opacity var(--composer-duration) var(--composer-ease),
      transform var(--composer-duration) var(--composer-ease);
  }
  .input-card:not(.expanded) textarea{
    grid-column:2 / 4; grid-row:1; height:26px !important; min-height:26px; max-height:26px; overflow:hidden; white-space:nowrap;
  }
  .input-card.expanded textarea{
    grid-column:1 / -1; grid-row:1; min-height:26px; max-height:112px; align-self:center;
    padding-left:8px; white-space:pre-wrap; overflow-y:auto;
  }
  .input-card.expanded.has-attachments textarea{grid-row:2;}
  .input-card textarea::placeholder{color:var(--ink-faint);}
  .input-card:not(.expanded) .attach-strip{display:none;}
  .input-card.expanded .attach-strip{grid-column:1 / -1; grid-row:1; align-self:start; position:relative; z-index:2;}
  .input-toolbar{display:contents;}
  .pill-plus{
    position:relative; z-index:2; grid-column:1; grid-row:1; width:35px; height:35px; padding:0; flex-shrink:0; color:var(--ink); border:none;
    border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-family:inherit;
    background:transparent !important; box-shadow:none !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important;
    transition:transform .5s var(--ease); will-change:transform; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  }
  .pill-plus:active{transform:scale(.88);}
  .pill-plus svg{width:24px; height:24px; position:relative; z-index:1; transform:translateY(1px); shape-rendering:geometricPrecision;}
  .pill-model{
    z-index:2; height:35px; padding:0 7px; font-size:14.5px; font-weight:400; letter-spacing:-.012em; color:var(--ink); flex-shrink:1; min-width:0;
    border:none; border-radius:999px; display:flex; align-items:center; gap:6px; justify-content:center; font-family:inherit;
    cursor:pointer; max-width:48vw; background:transparent !important; box-shadow:none !important;
    backdrop-filter:none !important; -webkit-backdrop-filter:none !important;
    transition:opacity var(--composer-duration) var(--composer-ease),
      transform var(--composer-duration) var(--composer-ease), color .2s;
  }
  .input-card:not(.expanded) .pill-model{
    position:absolute; opacity:0; visibility:hidden; pointer-events:none; transform:translateY(4px) scale(.98);
  }
  .input-card.expanded .pill-model{
    position:relative; grid-column:3; grid-row:2; justify-self:end; margin-left:0;
    opacity:1; visibility:visible; transform:translateY(0) scale(1);
  }
  .input-card.expanded .pill-plus{grid-column:1; grid-row:2;}
  .input-card.expanded.has-attachments .pill-plus,
  .input-card.expanded.has-attachments .pill-model,
  .input-card.expanded.has-attachments .send-btn{grid-row:3;}
  .pill-model:active{transform:scale(.96);}
  .pill-model span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; position:relative; z-index:1;}
  .pill-model .chev{width:5px; height:5px; border-right:1.3px solid var(--ink-faint); border-bottom:1.3px solid var(--ink-faint); transform:rotate(45deg); flex-shrink:0; position:relative; z-index:1;}
  .tool-spacer{display:none;}
  .send-btn{
    position:relative; z-index:2; grid-column:4; grid-row:1; width:34px; height:34px; min-width:34px; border-radius:50%; background:#0A84FF; color:#fff;
    flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; border:none; padding:0; margin:0;
    transition:opacity var(--composer-duration) var(--composer-ease),
      background var(--composer-duration) var(--composer-ease),
      color var(--composer-duration) var(--composer-ease),
      transform var(--composer-duration) var(--composer-ease);
  }
  .input-card.expanded .send-btn{grid-column:4; grid-row:2;}
  .send-btn:active{transform:scale(.92);}
  .send-btn:disabled{background:rgba(var(--neutral-rgb),.16); color:var(--ink-faint); opacity:.8; cursor:default;}
  .send-btn svg{width:20px; height:20px;}

  /* ---------------- Model sheet ---------------- */
  .sheet-scrim{position:fixed; inset:0; background:transparent; backdrop-filter:none; -webkit-backdrop-filter:none; z-index:50; opacity:0; pointer-events:none; transition:opacity .28s var(--ease);}
  .sheet-scrim.show{opacity:1; pointer-events:all;}
  .sheet{
    --sheet-origin-x:50%;
    --sheet-duration:700ms;
    --sheet-ease:cubic-bezier(.16,1,.3,1);
    position:fixed; left:12px; bottom:92px; z-index:60;
    width:min(calc(100vw - 24px), 242px); max-width:242px; height:176px; min-height:176px; max-height:176px;
    isolation:isolate; margin:0; padding:8px; transform:translateY(4px) scale(.96); transform-origin:var(--sheet-origin-x) 100%;
    opacity:0; visibility:hidden; border-radius:25px; pointer-events:none; overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif;
    will-change:transform, opacity;
    transition:
      opacity var(--sheet-duration) var(--sheet-ease),
      transform var(--sheet-duration) var(--sheet-ease),
      visibility 0s linear var(--sheet-duration);
    display:flex; flex-direction:column;
    background:linear-gradient(160deg,rgba(255,255,255,.94) 0%,rgba(251,251,251,.90) 48%,rgba(255,255,255,.93) 100%) !important;
    backdrop-filter:blur(2px) saturate(102%) brightness(.90) !important;
    -webkit-backdrop-filter:blur(2px) saturate(102%) brightness(.90) !important;
    border:none !important;
    box-shadow:
      0 1px 2px rgba(0,0,0,.04),
      0 8px 22px rgba(0,0,0,.085),
      0 22px 52px rgba(0,0,0,.11),
      inset 0 1px 0 rgba(255,255,255,.96),
      inset 0 0 0 .5px rgba(0,0,0,.026),
      inset 0 -1px 0 rgba(0,0,0,.018) !important;
  }
  .sheet.open{
    opacity:1; visibility:visible; transform:translateY(0) scale(1); pointer-events:all;
    transition-delay:0s,0s,0s;
  }
  .sheet-scroll{
    flex:1; height:100%; min-height:0; overflow:hidden; position:relative; z-index:2;
  }
  .sheet-page{
    width:100%; height:100%; display:flex; flex-direction:column; opacity:1; transform:translateX(0);
    transition:
      opacity var(--sheet-duration) var(--sheet-ease),
      transform var(--sheet-duration) var(--sheet-ease);
    will-change:opacity, transform;
  }
  .sheet-page.outgoing{position:absolute; inset:0;}
  .sheet-page.incoming{position:relative; opacity:0; transform:translateX(12px);}
  .sheet-scroll[data-direction="back"] .sheet-page.incoming{transform:translateX(-12px);}
  .sheet-scroll.transitioning .sheet-page.outgoing{opacity:0; transform:translateX(-10px);}
  .sheet-scroll[data-direction="back"].transitioning .sheet-page.outgoing{transform:translateX(10px);}
  .sheet-scroll.transitioning .sheet-page.incoming{opacity:1; transform:translateX(0);}
  .ms-current{padding:6px 10px 8px;}
  .ms-current span{display:block; font-size:11px; font-weight:400; color:var(--ink-faint); margin-bottom:2px;}
  .ms-current b{display:block; font-size:15.5px; line-height:1.25; font-weight:500; letter-spacing:-.015em; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ms-item{flex:1 1 0; min-height:0; display:flex; align-items:center; gap:8px; padding:5px 10px; cursor:pointer; border-radius:14px; transition:background .24s var(--ease), transform .3s var(--ease);}
  .ms-item:active{background:rgba(var(--neutral-rgb),0.12);}
  .ms-item:hover{background:transparent;}
  .ms-item.active{background:transparent;}
  .ms-item.active .ms-info b{color:var(--ink);}
  .ms-info{flex:1; min-width:0;}
  .ms-info b{font-size:14.5px; line-height:1.2; font-weight:500; letter-spacing:-.012em; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .2s var(--ease);}
  .ms-info small{display:block; color:var(--ink-faint); font-size:11.5px; line-height:1.2; font-weight:400; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ms-arrow{color:var(--ink); font-size:21px; line-height:1; flex-shrink:0;}
  .ms-check{order:-1; width:15px; height:15px; color:var(--ink); opacity:0; flex-shrink:0;}
  .ms-item.active .ms-check{opacity:1;}
  .ms-back{min-height:0; color:var(--ink-soft); font-weight:500; font-size:12.5px; gap:7px; border-bottom:1px solid var(--border); border-radius:13px 13px 7px 7px; margin-bottom:1px;}
  .ms-sep{height:1px; background:rgba(var(--neutral-rgb),.085); margin:0 10px; flex-shrink:0;}
  @media (prefers-color-scheme: dark){
    .sheet{
      background:linear-gradient(160deg,rgba(42,42,39,.84) 0%,rgba(34,34,32,.76) 48%,rgba(42,42,39,.80) 100%) !important;
      backdrop-filter:blur(2px) saturate(102%) brightness(.90) !important;
      -webkit-backdrop-filter:blur(2px) saturate(102%) brightness(.90) !important;
      border:none !important;
      box-shadow:0 18px 46px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 0 .5px rgba(255,255,255,.05) !important;
    }
    .input-card{
      background:transparent !important;
      backdrop-filter:none !important;
      -webkit-backdrop-filter:none !important;
      border:none !important;
      box-shadow:0 14px 36px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 0 .5px rgba(255,255,255,.05) !important;
    }
    .input-card::before{
      background:linear-gradient(160deg,rgba(42,42,39,.84) 0%,rgba(34,34,32,.76) 48%,rgba(42,42,39,.80) 100%);
      backdrop-filter:blur(2px) saturate(102%) brightness(.90);
      -webkit-backdrop-filter:blur(2px) saturate(102%) brightness(.90);
    }
    .input-card::after{
      box-shadow:inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 0 .5px rgba(255,255,255,.05);
    }
  }

  /* ---------------- Custom modal ---------------- */
  .modal-scrim{position:fixed; inset:0; background:var(--scrim); backdrop-filter:blur(3px); z-index:70; opacity:0; visibility:hidden; transition:opacity .25s, visibility .25s; display:flex; align-items:center; justify-content:center; padding:24px;}
  .modal-scrim.show{opacity:1; visibility:visible;}
  .modal-card{width:100%; max-width:340px; border-radius:24px; padding:22px; background:var(--bg-elevated); box-shadow:0 20px 60px rgba(0,0,0,0.25); transform:scale(.92) translateY(10px); transition:transform .3s var(--spring);}
  .modal-scrim.show .modal-card{transform:scale(1) translateY(0);}
  .modal-title{font-family:"Source Serif 4", Georgia, serif; font-size:18px; font-weight:600; margin:0 0 6px;}
  .modal-msg{font-size:14px; color:var(--ink-soft); line-height:1.5; margin:0 0 14px;}
  .modal-input{width:100%; border:none; background:rgba(var(--neutral-rgb),0.12); border-radius:14px; padding:12px 14px; font-size:15px; color:var(--ink); font-family:inherit; margin-bottom:16px; outline:none;}
  .modal-actions{display:flex; gap:10px;}
  .modal-btn{flex:1; padding:12px; border-radius:14px; border:none; font-size:14.5px; font-weight:600; cursor:pointer; font-family:inherit;}
  .modal-btn.cancel{background:rgba(var(--neutral-rgb),0.12); color:var(--ink);}
  .modal-btn.primary{background:var(--ink); color:var(--bg);}
  .modal-btn.danger{background:#C0503A; color:#fff;}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); z-index:90; background:var(--ink); color:var(--bg); padding:12px 20px; border-radius:16px; font-size:14px; opacity:0; visibility:hidden; transition:opacity .25s, transform .25s;}
  .toast.show{opacity:1; visibility:visible; transform:translateX(-50%) translateY(0);}

  /* ---------------- Admin panel ---------------- */
  .admin-screen{position:fixed; inset:0; z-index:60; background:var(--bg); display:flex; flex-direction:column; opacity:0; visibility:hidden; transform:translateY(14px); transition:opacity .32s var(--ease), transform .32s var(--ease), visibility .32s;}
  .admin-screen.open{opacity:1; visibility:visible; transform:translateY(0);}
  .admin-top{display:flex; align-items:center; gap:12px; padding:calc(env(safe-area-inset-top,10px) + 10px) 16px 14px;}
  .admin-top h2{font-size:17px; font-weight:600; font-family:"Source Serif 4", Georgia, serif; margin:0;}
  .admin-tabs{display:flex; gap:6px; padding:0 16px 14px;}
  .admin-tab{padding:8px 14px; border-radius:14px; font-size:13.5px; color:var(--ink-soft); cursor:pointer; background:var(--bg-elevated);}
  .admin-tab.active{background:var(--ink); color:var(--bg); font-weight:600;}
  .admin-body{flex:1; overflow-y:auto; padding:0 16px 24px; transition:opacity .28s var(--ease), transform .28s var(--ease);}
  .admin-body.switching{opacity:0; transform:translateY(6px);}
  .a-stat-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:18px;}
  .a-stat-box{background:var(--bg-elevated); border-radius:16px; padding:14px 10px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,0.05);}
  .a-stat-num{font-size:20px; font-weight:700; font-family:"Source Serif 4", Georgia, serif;}
  .a-stat-lbl{font-size:11px; color:var(--ink-faint); margin-top:2px;}
  .a-section-title{font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.3px; padding:10px 4px 8px;}
  .a-card{background:var(--bg-elevated); border-radius:18px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.05);}
  .a-row{display:flex; align-items:center; gap:12px; padding:13px 14px; border-bottom:1px solid var(--border); cursor:pointer;}
  .a-row:last-child{border-bottom:none;}
  .a-row:hover{background:rgba(var(--neutral-rgb),0.06);}
  .a-avatar{width:34px; height:34px; border-radius:50%; background:var(--bubble-user); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; flex-shrink:0;}
  .a-info{flex:1; min-width:0;}
  .a-name{font-size:14px; font-weight:500;}
  .a-meta{margin-top:2px;}
  .a-badge{font-size:11px; padding:2px 8px; border-radius:8px; font-weight:600;}
  .a-badge.approved{background:rgba(76,140,74,0.16); color:#5CA45A;}
  .a-badge.pending{background:rgba(232,176,75,0.20); color:#D9A23E;}
  .a-badge.rejected{background:rgba(180,68,46,0.15); color:#C25B44;}
  .a-req{font-size:13px; color:var(--ink-faint); flex-shrink:0;}
  .a-req b{color:var(--ink); font-weight:600;}
  .a-actions{display:flex; gap:6px; flex-shrink:0;}
  .a-btn{border:none; border-radius:10px; padding:6px 10px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;}
  .a-btn.approve{background:rgba(76,140,74,0.16); color:#5CA45A;}
  .a-btn.reject{background:rgba(180,68,46,0.15); color:#C25B44;}
  .a-model-row{display:flex; align-items:center; gap:10px; padding:9px 2px;}
  .a-model-name{width:130px; font-size:13px; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

<script nonce="__CSP_NONCE__">
  /* ================= GLOBALS & AUTH ================= */
  let accessGranted = false;
  let isAdmin = false;
  // 'tg' — Telegram Mini App; 'web' — обычный сайт с HttpOnly-cookie.
  let AUTH_MODE = 'tg';
  const LEGACY_WEB_TOKEN_KEY = 'assistant_web_token';
  // Удаляем токен старой версии: новая сессия недоступна JavaScript.
  try{ localStorage.removeItem(LEGACY_WEB_TOKEN_KEY); }catch(e){}

  // В обычном мобильном браузере 100vh может включать адресную и нижнюю
  // панели. Из-за этого композер оказывается ниже реально видимой области.
  // visualViewport даёт фактическую высоту окна и также держит поле ввода
  // над экранной клавиатурой. CSS с 100dvh остаётся безопасным fallback.
  let appViewportRaf = 0;
  function syncAppViewportHeight(){
    cancelAnimationFrame(appViewportRaf);
    appViewportRaf = requestAnimationFrame(() => {
      const viewport = window.visualViewport;
      const height = viewport?.height || window.innerHeight || document.documentElement.clientHeight;
      if(height > 0){
        document.documentElement.style.setProperty('--app-height', Math.round(height) + 'px');
      }
    });
  }
  syncAppViewportHeight();
  window.addEventListener('resize', syncAppViewportHeight, {passive:true});
  window.addEventListener('orientationchange', syncAppViewportHeight, {passive:true});
  window.visualViewport?.addEventListener('resize', syncAppViewportHeight, {passive:true});
  window.visualViewport?.addEventListener('scroll', syncAppViewportHeight, {passive:true});

  function authHeaderValue(){
    if(AUTH_MODE === 'web') return '';
    const initData = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp.initData : '';
    return 'tma ' + initData;
  }

  function apiHeaders(withJson = false){
    const headers = {};
    const auth = authHeaderValue();
    if(auth) headers.Authorization = auth;
    if(withJson) headers['Content-Type'] = 'application/json';
    return headers;
  }

  let serverCapabilities = {
    ai: false,
    file_uploads: false,
    image_uploads: false
  };

  function finishAuthBootstrap(){
    document.getElementById('auth-bootstrap')?.remove();
    document.body.classList.remove('auth-pending');
  }

  function grantAccess(isAdminFlag, capabilities){
    accessGranted = true;
    isAdmin = !!isAdminFlag;
    if(capabilities && typeof capabilities === 'object'){
      serverCapabilities = {
        ai: capabilities.ai === true,
        file_uploads: capabilities.file_uploads === true,
        image_uploads: capabilities.image_uploads === true
      };
    }
    if(isAdmin) document.getElementById('adminPanelBlock').style.display = 'block';
    const logoutRow = document.getElementById('webLogoutRow');
    if(logoutRow) logoutRow.style.display = (AUTH_MODE === 'web') ? 'flex' : 'none';
    hideLoginScreen();
    document.getElementById('access-overlay')?.remove();
    const taEl = document.getElementById('ta');
    if(taEl) taEl.disabled = !serverCapabilities.ai;
    const attachEl = document.getElementById('attachBtn');
    if(attachEl){
      attachEl.disabled = !serverCapabilities.ai || (
        !serverCapabilities.file_uploads &&
        !serverCapabilities.image_uploads
      );
    }
    if(!serverCapabilities.ai){
      showToast('AI-функции временно отключены');
    }
    if(typeof toggleSend === 'function') toggleSend();
    finishAuthBootstrap();
  }

  (function initAccess(){
    try{
      if(window.Telegram&&window.Telegram.WebApp){
        const tg=window.Telegram.WebApp;
        tg.ready();
        tg.expand();
      }
    }catch(e){}

    const tgInitData=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp.initData:'';

    if(tgInitData){
      // Открыто внутри Telegram — используем подписанную initData как раньше.
      AUTH_MODE='tg';
      fetch('/api/me',{headers:{'Authorization':'tma '+tgInitData}})
        .then(r=>{if(!r.ok)return r.json().then(d=>{throw d;}).catch(()=>{throw {message:'Нет доступа.'};});return r.json();})
        .then(data=>{
          if(data&&data.ok===true){
            grantAccess(data.is_admin, data.capabilities);
          }else{
            showAccessDenied((data&&data.message)||'Нет доступа. Откройте бота в Telegram и отправьте /start.');
          }
        })
        .catch(err=>showAccessDenied((err&&err.message)||'Нет доступа. Откройте бота в Telegram и отправьте /start.'));
      return;
    }

    // Открыто как обычный сайт вне Telegram — вход по одноразовому коду из бота.
    AUTH_MODE='web';
    const taEl0 = document.getElementById('ta');
    const sendBtnEl0 = document.getElementById('send-btn');
    if(taEl0) taEl0.disabled=true;
    if(sendBtnEl0) sendBtnEl0.disabled=true;

    fetch('/api/me',{headers:apiHeaders()})
      .then(r=>{if(!r.ok) throw new Error('expired'); return r.json();})
      .then(data=>{
        if(data&&data.ok===true) grantAccess(data.is_admin, data.capabilities);
        else showLoginScreen();
      })
      .catch(()=>showLoginScreen());
  })();

  async function logoutWeb(){
    try{ await fetch('/api/auth/logout',{method:'POST',headers:apiHeaders()}); }catch(e){}
    accessGranted=false;
    isAdmin=false;
    document.getElementById('closeAdmin')?.click();
    document.getElementById('closeProfile')?.click();
    showLoginScreen();
  }

  function showAccessDenied(message){
    accessGranted=false;
    const taEl = document.getElementById('ta');
    const sendBtnEl = document.getElementById('send-btn');
    if(taEl) taEl.disabled=true;
    if(sendBtnEl) sendBtnEl.disabled=true;
    if(document.getElementById('access-overlay')){
      finishAuthBootstrap();
      return;
    }
    const overlay=document.createElement('div');
    overlay.id='access-overlay';
    overlay.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:32px;text-align:center;background:var(--bg);color:var(--ink)';
    overlay.innerHTML=`<div style="font-size:40px;">🚫</div><div style="font-size:18px;font-weight:600;">Доступ закрыт</div><div style="font-size:14px;color:var(--ink-soft);line-height:1.6;max-width:270px;">${x(message)}</div>`;
    document.body.appendChild(overlay);
    finishAuthBootstrap();
  }

  function showLoginScreen(errorMsg){
    accessGranted=false;
    const taEl = document.getElementById('ta');
    const sendBtnEl = document.getElementById('send-btn');
    if(taEl) taEl.disabled=true;
    if(sendBtnEl) sendBtnEl.disabled=true;
    let overlay=document.getElementById('login-overlay');
    if(overlay){
      const err=overlay.querySelector('#loginErr');
      if(err) err.textContent=errorMsg||'';
      finishAuthBootstrap();
      overlay.querySelector('#loginCodeInput')?.focus();
      return;
    }
    overlay=document.createElement('div');
    overlay.id='login-overlay';
    overlay.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center;background:var(--bg);color:var(--ink)';
    overlay.innerHTML=`
      <div style="font-size:36px;">🔐</div>
      <div style="font-size:18px;font-weight:600;">Вход по коду</div>
      <div style="font-size:14px;color:var(--ink-soft);line-height:1.6;max-width:280px;">Откройте бота в Telegram, отправьте команду <b>/code</b> и введите полученный код здесь.</div>
      <input id="loginCodeInput" maxlength="10" autocomplete="one-time-code" placeholder="XXXXXXXXXX"
        style="text-align:center;letter-spacing:4px;font-size:20px;font-weight:600;text-transform:uppercase;padding:12px 16px;border-radius:14px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--ink);width:250px;outline:none;">
      <div id="loginErr" style="font-size:13px;color:#E0524D;min-height:16px;">${errorMsg?x(errorMsg):''}</div>
      <button id="loginSubmitBtn" style="padding:11px 26px;border-radius:20px;border:none;background:var(--coral);color:var(--bg);font-size:14.5px;font-weight:600;cursor:pointer;">Войти</button>
    `;
    document.body.appendChild(overlay);
    finishAuthBootstrap();

    const input=overlay.querySelector('#loginCodeInput');
    const btn=overlay.querySelector('#loginSubmitBtn');
    const doSubmit=()=>submitLoginCode(input.value);
    btn.addEventListener('click', doSubmit);
    input.addEventListener('input',()=>{ input.value=input.value.toUpperCase().replace(/[^A-Z0-9]/g,''); });
    input.addEventListener('keydown',e=>{ if(e.key==='Enter') doSubmit(); });
    input.focus();
  }

  function hideLoginScreen(){
    document.getElementById('login-overlay')?.remove();
  }

  async function submitLoginCode(rawCode){
    const code=(rawCode||'').trim().toUpperCase();
    const btn=document.getElementById('loginSubmitBtn');
    const err=document.getElementById('loginErr');
    if(!code){ if(err) err.textContent='Введите код.'; return; }
    if(btn){ btn.disabled=true; btn.textContent='Проверяю…'; }
    try{
      const r=await fetch('/api/auth/code',{
        method:'POST',
        headers:apiHeaders(true),
        body:JSON.stringify({code})
      });
      const data=await r.json().catch(()=>({}));
      if(r.ok&&data.ok){
        grantAccess(data.is_admin, data.capabilities);
      }else{
        if(err) err.textContent=data.message||'Неверный код.';
      }
    }catch(e){
      if(err) err.textContent='Сетевая ошибка. Попробуйте ещё раз.';
    }finally{
      if(btn){ btn.disabled=false; btn.textContent='Войти'; }
    }
  }

  function x(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>');}

  /* ================= MARKDOWN & LATEX ENGINE ================= */
  function formatMathLaTeX(text) {
    if (!text) return '';
    let res = text;
    res = res.replace(/\\begin\{pmatrix\}([\s\S]*?)\\end\{pmatrix\}/g, (match, contents) => {
      const rows = contents.trim().split(/\\\\|\\/);
      const tableRows = rows.map(row => {
        if (!row.trim()) return '';
        const cells = row.split('&');
        const tableCells = cells.map(cell => `<td style="padding: 4px 12px; text-align: center;">${cell.trim()}</td>`).join('');
        return `<tr>${tableCells}</tr>`;
      }).join('');
      return `<table style="border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); border-radius: 6px; margin: 10px auto; font-family: inherit; font-size: 16px;">${tableRows}</table>`;
    });
    res = res.replace(/\$\$\s*([\s\S]*?)\s*\$\$/g, '<div class="formula-block">$1</div>');
    res = res.replace(/\$\$\s*([\s\S]*)$/g, (match, contents) => {
      if (contents.includes('$$')) return match; 
      return '<div class="formula-block">' + contents + '</div>';
    });
    res = res.replace(/\\\[\s*([\s\S]*?)\s*\\\]/g, '<div class="formula-block">$1</div>');
    res = res.replace(/\$([^$]+)\$/g, '<span class="formula-inline">$1</span>');
    res = res.replace(/\\\(\s*([\s\S]*?)\s*\\\)/g, '<span class="formula-inline">$1</span>');
    while (res.includes('\\frac')) {
      let nextFrac = res.replace(/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g, '($1/$2)');
      if (nextFrac === res) break;
      res = nextFrac;
    }
    res = res.replace(/\\int/g, '∫');
    res = res.replace(/_\{([^{}]+)\}\^\{([^{}]+)\}/g, '<sub>$1</sub><sup>$2</sup>');

  function mdEscapeHtml(value) {

  function normalizeCodeLang(lang) {

  function highlightCode(code, lang) {

        if (key) return token('attr', key);
        if (str) return token('string', str);
        if (kw) return token('keyword', kw);
        if (num) return token('number', num);
        return token('punctuation', punc);

    if (l === 'html') {
      return code.replace(/(&lt;!--[\s\S]*?--&gt;)|(&lt;\/?[a-zA-Z][\w:-]*)([\s\S]*?)(&gt;)/g, (m, comment, tag, attrs, close) => {

          .replace(/([\w:-]+)(=)'([^']*)'/g, (_, name, eq, value) => `${token('attr', name)}${token('operator', eq)}${token('value', "'" + value + "'")}`);

    const keywords = l === 'python'
      ? 'and|as|assert|async|await|break|class|continue|def|del|elif|else|except|False|finally|for|from|global|if|import|in|is|lambda|None|nonlocal|not|or|pass|raise|return|True|try|while|with|yield|print|self'
      : l === 'bash'
        ? 'if|then|else|elif|fi|for|while|do|done|case|esac|function|in|echo|exit|export|local|read|return|sudo|apt|npm|pnpm|yarn|git|cd|ls|cat|grep'
        : 'break|case|catch|class|const|continue|debugger|default|delete|do|else|export|extends|finally|for|from|function|if|import|in|instanceof|let|new|null|return|super|switch|this|throw|try|typeof|undefined|var|void|while|with|yield|async|await|true|false|interface|type|implements|public|private|protected|readonly';
    const genericPattern = '(\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*|#[^\\n]*)|("(?:\\\\.|[^"\\\\])*"|\'(?:\\\\.|[^\'\\\\])*\'|`(?:\\\\.|[^`\\\\])*`)|(\\b(?:' + keywords + ')\\b)|(\\b\\d+(?:\\.\\d+)?\\b)|([a-zA-Z_$][\\w$]*(?=\\s*\\())|([+\\-*/%=!<>|&^~?:;,.()[\\]{}])';

  function createCodeBlock(code, lang) {
    const safeLang = normalizeCodeLang(lang);

  function extractFencedCodeBlocks(text, codeBlocks) {
    const lines = text.split('\n');
    const out = [];
    for (let i = 0; i < lines.length; i++) {
      const start = lines[i].match(/^(\s*(?:&gt;\s*)*)```([a-zA-Z0-9_+\-.]*)[^`]*$/);
      if (!start) {
        out.push(lines[i]);
        continue;
      }
      const quotePrefix = start[1] || '';
      const lang = start[2] || '';
      const original = [lines[i]];
      const code = [];
      let closed = false;
      let j = i + 1;
      for (; j < lines.length; j++) {
        original.push(lines[j]);
        let line = lines[j];
        if (quotePrefix && line.startsWith(quotePrefix)) line = line.slice(quotePrefix.length);
        if (/^```\s*$/.test(line.trim())) {
          closed = true;
          break;
        }
        code.push(line);
      }
      if (!closed) {
        out.push(...original);
        i = j - 1;
        continue;
      }
      if (normalizeCodeLang(lang) === 'markdown') {
        let markdownLines = code.slice();
        while (markdownLines.length && !markdownLines[0].trim()) markdownLines.shift();
        if (closed) {
          while (markdownLines.length && !markdownLines[markdownLines.length - 1].trim()) markdownLines.pop();
        }
        markdownLines = markdownLines.filter(line => line.trim());
        if (quotePrefix) out.push(...markdownLines.map(line => quotePrefix + line));
        else out.push(...markdownLines);
        i = closed ? j : j - 1;
        continue;
      }
      const id = `@@BLOCKCODE${codeBlocks.length}@@`;
      codeBlocks.push(createCodeBlock(code.join('\n'), lang));
      out.push(quotePrefix + id);
      i = closed ? j : j - 1;
    }
    return out.join('\n');

  function restoreSafeTableHtml(html) {
    return html.replace(/&lt;(\/?)(table|thead|tbody|tfoot|tr|th|td|caption)([^&]*)&gt;/gi, (match, closing, tag, attrs) => {
      tag = tag.toLowerCase();
      if (closing) return `</${tag}>`;
      let safeAttrs = tag === 'table' ? ' class="markdown-table"' : '';
      String(attrs || '').replace(/\s(colspan|rowspan|align)\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"']+))/gi, (_, name, dValue, sValue, bareValue) => {
        const raw = dValue || sValue || bareValue || '';
        if (/^(colspan|rowspan)$/i.test(name)) {
          const n = Math.max(1, Math.min(20, parseInt(raw, 10) || 1));
          safeAttrs += ` ${name.toLowerCase()}="${n}"`;
        } else {
          const align = String(raw).toLowerCase();
          if (/^(left|center|right)$/.test(align)) safeAttrs += ` align="${align}"`;
        }
        return '';
      });
      return `<${tag}${safeAttrs}>`;
    });
  }

  function replaceEmoji(text) {
    const map = {
      smile:'😄', grin:'😁', joy:'😂', laughing:'😆', wink:'😉', blush:'😊', relaxed:'☺️', heart_eyes:'😍', kiss:'😘', thinking:'🤔', neutral_face:'😐', expressionless:'😑', smirk:'😏', unamused:'😒', sweat_smile:'😅', cry:'😢', sob:'😭', angry:'😠', rage:'😡', thumbs_up:'👍', '+1':'👍', thumbs_down:'👎', '-1':'👎', ok_hand:'👌', clap:'👏', pray:'🙏', muscle:'💪', fire:'🔥', star:'⭐', sparkles:'✨', warning:'⚠️', check:'✅', x:'❌', heart:'❤️', broken_heart:'💔', rocket:'🚀', tada:'🎉', white_check_mark:'✅', heavy_check_mark:'✔️'
    };
    text = text.replace(/:([a-zA-Z0-9_+\-]+):/g, (m, name) => map[name] || m);

      ':-)':'🙂', ':)':'🙂', '=)':'🙂', ';-)':'😉', ';)':'😉', ':-D':'😄', ':D':'😄', ':-(':'☹️', ':(':'☹️', ":'(":'😢', ':-P':'😛', ':P':'😛', '<3':'❤️'

  function sanitizeMarkdownUrl(url) {
    const raw = String(url || '').trim().replace(/&amp;/g, '&');

    if (/^(https?:\/\/|mailto:|tg:\/\/|\/(?!\/)|#)/i.test(raw)) return mdEscapeAttr(raw);

  function sanitizeMarkdownImageUrl(url) {
    const raw = String(url || '').trim().replace(/&amp;/g, '&');

    // tracking-pixel и утечку IP/referrer из ответа модели.

  function formatInlineMarkdown(text) {

      return `<a href="${sanitizeMarkdownUrl(url)}" target="_blank" rel="noopener noreferrer" class="markdown-link">🖼 ${alt || 'Изображение'}</a>`;
    });
    html = html.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (m, label, url) => `<a href="${sanitizeMarkdownUrl(url)}" target="_blank" rel="noopener noreferrer" class="markdown-link">${label}</a>`);

    html = html.replace(/\*\*\*([\s\S]+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    html = html.replace(/___([\s\S]+?)___/g, '<strong><em>$1</em></strong>');
    html = html.replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/__([\s\S]+?)__/g, '<strong>$1</strong>');

  function splitMarkdownTableRow(line) {
    let value = String(line || '').trim();
    if (value.startsWith('|')) value = value.slice(1);
    if (value.endsWith('|')) value = value.slice(0, -1);
    const cells = [];
    let cur = '';
    for (let i = 0; i < value.length; i++) {
      if (value[i] === '\\' && value[i + 1] === '|') {
        cur += '|';
        i++;
      } else if (value[i] === '|') {
        cells.push(cur.trim());
        cur = '';
      } else {
        cur += value[i];
      }
    }
    cells.push(cur.trim());
    return cells;
  }

  function isMarkdownTableSeparator(line) {
    const cells = splitMarkdownTableRow(line);
    return cells.length > 1 && cells.every(cell => /^:?-{3,}:?$/.test(cell.trim()));
  }

  function tableAlignFromSeparator(cell) {
    const value = String(cell || '').trim();
    if (value.startsWith(':') && value.endsWith(':')) return 'center';
    if (value.endsWith(':')) return 'right';
    if (value.startsWith(':')) return 'left';
    return '';
  }

  function tableCellAttrs(content, align) {
    let text = String(content || '').trim();
    let attrs = '';
    const spec = text.match(/\s*\{:?\s*([^}]*(?:colspan|rowspan|align)[^}]*)\}\s*$/i);
    if (spec) {
      text = text.slice(0, spec.index).trim();
      spec[1].replace(/(colspan|rowspan|align)\s*=\s*["']?([^"'\s]+)["']?/gi, (_, name, raw) => {
        if (/^(colspan|rowspan)$/i.test(name)) {
          const n = Math.max(1, Math.min(20, parseInt(raw, 10) || 1));
          attrs += ` ${name.toLowerCase()}="${n}"`;
        } else {
          const a = String(raw).toLowerCase();
          if (/^(left|center|right)$/.test(a)) align = a;
        }
        return '';
      });

    if (align) attrs += ` style="text-align:${align}"`;
    return { text, attrs };

  function renderMarkdownTable(lines) {
    const header = splitMarkdownTableRow(lines[0]);

    const body = lines.slice(2).map(splitMarkdownTableRow);
    const headHtml = header.map((cell, idx) => {
      const data = tableCellAttrs(cell, aligns[idx] || '');
      return `<th${data.attrs}>${formatInlineMarkdown(data.text)}</th>`;
    }).join('');
    const bodyHtml = body.map(row => `<tr>${row.map((cell, idx) => {
      const data = tableCellAttrs(cell, aligns[idx] || '');
      return `<td${data.attrs}>${formatInlineMarkdown(data.text)}</td>`;

  function isListLine(line) {

  }

  function renderListBlock(lines) {
    let out = '';
    const stack = [];
    const closeList = () => {
      const top = stack.pop();
      if (!top) return;
      if (top.liOpen) out += '</li>';
      out += `</${top.type}>`;
    };

    for (const line of lines) {
      const m = String(line).match(/^(\s*)([-*+]|\d+[.)])\s+([\s\S]*)$/);
      if (!m) continue;
      const indent = m[1].replace(/\t/g, '    ').length;
      const type = /^\d/.test(m[2]) ? 'ol' : 'ul';
      let content = m[3] || '';
      const task = content.match(/^\[([ xX])\]\s+([\s\S]*)$/);
      let liClass = '';
      let checkbox = '';
      if (task) {
        const checked = task[1].toLowerCase() === 'x';
        content = task[2];
        liClass = ' class="task-list-item"';
        checkbox = `<input type="checkbox" disabled${checked ? ' checked' : ''}>`;
      }

      while (stack.length && indent < stack[stack.length - 1].indent) closeList();

      if (!stack.length || indent > stack[stack.length - 1].indent) {
        out += `<${type}>`;
        stack.push({ indent, type, liOpen: false });
      } else if (indent === stack[stack.length - 1].indent && type !== stack[stack.length - 1].type) {
        closeList();
        out += `<${type}>`;
        stack.push({ indent, type, liOpen: false });
      }

      const top = stack[stack.length - 1];
      if (top.liOpen) out += '</li>';
      out += `<li${liClass}>${checkbox}${formatInlineMarkdown(content)}`;
      top.liOpen = true;
    }

    while (stack.length) closeList();
    return out;

  function isBlockquoteLine(line) {

  function renderMarkdownBlocks(text) {
    const lines = String(text || '').split('\n');
    const out = [];
    let paragraph = [];
    const flushParagraph = () => {
      if (!paragraph.length) return;
      out.push(paragraph.map(formatInlineMarkdown).join('<br>'));
      paragraph = [];
    };

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const trimmed = line.trim();

      if (!trimmed) {
        flushParagraph();
        continue;
      }

      const heading = trimmed.match(/^(#{1,3})\s+([\s\S]+)$/);
      if (heading) {
        flushParagraph();
        const level = heading[1].length;
        out.push(`<h${level}>${formatInlineMarkdown(heading[2])}</h${level}>`);
        continue;
      }

      if (/^(?:-{3,}|\*{3,}|_{3,})$/.test(trimmed)) {
        flushParagraph();
        out.push('<hr>');
        continue;
      }

      if (isRawHtmlBlockLine(line)) {
        flushParagraph();
        const block = [line];
        if (/^<table/i.test(trimmed)) {
          while (i + 1 < lines.length && !/<\/table>/i.test(lines[i])) block.push(lines[++i]);
        }
        out.push(block.join(''));
        continue;
      }

      if (i + 1 < lines.length && /\|/.test(line) && isMarkdownTableSeparator(lines[i + 1])) {
        flushParagraph();
        const tableLines = [line, lines[i + 1]];
        i += 2;
        while (i < lines.length && /\|/.test(lines[i]) && lines[i].trim()) {
          tableLines.push(lines[i]);
          i++;
        }
        i--;
        out.push(renderMarkdownTable(tableLines));
        continue;
      }

      if (isBlockquoteLine(line)) {
        flushParagraph();
        const quoteLines = [];
        while (i < lines.length && isBlockquoteLine(lines[i])) {
          quoteLines.push(stripBlockquoteMarker(lines[i]));
          i++;
        }
        i--;
        out.push(`<blockquote>${renderMarkdownBlocks(quoteLines.join('\n'))}</blockquote>`);
        continue;
      }

      if (isListLine(line)) {
        flushParagraph();
        const listLines = [];
        while (i < lines.length) {
          if (isListLine(lines[i])) {
            listLines.push(lines[i]);
            i++;
            continue;
          }
          if (!String(lines[i] || '').trim()) {
            let next = i + 1;
            while (next < lines.length && !String(lines[next] || '').trim()) next++;
            if (next < lines.length && isListLine(lines[next])) {
              i = next;
              continue;
            }
          }
          break;
        }
        i--;
        out.push(renderListBlock(listLines));
        continue;
      }

      paragraph.push(line);
    }

    flushParagraph();
    return out.join('');
  }

  function md(str) {
    if (!str) return '';
    let html = mdEscapeHtml(str);

    const codeBlocks = [];
    for (let pass = 0; pass < 3; pass++) {
      const next = extractFencedCodeBlocks(html, codeBlocks);
      if (next === html) break;
      html = next;
    }

    const inlineCodes = [];
    html = html.replace(/`([^`\n]+)`/g, (match, code) => {
      const id = `@@INLINECODE${inlineCodes.length}@@`;
      inlineCodes.push(`<code>${code}</code>`);
      return id;
    });

    html = restoreSafeTableHtml(html);
    html = formatMathLaTeX(html);
    html = renderMarkdownBlocks(html);

    for (let idx = 0; idx < inlineCodes.length; idx++) {
      html = html.replaceAll(`@@INLINECODE${idx}@@`, inlineCodes[idx]);
    }

    for (let idx = 0; idx < codeBlocks.length; idx++) {
      html = html.replaceAll(`@@BLOCKCODE${idx}@@`, codeBlocks[idx]);
    }

    return html;
  }

  /* ================= Custom modal / toast ================= */

      </div>`;
    modalScrim.classList.add('show');
    document.getElementById('modalConfirm').onclick = () => { closeModal(); onConfirm(); };
    document.getElementById('modalCancel').onclick = closeModal;
  }

  let toastTimer = null;
  function showToast(text){
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);

  /* ================= Chat store ================= */
  const CHATS_KEY = 'oracle_chats_v3_session';
  const ACTIVE_KEY = 'oracle_active_chat_v3_session';
  const CHAT_TTL_MS = 24 * 60 * 60 * 1000;
  const MAX_STORED_CHATS = 50;
  const MAX_CLIENT_HISTORY_ITEMS = 40;
  const MAX_CLIENT_HISTORY_ITEM_CHARS = 10000;
  const MAX_CLIENT_HISTORY_TOTAL_CHARS = 10000;
  const chatStore = sessionStorage;
  // Не оставляем переписку и вложения старой версии в постоянном хранилище.
  try{
    localStorage.removeItem('oracle_chats_v2');
    localStorage.removeItem('oracle_active_chat_v2');
  }catch(e){}
  
  let chats = {};
  let chatOrder = [];
  let currentChatId = null;
  let incognitoChat = null;

  function isSafeChatId(value){
    return typeof value === 'string' && /^c\d{10,16}$/.test(value);
  }

  function sanitizeClientHistory(value){
    if(!Array.isArray(value)) return [];
    const result = [];
    let total = 0;
    const source = value.slice(-MAX_CLIENT_HISTORY_ITEMS);
    for(let i=source.length-1; i>=0; i--){
      const item = source[i];
      if(!item || typeof item !== 'object' || Array.isArray(item)) continue;
      if(item.role !== 'user' && item.role !== 'assistant') continue;
      if(typeof item.content !== 'string') continue;
      const remaining = MAX_CLIENT_HISTORY_TOTAL_CHARS - total;
      if(remaining <= 0) break;
      const content = item.content.slice(
        0,
        Math.min(MAX_CLIENT_HISTORY_ITEM_CHARS, remaining)
      );
      result.unshift({role:item.role, content});
      total += content.length;
    }
    return result;
  }

  function sanitizeStoredChat(value){
    if(!value || typeof value !== 'object' || Array.isArray(value)) return null;
    const history = sanitizeClientHistory(value.history);
    if(!history.length) return null;
    const now = Date.now();
    const createdRaw = Number(value.created);
    const updatedRaw = Number(value.updated);
    const created = Number.isFinite(createdRaw)
      ? Math.max(0, Math.min(now, createdRaw))
      : now;
    const updated = Number.isFinite(updatedRaw)
      ? Math.max(created, Math.min(now, updatedRaw))
      : created;
    return {
      title: typeof value.title === 'string'
        ? (value.title.slice(0, 100) || 'Новый разговор')
        : 'Новый разговор',
      history,
      created,
      updated,
    };
  }

  function loadChats(){
    try{
      const s = chatStore.getItem(CHATS_KEY);
      if(s){
        const parsed = JSON.parse(s);
        if(!parsed || typeof parsed !== 'object' || Array.isArray(parsed)){
          throw new Error('invalid chat storage');
        }
        const storedChats = (
          parsed.chats
          && typeof parsed.chats === 'object'
          && !Array.isArray(parsed.chats)
        ) ? parsed.chats : {};
        chats = {};
        chatOrder = [];
        const seen = new Set();
        const storedOrder = Array.isArray(parsed.order) ? parsed.order : [];
        for(const id of storedOrder.slice(0, MAX_STORED_CHATS)){
          if(!isSafeChatId(id) || seen.has(id)) continue;
          const chat = sanitizeStoredChat(storedChats[id]);
          if(!chat) continue;
          seen.add(id);
          chats[id] = chat;
          chatOrder.push(id);
        }
        saveChats();
      }
    }catch(e){
      chats = {};
      chatOrder = [];
      try{
        chatStore.removeItem(CHATS_KEY);
        chatStore.removeItem(ACTIVE_KEY);
      }catch(ignore){}
    }
  }
  function saveChats(){
    try{
      const persistentChats = {};
      const persistentOrder = [];
      for(const id of chatOrder){
        const chat = chats[id];
        if(!chat || !(chat.history || []).length) continue;
        const {draft, ...persistentChat} = chat;
        // Текст доступен после перезагрузки вкладки, но содержимое файлов и
        // base64-картинок не копируется даже в sessionStorage.
        persistentChats[id] = {
          ...persistentChat,
          history: sanitizeClientHistory(
            (persistentChat.history || []).map(item => {
              if(item.is_file) return {role:'assistant', content:'[Файл был доступен до перезагрузки вкладки]'};
              if(item.is_image) return {role:'assistant', content:'[Изображение было доступно до перезагрузки вкладки]'};
              return {role:item.role, content:item.content};
            })
          )
        };
        persistentOrder.push(id);
      }
      chatStore.setItem(CHATS_KEY, JSON.stringify({chats:persistentChats, order:persistentOrder}));
    }catch(e){}
  }
  function pruneOldChats(){
    const now = Date.now();
    let changed = false;
    for(const id of Object.keys(chats)){
      const c = chats[id];
      const t = c.updated || c.created || 0;
      if((now - t) > CHAT_TTL_MS){
        delete chats[id];
        chatOrder = chatOrder.filter(x => x !== id);
        changed = true;
      }
    }
    if(changed){
      saveChats();
      if(currentChatId && !chats[currentChatId]){
        currentChatId = null;
        try{chatStore.removeItem(ACTIVE_KEY);}catch(e){}
      }
    }
  }

  function saveActiveChat(){
    if(!currentChatId || currentChatId === 'incognito') return;
    const ch = chats[currentChatId];
    if(!ch) return;
    ch.updated = Date.now();
    saveChats();
    if((ch.history || []).length){
      try{chatStore.setItem(ACTIVE_KEY, currentChatId);}catch(e){}
    }
  }

  function activeChat(){ return currentChatId === 'incognito' ? incognitoChat : chats[currentChatId]; }
  function activeHistory(){
    const ch = activeChat();
    return ch ? ch.history || [] : [];
  }

  function captureActiveDraft(){
    if(!currentChatId || currentChatId === 'incognito') return;
    const chat = chats[currentChatId];
    const input = document.getElementById('ta');
    if(chat && input) chat.draft = input.value;
  }

  function discardUnusedChat(id){
    const chat = chats[id];
    if(!chat || (chat.history || []).length || (chat.draft || '').trim()) return;
    delete chats[id];
    chatOrder = chatOrder.filter(chatId => chatId !== id);
  }

  function rememberAndReleaseCurrentChat(){
    if(!currentChatId || currentChatId === 'incognito') return;
    const previousId = currentChatId;
    captureActiveDraft();
    discardUnusedChat(previousId);
  }

  function restoreActiveDraft(){
    const input = document.getElementById('ta');
    if(!input) return;
    const chat = activeChat();
    input.value = currentChatId === 'incognito' ? '' : ((chat && chat.draft) || '');
    resize(input);
    toggleSend();
    setComposerExpanded(document.activeElement === input || !!input.value.trim(), true);
  }

  function renderSidebar(){
    const q = (document.getElementById('searchInput').value || '').toLowerCase();
    const mount = document.getElementById('sideListMount');
    
    const now = new Date();
    const todayStr = now.toDateString();
    
    let today = [];
    let earlier = [];
    
    chatOrder.forEach(id => {
      const c = chats[id];
      if(!c) return;
      if(!c.title.toLowerCase().includes(q)) return;
      
      const updatedDate = new Date(c.updated || c.created || Date.now());
      if(updatedDate.toDateString() === todayStr) today.push(id);
      else earlier.push(id);
    });

    function group(label, list){
      if(!list.length) return '';
      return `<div class="side-label">${label}</div>` + list.map(id => `
        <div class="side-item${id===currentChatId?' active':''}" data-id="${mdEscapeAttr(id)}">
          <span class="t">${x(chats[id].title)}</span>
        </div>`).join('');
    }
    mount.innerHTML = group('Сегодня', today) + group('Ранее', earlier) || `<div class="side-empty">Ничего не найдено</div>`;

    mount.querySelectorAll('.side-item').forEach(item => {
      const id = item.dataset.id;
      let pressTimer = null, moved = false;
      const startPress = () => { moved = false; clearTimeout(pressTimer);
        pressTimer = setTimeout(() => {
          if(moved) return;
          showSideDeletePop(item, id);
        }, 450); };
      const cancelPress = () => clearTimeout(pressTimer);
      const onMove = () => { moved = true; clearTimeout(pressTimer); };
      item.addEventListener('touchstart', startPress, {passive:true});
      item.addEventListener('touchend', cancelPress, {passive:true});
      item.addEventListener('touchcancel', cancelPress, {passive:true});
      item.addEventListener('touchmove', onMove, {passive:true});
      item.addEventListener('mousedown', startPress);
      item.addEventListener('mouseup', cancelPress);
      item.addEventListener('mouseleave', cancelPress);
      item.addEventListener('click', () => {
        if(document.getElementById('sideDeletePop').classList.contains('open')) return;
        openChat(id);

  function openChat(id){
    if(!chats[id]) return;
    if(id === currentChatId){ closeSideFn(); return; }
    rememberAndReleaseCurrentChat();
    if(!chats[id]) return;
    resetIncognitoUI();
    currentChatId = id;
    if((chats[id].history || []).length){
      try{chatStore.setItem(ACTIVE_KEY, currentChatId);}catch(e){}

  }

  function requestDeleteChat(id){
    if(!chats[id]) return;
    showConfirmModal('Удалить чат?', `«${chats[id].title}» будет удалён без возможности восстановления.`, () => doDeleteChat(id));
  }

  function doDeleteChat(id){
    delete chats[id];
    chatOrder = chatOrder.filter(x => x !== id);
    saveChats();
    if(currentChatId === id){
      if(chatOrder.length){ 
        currentChatId = chatOrder[0]; 
        if((chats[currentChatId].history || []).length){
          try{chatStore.setItem(ACTIVE_KEY, currentChatId);}catch(e){}

        createChat(); 
        return;
