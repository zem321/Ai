<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0; padding: 10px;
            display: flex; flex-direction: column; height: 100vh; box-sizing: border-box;
        }
        #chat-container {
            flex: 1; overflow-y: auto; margin-bottom: 10px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            padding: 10px; border-radius: 8px;
        }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 80%; word-wrap: break-word; }
        .user { background-color: var(--tg-theme-button-color, #248bca); color: var(--tg-theme-button-text-color, #ffffff); margin-left: auto; }
        .assistant { background-color: var(--tg-theme-secondary-bg-color, #f1f1f1); color: var(--tg-theme-text-color, #000000); }
        .controls { display: flex; flex-direction: column; gap: 5px; }
        .input-row { display: flex; gap: 5px; }
        input[type="text"], select { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #ccc; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
        button { padding: 10px 15px; background-color: var(--tg-theme-button-color, #248bca); color: var(--tg-theme-button-text-color, #ffffff); border: none; border-radius: 5px; cursor: pointer; }
        img { max-width: 100%; border-radius: 5px; margin-top: 5px; }
    </style>
</head>
<body>

<div id="chat-container"></div>

<div class="controls">
    <select id="model-select">
        <option value="gpt-4o">GPT-4o (Текст и Фото)</option>
        <option value="gpt-4o-mini" selected>GPT-4o Mini (Экономный)</option>
        <option value="image-gen">Создание фото (DALL-E-3)</option>
        <option value="image-edit">Редактирование фото (DALL-E-2)</option>
    </select>
    
    <div class="input-row">
        <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFile(this)">
        <button type="button" onclick="document.getElementById('file-input').click()">📷</button>
        <input type="text" id="user-input" placeholder="Введите ваш запрос...">
        <button onclick="sendMessage()">Отправить</button>
    </div>
    
    <div id="preview-container" style="display:none; position:relative; margin-top:5px; width: max-content;">
        <img id="image-preview" style="max-height:80px; width:auto; border: 1px solid #ccc;">
        <button onclick="clearImage()" style="position:absolute; top:0; right:0; padding:2px 6px; background:rgba(255,0,0,0.8); color:white; border-radius:50%; font-size:10px;">X</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Запросы отправляются на ваш относительный Middleware-бэкенд на Railway
    const CHAT_URL = "/api/chat";
    const IMAGE_GEN_URL = "/api/image/gen";
    const IMAGE_EDIT_URL = "/api/image/edit";

    const VISION_MODELS = new Set(["gpt-4o", "gpt-4o-mini"]);
    let messagesHistory = [];
    let currentImageUrl = null;

    function addMsg(role, text, imageUrl = null) {
        const container = document.getElementById('chat-container');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;
        if (text) { const p = document.createElement('p'); p.style.margin = "0"; p.textContent = text; msgDiv.appendChild(p); }
        if (imageUrl) { const img = document.createElement('img'); img.src = imageUrl; msgDiv.appendChild(img); }
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
        messagesHistory.push({ role, content: text || "[Медиа]", imageUrl });
    }

    function handleFile(input) {
        const file = input.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            currentImageUrl = e.target.result;
            document.getElementById('image-preview').src = currentImageUrl;
            document.getElementById('preview-container').style.display = 'block';
        }
        reader.readAsDataURL(file);
    }

    function clearImage() {
        currentImageUrl = null;
        document.getElementById('file-input').value = "";
        document.getElementById('preview-container').style.display = 'none';
    }

    function dataUrlToBlob(dataUrl) {
        const arr = dataUrl.split(','), mime = arr[0].match(/:(.*?);/)[1];
        const bstr = atob(arr[1]); let n = bstr.length; const u8arr = new Uint8Array(n);
        while(n--){ u8arr[n] = bstr.charCodeAt(n); }
        return new Blob([u8arr], {type:mime});
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        const currentModel = document.getElementById('model-select').value;

        if (!text && !currentImageUrl) return;
        input.value = "";
        addMsg("user", text, currentImageUrl);
        
        const savedImgUrl = currentImageUrl;
        clearImage();

        try {
            if (currentModel === "image-gen") {
                await doImageGen(text);
            } else if (currentModel === "image-edit") {
                if (!savedImgUrl) { addMsg("assistant", "Ошибка: Загрузите фото через 📷"); return; }
                await doImageEdit(savedImgUrl, text);
            } else {
                await doChat(text, savedImgUrl, currentModel);
            }
        } catch (err) {
            addMsg("assistant", `Ошибка: ${err.message}`);
        }
    }

    async function doChat(text, imageUrl, currentModel) {
        const history = messagesHistory.slice(0, -1);
        const messages = [{role: "system", content: "Ты полезный ИИ-ассистент. Отвечай на русском. Будь краток."}];
        
        // Ограничиваем историю контекста тремя последними сообщениями для экономии токенов
        history.slice(-3).forEach(m => {
            if (m.content && m.content !== "[Медиа]") messages.push({role: m.role, content: m.content});
        });

        if (imageUrl && VISION_MODELS.has(currentModel)) {
            messages.push({role: "user", content: [
                {type: "image_url", image_url: {url: imageUrl, detail: "low"}}, // Экономичный режим распознавания фото
                {type: "text", text: text || "Что на фото?"}
            ]});
        } else {
            messages.push({role: "user", content: text});
        }

        const resp = await fetch(CHAT_URL, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({model: currentModel, messages, max_tokens: 500})
        });
        
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error?.message || "Ошибка сервера");
        addMsg("assistant", data.choices[0].message.content);
    }

    async function doImageGen(text) {
        const resp = await fetch(IMAGE_GEN_URL, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({model: "dall-e-3", prompt: text, size: "1024x1024"})
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error?.message || "Ошибка генерации");
        addMsg("assistant", "", data.data[0].url);
    }

    async function doImageEdit(imageUrl, text) {
        const blob = dataUrlToBlob(imageUrl);
        const form = new FormData();
        form.append("model", "dall-e-2");
        form.append("prompt", text);
        form.append("size", "1024x1024");
        form.append("image", blob, "image.png");

        const resp = await fetch(IMAGE_EDIT_URL, { method: "POST", body: form });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error?.message || "Ошибка редактирования");
        addMsg("assistant", "", data.data[0].url);
    }
</script>
</body>
</html>
