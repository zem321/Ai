<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>АрбузAI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --bg: #f9f9f9;
  --white: #ffffff;
  --surface: rgba(255,255,255,0.75);
  --surface2: rgba(242,242,247,0.8);
  --border: rgba(0,0,0,0.06);
  --text: #191919;
  --text2: #6e6e73;
  --text3: #bcbcc2;
  --accent: #10a37f;
  --msg-user-bg: #f4f4f4;
  --radius: 24px;
  --radius-sm: 16px;
  --radius-xs: 12px;
  --blur: blur(25px);
  --shadow: 0 8px 32px rgba(0,0,0,0.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --white: #1c1c1e;
    --surface: rgba(28,28,30,0.8);
    --surface2: rgba(44,44,46,0.7);
    --border: rgba(255,255,255,0.08);
    --text: #ffffff;
    --text2: #aeaeb2;
    --text3: #48484a;
    --accent: #34c759;
    --msg-user-bg: #2c2c2e;
    --shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Inter', -apple-system, sans-serif; }
body { background: var(--bg); color: var(--text); overflow: hidden; position: fixed; width: 100%; height: 100%; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }

/* Header */
header { background: var(--surface); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: fixed; top: 0; width: 100%; z-index: 10; height: 56px; }
.model-badge { display: flex; align-items: center; gap: 6px; background: var(--surface2); padding: 6px 12px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; color: var(--text); border: 1px solid var(--border); cursor: pointer; transition: transform 0.1s; }
.model-badge:active { transform: scale(0.97); }
.header-btn { background: none; border: none; color: var(--text2); padding: 6px; cursor: pointer; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
.header-btn:active { background: var(--surface2); }

/* Messages Container */
#messages { flex: 1; overflow-y: auto; padding: 72px 16px 140px 16px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
.msg { display: flex; flex-direction: column; max-width: 82%; animation: fadeIn 0.2s ease-out; position: relative; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { align-self: flex-end; }
.msg.ai { align-self: flex-start; }
.msg-bubble { padding: 12px 16px; border-radius: var(--radius); font-size: 15px; line-height: 1.45; word-wrap: break-word; }
.msg.user .msg-bubble { background: var(--msg-user-bg); color: var(--text); border-bottom-right-radius: 4px; }
.msg.ai .msg-bubble { background: transparent; color: var(--text); border-bottom-left-radius: 4px; padding: 4px 0; }
.msg img { max-width: 100%; border-radius: var(--radius-sm); margin-top: 6px; border: 1px solid var(--border); box-shadow: var(--shadow); }
.msg-doc { display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--border); padding: 10px 14px; border-radius: var(--radius-sm); margin-top: 6px; text-decoration: none; color: var(--text); font-size: 14px; font-weight: 500; }

/* Input Panel */
.input-panel { position: fixed; bottom: 0; width: 100%; background: var(--surface); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border-top: 1px solid var(--border); padding: 8px 12px env(safe-area-inset-bottom) 12px; z-index: 10; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 -4px 24px rgba(0,0,0,0.02); }
.attachments-bar { display: flex; gap: 8px; overflow-x: auto; padding: 0 4px; }
.attachment-preview { position: relative; display: inline-block; width: 52px; height: 52px; flex-shrink: 0; }
.attachment-preview img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-xs); border: 1px solid var(--border); }
.attachment-preview .doc-icon { width: 100%; height: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-xs); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; padding: 4px; text-align: center; overflow: hidden; }
.attachment-preview .remove-btn { position: absolute; top: -6px; right: -6px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; display: flex; align-items: center; justify-content: center; }

.input-row { display: flex; align-items: flex-end; gap: 8px; background: var(--surface2); border: 1px solid var(--border); padding: 6px 6px 6px 12px; border-radius: var(--radius); }
textarea { flex: 1; background: none; border: none; resize: none; color: var(--text); font-size: 15px; line-height: 1.35; max-height: 140px; min-height: 24px; padding: 4px 0; outline: none; }
.action-btn { background: none; border: none; color: var(--text2); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.action-btn:active { background: var(--border); }
#sendBtn { background: var(--text); color: var(--bg); }
#sendBtn:disabled { background: none; color: var(--text3); }

/* Bottom Sheets */
.sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
.sheet-overlay.show { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--white); border-top-left-radius: var(--radius); border-top-right-radius: var(--radius); z-index: 101; transform: translateY(100%); transition: transform 0.25s cubic-bezier(0.1, 0.7, 0.1, 1); padding: 16px 16px calc(20px + env(safe-area-inset-bottom)) 16px; max-height: 85%; overflow-y: auto; box-shadow: 0 -8px 32px rgba(0,0,0,0.15); }
.sheet.show { transform: translateY(0); }
.sheet-handle { width: 36px; height: 5px; background: var(--text3); border-radius: 3px; margin: 0 auto 16px auto; }
.sheet-title { font-size: 17px; font-weight: 600; margin-bottom: 16px; text-align: center; }
.list-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 15px; font-weight: 500; transition: background 0.1s; }
.list-item:active { background: var(--surface2); }
.list-item.selected { color: var(--accent); }
.list-item-desc { font-size: 12px; color: var(--text2); font-weight: 400; margin-top: 2px; }

/* Typing Indicator */
.typing { display: flex; align-items: center; gap: 4px; padding: 8px 12px; background: var(--surface2); border-radius: var(--radius-sm); width: fit-content; }
.typing span { width: 6px; height: 6px; background: var(--text2); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
.typing span:nth-child(1) { animation-delay: -0.32s; }
.typing span:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

/* Quick Tags */
.quick-tags { display: flex; gap: 8px; overflow-x: auto; padding: 4px 12px; position: fixed; bottom: 64px; width: 100%; z-index: 9; -webkit-overflow-scrolling: touch; }
.quick-tags::-webkit-scrollbar { display: none; }
.tag-btn { background: var(--surface); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--border); padding: 6px 12px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; color: var(--text2); white-space: nowrap; box-shadow: var(--shadow); }
.tag-btn:active { transform: scale(0.97); background: var(--surface2); }

/* Toast */
#toast { position: fixed; top: 72px; left: 50%; transform: translateX(-50%) translateY(-20px); background: rgba(0,0,0,0.8); color: white; padding: 8px 16px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; z-index: 1000; opacity: 0; pointer-events: none; transition: all 0.2s ease; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <button class="header-btn" onclick="openSheet('historySheet')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </button>
  <div class="model-badge" onclick="openSheet('modelSheet')">
    <span id="modelNameDisplay">Claude Haiku</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
  </div>
  <button class="header-btn" onclick="clearCurrentChat()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
  </button>
</header>

<div id="messages"></div>

<div class="quick-tags" id="quickTags">
  <button class="tag-btn" onclick="setInput('Нарисуй ')">🎨 Нарисуй</button>
  <button class="tag-btn" onclick="setInput('Сделай документ ')">📝 Сделай документ</button>
  <button class="tag-btn" onclick="setInput('Исправь фото ')">✨ Исправь фото</button>
</div>

<div class="input-panel">
  <div class="attachments-bar" id="attachmentsBar" style="display:none;"></div>
  <div class="input-row">
    <button class="action-btn" onclick="triggerUpload()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
    </button>
    <textarea id="textInput" placeholder="Сообщение..." rows="1" oninput="autoResize(this); updateSendBtn();" onkeydown="handleKey(e)"></textarea>
    <button class="action-btn" id="sendBtn" disabled onclick="sendMessage()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<input type="file" id="fileInput" style="display:none;" multiple onchange="handleFileSelect(this)">

<div class="sheet-overlay" id="overlay" onclick="closeAllSheets()"></div>

<div class="sheet" id="modelSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Выбор модели ИИ</div>
  <div id="modelsList"></div>
</div>

<div class="sheet" id="historySheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">История диалогов</div>
  <div class="list-item" onclick="createNewChat(); closeAllSheets();" style="color:var(--accent); justify-content:center;">
    ➕ Создать новый чат
  </div>
  <div id="chatsList" style="margin-top:8px;"></div>
</div>

<div id="toast"></div>

<script>
// Направляем запросы напрямую на прокси-хаб, минуя Railway бэкенд бота
const API_BASE = "https://ai-proxy.izisoft.xyz/v1";
const IMAGE_GEN_URL = "https://ai-proxy.izisoft.xyz/v1/image/generation";
const IMAGE_EDIT_URL = "https://ai-proxy.izisoft.xyz/v1/images/edits";

// Сюда бэкенд на Python автоматически пропишет твой ключ при отдаче страницы
let API_KEY = ""; 

const MODELS = [
  {id:"claude-haiku-4-5-20251001", name:"Claude Haiku", desc:"Самая быстрая и экономичная модель"},
  {id:"gpt-4o-mini", name:"GPT-4o Mini", desc:"Универсальная легкая модель от OpenAI"},
  {id:"claude-sonnet-4-5-20251001", name:"Claude Sonnet", desc:"Мощный интеллект для сложных задач"},
  {id:"gpt-4o", name:"GPT-4o", desc:"Флагманская модель OpenAI"}
];
const VISION_MODELS = new Set(["gpt-4o-mini","gpt-4o","claude-sonnet-4-5-20251001"]);

let currentModel = localStorage.getItem("selected_model") || "claude-haiku-4-5-20251001";
let currentChatId = null;
let chats = {};
let attachedFiles = [];
let isLoading = false;

const tg = window.Telegram?.WebApp;
if(tg) { tg.ready(); tg.expand(); if(tg.headerColor) tg.setHeaderColor('theme_color'); }

function haptic(){ if(tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); }

// ── Инициализация ──
window.onload = function() {
  try { chats = JSON.parse(localStorage.getItem("ai_chats")) || {}; } catch(e) { chats = {}; }
  currentChatId = localStorage.getItem("current_chat_id");
  if (!currentChatId || !chats[currentChatId]) { createNewChat(); } else { renderMessages(); }
  renderModels(); renderChatsList(); updateModelDisplay();
}

function updateModelDisplay() {
  const m = MODELS.find(x=>x.id===currentModel);
  document.getElementById("modelNameDisplay").textContent = m ? m.name : "Модель";
}

function renderModels() {
  const container = document.getElementById("modelsList");
  container.innerHTML = MODELS.map(m => `
    <div class="list-item ${m.id===currentModel?'selected':''}" onclick="selectModel('${m.id}')">
      <div>
        <div>${m.name}</div>
        <div class="list-item-desc">${m.desc}</div>
      </div>
      ${m.id===currentModel?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>':''}
    </div>
  `).join('');
}

function selectModel(id) { haptic(); currentModel = id; localStorage.setItem("selected_model", id); updateModelDisplay(); renderModels(); closeAllSheets(); }

// ── Логика чатов ──
function createNewChat() {
  currentChatId = 'chat_' + Date.now();
  chats[currentChatId] = { title: "Новый чат", messages: [] };
  saveChats(); renderMessages(); renderChatsList();
}

function clearCurrentChat() {
  haptic();
  if(chats[currentChatId]) {
    chats[currentChatId].messages = [];
    chats[currentChatId].title = "Новый чат";
    saveChats(); renderMessages(); renderChatsList();
    showToast("История чата очищена");
  }
}

function saveChats() { localStorage.setItem("ai_chats", JSON.stringify(chats)); localStorage.setItem("current_chat_id", currentChatId); }

function renderChatsList() {
  const container = document.getElementById("chatsList");
  const items = Object.keys(chats).reverse().map(id => {
    const c = chats[id];
    const active = id === currentChatId ? 'selected' : '';
    return `
      <div class="list-item ${active}" onclick="switchChat('${id}')">
        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:85%;">${c.title}</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:0.5;" onclick="deleteChat(event,'${id}')"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      </div>
    `;
  }).join('');
  container.innerHTML = items || '<div style="text-align:center;color:var(--text3);padding:16px;">Нет истории</div>';
}

function switchChat(id) { haptic(); currentChatId = id; saveChats(); renderMessages(); renderChatsList(); closeAllSheets(); }

function deleteChat(e, id) {
  e.stopPropagation(); haptic();
  delete chats[id];
  if(currentChatId === id) { currentChatId = Object.keys(chats)[0] || null; }
  if(!currentChatId) { createNewChat(); } else { saveChats(); renderMessages(); }
  renderChatsList();
}

function getMessages() { return chats[currentChatId]?.messages || []; }

function addMsg(role, text, imageUrl=null, docUrl=null, docName=null) {
  const m = { role, content: text, imageUrl, docUrl, docName };
  if(!chats[currentChatId]) createNewChat();
  chats[currentChatId].messages.push(m);
  if(role === "user" && chats[currentChatId].title === "Новый чат" && text) {
    chats[currentChatId].title = text.substring(0,24) + (text.length>24?'...':'');
    renderChatsList();
  }
  saveChats(); renderMessages();
}

function renderMessages() {
  const container = document.getElementById("messages");
  const list = getMessages();
  if(!list.length) {
    container.innerHTML = `<div style="margin:auto; text-align:center; color:var(--text3); max-width:240px; font-size:14px; font-weight:500;">👋 Привет! Я твой ИИ ассистент. Могу общаться, писать документы или создавать картинки.</div>`;
    return;
  }
  container.innerHTML = list.map(m => {
    let cls = m.role === "user" ? "user" : "ai";
    let body = '';
    if(m.content) body += `<div class="msg-bubble-text">${formatText(m.content)}</div>`;
    if(m.imageUrl) body += `<img src="${m.imageUrl}" onclick="previewImage('${m.imageUrl}')">`;
    if(m.docUrl) body += `<a class="msg-doc" href="${m.docUrl}" download="${m.docName || 'document.doc'}">📁 <span>${m.docName || 'Скачать документ'}</span></a>`;
    return `<div class="msg ${cls}"><div class="msg-bubble">${body}</div></div>`;
  }).join('');
  setTimeout(() => container.scrollTop = container.scrollHeight, 30);
}

// ── Файлы и вложения ──
function triggerUpload() { haptic(); document.getElementById("fileInput").click(); }

function handleFileSelect(input) {
  const files = Array.from(input.files);
  files.forEach(file => {
    if(attachedFiles.length >= 2) { showToast("Максимум 2 файла"); return; }
    const reader = new FileReader();
    if(file.type.startsWith("image/")) {
      reader.onload = function(e) {
        resizeImage(e.target.result, 800, 800, 0.7, (compressed) => {
          attachedFiles.push({ name: file.name, base64: compressed, originalBase64: e.target.result });
          renderAttachments();
        });
      };
      reader.readAsDataURL(file);
    } else {
      reader.onload = function(e) {
        attachedFiles.push({ name: file.name, text: e.target.result });
        renderAttachments();
      };
      reader.readAsText(file);
    }
  });
  input.value = "";
}

function resizeImage(base64Str, maxWidth, maxHeight, quality, callback) {
  const img = new Image();
  img.src = base64Str;
  img.onload = function() {
    let width = img.width; let height = img.height;
    if (width > height) { if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; } }
    else { if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; } }
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, width, height);
    callback(canvas.toDataURL('image/jpeg', quality));
  };
}

function renderAttachments() {
  const bar = document.getElementById("attachmentsBar");
  if(!attachedFiles.length) { bar.style.display = "none"; updateSendBtn(); return; }
  bar.style.display = "flex";
  bar.innerHTML = attachedFiles.map((f, i) => `
    <div class="attachment-preview">
      ${f.base64 ? `<img src="${f.base64}">` : `<div class="doc-icon">${f.name.split('.').pop()}</div>`}
      <button class="remove-btn" onclick="removeAttachment(${i})">×</button>
    </div>
  `).join('');
  updateSendBtn();
}

function removeAttachment(i) { haptic(); attachedFiles.splice(i, 1); renderAttachments(); }
function clearFiles() { attachedFiles = []; renderAttachments(); }

function detectIntent(text, hasImage) {
  const t = text.toLowerCase();
  if(t.startsWith("нарисуй") || t.startsWith("сгенерируй") || t.startsWith("draw") || t.startsWith("image")) return "image";
  if(hasImage && (t.includes("исправь") || t.includes("измени") || t.includes("edit") || t.includes("замени"))) return "edit";
  if(t.startsWith("сделай документ") || t.startsWith("создай документ") || t.startsWith("документ")) return "doc";
  return "chat";
}

// ── Отправка сообщений и логика запросов (ПРЯМЫЕ ЗАПРОСЫ) ──
async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById("textInput");
  const text = input.value.trim();
  if (!text && !attachedFiles.length) return;

  haptic();
  const files = [...attachedFiles];
  const hasImage = files.some(f=>f.base64);
  const intent = detectIntent(text, hasImage);

  input.value=""; autoResize(input); clearFiles(); updateSendBtn(); isLoading=true;

  const imageUrl = hasImage ? files.find(f=>f.base64)?.originalBase64||files.find(f=>f.base64)?.base64 : null;
  const compressedImageUrl = hasImage ? files.find(f=>f.base64)?.base64 : null;
  const docFile = files.find(f=>f.text!==undefined);
  
  addMsg("user", text||"[Медиа]", imageUrl, null, docFile?.name||null);
  showTyping();

  try {
    if (intent === "image") await doImageGen(text);
    else if (intent === "edit" && compressedImageUrl) await doImageEdit(compressedImageUrl, text);
    else if (intent === "doc") await doDocGen(text);
    else await doChat(text, compressedImageUrl, docFile);
  } catch(e) {
    hideTyping();
    addMsg("assistant", `❌ Ошибка: ${e.message}`);
  }
  isLoading=false; updateSendBtn();
}

async function doChat(text, imageUrl, docFile) {
  const history = getMessages().slice(0,-1);
  const messages = [{role:"system",content:"Ты полезный ИИ-ассистент. Отвечай на русском если вопрос на русском. Будь точным и лаконичным."}];
  
  // КРИТИЧЕСКАЯ ЭКОНОМИЯ ТОКЕНОВ: Передаем только 3 последних сообщения вместо 6. Хвост не растет!
  history.slice(-3).forEach(m=>{ if(m.content&&!m.imageUrl) messages.push({role:m.role,content:m.content}); });

  let docText = docFile?.text ? "\n\nСодержимое документа:\n"+docFile.text.substring(0,1500) : "";

  if (imageUrl && VISION_MODELS.has(currentModel)) {
    messages.push({role:"user",content:[
      {type:"image_url",image_url:{url:imageUrl}},
      {type:"text",text:(text||"Опиши фото")+docText}
    ]});
  } else {
    messages.push({role:"user",content:text+docText});
  }

  const resp = await fetch(`${API_BASE}/chat/completions`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization": `Bearer ${API_KEY}`
    },
    body:JSON.stringify({model:currentModel,messages,max_tokens:700,temperature:0.7}) // Ответ зажат до 700 токенов
  });
  const raw = await resp.text();
  let data; try{data=JSON.parse(raw);}catch(e){throw new Error(raw.substring(0,200));}
  if(!resp.ok) throw new Error(JSON.stringify(data));
  hideTyping();
  addMsg("assistant", data.choices[0].message.content);
}

async function doDocGen(text) {
  const messages = [
    {role:"system",content:"Создай содержимое документа. Используй markdown: # заголовки, **жирный**, списки."},
    {role:"user",content:text}
  ];
  const resp = await fetch(`${API_BASE}/chat/completions`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization": `Bearer ${API_KEY}`
    },
    body:JSON.stringify({model:currentModel,messages,max_tokens:1000,temperature:0.7})
  });
  const data = await resp.json();
  if(!resp.ok) throw new Error(JSON.stringify(data));
  const content = data.choices[0].message.content;
  hideTyping();
  const blob = makeDocBlob(content);
  const url = URL.createObjectURL(blob);
  const name = `arbuz_${Date.now()}.doc`;
  addMsg("assistant",content,null,url,name);
}

// ── Вспомогательные утилиты ──
function dataUrlToBlob(dataUrl) {
  const arr = dataUrl.split(','); const mime = arr[0].match(/:(.*?);/)[1];
  const bstr = atob(arr[1]); let n = bstr.length; const u8arr = new Uint8Array(n);
  while(n--) { u8arr[n] = bstr.charCodeAt(n); }
  return new Blob([u8arr], {type:mime});
}

function makeDocBlob(htmlOrText) {
  const t = `<html><head><meta charset="utf-8"></head><body>${formatText(htmlOrText)}</body></html>`;
  return new Blob([t], {type:"application/msword"});
}

// ── Интерфейс и шторки ──
let activeSheetId = null;
function openSheet(id) { haptic(); document.getElementById("overlay").classList.add("show"); document.getElementById(id).classList.add("show"); activeSheetId = id; }
function closeAllSheets() { document.getElementById("overlay").classList.remove("show"); if(activeSheetId) { document.getElementById(activeSheetId).classList.remove("show"); activeSheetId = null; } }

let typingEl=null;
function showTyping(){typingEl=document.createElement(\"div\");typingEl.className=\"msg ai\";typingEl.innerHTML=`<div class=\"typing\"><span></span><span></span><span></span></div>`;document.getElementById(\"messages\").appendChild(typingEl);document.getElementById(\"messages\").scrollTop=99999;}
function hideTyping(){if(typingEl){typingEl.remove();typingEl=null;}}

function setInput(t){haptic();const el=document.getElementById(\"textInput\");el.value=t;el.focus();autoResize(el);updateSendBtn();}
function handleKey(e){if(e.key===\"Enter\"&&!e.shiftKey){e.preventDefault();sendMessage();}}
function autoResize(el){el.style.height=\"auto\";el.style.height=Math.min(el.scrollHeight,140)+\"px\";}
function updateSendBtn(){const t=document.getElementById(\"textInput\").value.trim();document.getElementById(\"sendBtn\").disabled=isLoading||(!t&&!attachedFiles.length);}
function showToast(msg){const t=document.getElementById(\"toast\");t.textContent=msg;t.classList.add(\"show\");setTimeout(()=>t.classList.remove(\"show\"),2000);}
function formatText(t){return escapeHtml(t).replace(/```[\\w]*\\n?([\\s\\S]*?)```/g,'<pre><code>$1</code></pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\\*\\*([^*]+)\\*\\*/g,'<strong>$1</strong>').replace(/\\n/g,'<br>');}
function escapeHtml(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function previewImage(url){if(tg?.showPopup){tg.showPopup({title:'Просмотр изображения',message:'',buttons:[{type:'close',text:'Закрыть'}]});}}
</script>
